<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم — SpeakUp</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F9FC;--card:#fff;--ink:#1F2433;--soft:#6B7389;--line:#E7EBF2;--hl:#FFC940;--gold-soft:#FFF5D6;--good:#1DB36B;--good-bg:#E6F8EE;--bad:#FF5A5F;--bad-bg:#FFEDEE;--sky:#F3F6FB;--primary:#2F6BFF;--primary-d:#1D4FD6;--on-primary:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#0F1420;--card:#161D2C;--ink:#EEF2FF;--soft:#9AA6C4;--line:#253049;--hl:#FFC940;--gold-soft:#3A3014;--good:#1DB36B;--good-bg:#133426;--bad:#FF5A5F;--bad-bg:#3A1C22;--sky:#1B2437;--primary:#4C82FF;--primary-d:#2F5FD6;--on-primary:#fff}}
*{box-sizing:border-box}body{margin:0;font-family:'Baloo Bhaijaan 2',system-ui,Tahoma,sans-serif;font-weight:500;background:var(--paper);color:var(--ink);line-height:1.6}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar b{flex:1;font-size:1.35rem;font-weight:800;color:var(--primary)}
main{max-width:1100px;margin:0 auto;padding:18px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}
.btn{border:none;background:var(--primary);color:var(--on-primary);border-radius:14px;padding:9px 16px;font-weight:800;box-shadow:0 3px 0 var(--primary-d)}.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.good{background:var(--good);color:#fff;box-shadow:0 3px 0 #13904F}.btn.bad{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}.btn.sm{padding:4px 10px;font-size:.88rem}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 14px;color:var(--ink);font-weight:800;box-shadow:0 3px 0 var(--line)}.tabs button[aria-pressed="true"]{background:#E8F0FF;border-color:var(--primary);color:var(--primary);box-shadow:0 3px 0 var(--primary)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.stats div{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}.stats b{display:block;font-size:1.7rem;font-weight:800;color:var(--primary)}.stats span{color:var(--soft);font-size:.88rem}
table{width:100%;border-collapse:collapse;font-size:.93rem}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}th{background:var(--sky);font-weight:600}
.scroll{overflow-x:auto}.muted{color:var(--soft)}.en{direction:ltr;unicode-bidi:isolate}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;border:1px solid var(--line)}.chip.ok{background:var(--good-bg);border-color:var(--good)}.chip.no{background:var(--bad-bg);border-color:var(--bad)}.chip.wait{background:var(--sky)}
input.in,select.in{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fb{border-radius:10px;padding:10px 14px;margin-bottom:12px}.fb.bad{background:var(--bad-bg)}.fb.good{background:var(--good-bg)}
.chart{display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid var(--line);margin-top:8px}.chart .day{flex:1;height:100%;display:flex;align-items:flex-end}
.chart .stack{display:flex;align-items:flex-end;gap:1px;width:100%;height:100%}.chart .stack i{flex:1;min-height:1px;border-radius:2px 2px 0 0}
.legend{display:flex;gap:14px;font-size:.85rem;color:var(--soft)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px}
.lb{display:grid;grid-template-columns:140px 1fr 40px;gap:8px;align-items:center;margin:6px 0}.lb>div{background:var(--sky);border-radius:99px;height:10px;overflow:hidden}.lb i{display:block;height:100%;background:var(--primary);border-radius:99px}.lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login{max-width:400px;margin:60px auto}.login label{display:block;margin:10px 0}.login input{width:100%}
</style>
</head>
<body>
<header><div class="bar"><b>👑 لوحة التحكم</b><span id="who" class="muted"></span></div></header>
<main id="app"><div class="panel">جاري التحميل…</div></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CFG=window.APP_CONFIG,sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt=d=>d?new Date(d).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"}):"—";
const cur=CFG.CURRENCY||"";
let ST={user:null,prof:null,ready:false,tab:"req",filter:"pending",reqs:[],users:[],plans:[],coupons:[],settings:{},stats:null,an:null,anDays:30,q:"",err:null,msg:null,busy:false};
const METHOD=id=>(CFG.PAYMENT_METHODS.find(m=>m.id===id)||{name:id}).name;
const active=u=>u.plan_until&&new Date(u.plan_until)>new Date();

async function load(){
  const [s,r,u,p]=await Promise.all([
    sb.rpc("admin_stats"),
    (()=>{let q=sb.from("payment_requests").select("*, profiles(email,full_name,phone), plans(name,months)").order("created_at",{ascending:false}).limit(200);if(ST.filter!=="all")q=q.eq("status",ST.filter);return q})(),
    (()=>{let q=sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(300);
      const t=ST.q.trim().replace(/[,()%]/g,"");if(t)q=q.or(`email.ilike.%${t}%,full_name.ilike.%${t}%,phone.ilike.%${t}%`);return q})(),
    sb.from("plans").select("*").order("sort")]);
  const [c,g,an]=await Promise.all([sb.from("coupons").select("*").order("created_at",{ascending:false}),sb.rpc("admin_get_settings"),sb.rpc("admin_analytics",{days:ST.anDays})]);
  ST.an=an.error?{error:an.error.message}:an.data;
  const er=s.error||r.error||u.error||p.error||c.error||g.error;
  ST.err=er?"تعذّر تحميل بعض البيانات: "+er.message+(/coupons|app_settings|admin_get_settings/.test(er.message||"")?" — شغّل ملف upgrade-v2.sql":""):null;
  ST.stats=s.data;ST.reqs=r.data||[];ST.users=u.data||[];ST.plans=p.data||[];ST.coupons=c.data||[];ST.settings=g.data||{};render()}

function vLogin(){return `<div class="panel login"><h2>دخول الأدمن</h2>${ST.err?`<div class="fb bad">${esc(ST.err)}</div>`:""}
  <label>الإيميل<input class="in en" id="em" type="email" autocomplete="email"></label><label>كلمة السر<input class="in en" id="pw" type="password" autocomplete="current-password"></label>
  <button class="btn" data-a="login" style="width:100%;margin-top:8px">دخول</button></div>`}
function vMain(){const s=ST.stats||{};
  return `${ST.err?`<div class="fb bad">${esc(ST.err)}</div>`:""}${ST.msg?`<div class="fb good">${esc(ST.msg)}</div>`:""}
  <div class="stats" style="margin-bottom:14px">
    <div><b>${s.pending??"—"}</b><span>طلبات بانتظارك</span></div><div><b>${s.active??"—"}</b><span>مشترك فعّال</span></div>
    <div><b>${s.users??"—"}</b><span>كل المستخدمين</span></div><div><b>${s.new_week??"—"}</b><span>جدد هالأسبوع</span></div>
    <div><b>${s.revenue_month!=null?+s.revenue_month+" "+cur:"—"}</b><span>دخل هالشهر</span></div><div><b>${s.revenue_total!=null?+s.revenue_total+" "+cur:"—"}</b><span>الدخل الكلي</span></div></div>
  <div class="tabs" style="margin-bottom:12px">${[["req","💳 طلبات الدفع"],["an","📊 الإحصائيات"],["users","👥 المستخدمين"],["plans","📦 الخطط والأسعار"],["coupons","🏷️ أكواد الخصم"],["settings","⚙️ الإعدادات"]].map(([k,l])=>`<button data-a="tab" data-v="${k}" aria-pressed="${ST.tab===k}">${l}</button>`).join("")}
    <button data-a="reload">🔄 تحديث</button></div>
  ${ST.tab==="an"?vAn():ST.tab==="req"?vReqs():ST.tab==="users"?vUsers():ST.tab==="coupons"?vCoupons():ST.tab==="settings"?vSettings():vPlans()}`}
function vReqs(){return `<div class="panel"><div class="row" style="margin-bottom:10px">${[["pending","⏳ معلّقة"],["approved","✅ مقبولة"],["rejected","❌ مرفوضة"],["all","الكل"]].map(([k,l])=>`<button class="btn ${ST.filter===k?"":"ghost"} sm" data-a="filter" data-v="${k}">${l}</button>`).join("")}</div>
  ${ST.reqs.length?`<div class="scroll"><table><thead><tr><th>التاريخ</th><th>المستخدم</th><th>الخطة</th><th>الطريقة</th><th>المرجع</th><th>الإيصال</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${ST.reqs.map(r=>`<tr><td>${fmt(r.created_at)}</td><td>${esc(r.profiles?.full_name||"")}<br><span class="muted en">${esc(r.profiles?.email||"")}</span><br><span class="muted en">${esc(r.profiles?.phone||"")}</span></td>
    <td>${esc(r.plans?.name||r.plan_id)}<br><b>${+r.amount} ${cur}</b>${r.coupon?`<br><small class="muted">🏷️ ${esc(r.coupon)} (كان ${+r.original_amount})</small>`:""}</td><td>${esc(METHOD(r.method))}</td><td class="en">${esc(r.reference||"—")}</td>
    <td>${r.proof_path?`<button class="btn ghost sm" data-a="proof" data-v="${esc(r.proof_path)}">عرض</button>`:"—"}</td>
    <td><span class="chip ${r.status==="approved"?"ok":r.status==="rejected"?"no":"wait"}">${{pending:"معلّق",approved:"مقبول",rejected:"مرفوض"}[r.status]}</span>${r.admin_note?`<br><small class="muted">${esc(r.admin_note)}</small>`:""}</td>
    <td>${r.status==="pending"?`<div class="row"><button class="btn good sm" data-a="approve" data-v="${r.id}" ${ST.busy?"disabled":""}>قبول وتفعيل</button><button class="btn bad sm" data-a="reject" data-v="${r.id}" ${ST.busy?"disabled":""}>رفض</button></div>`:""}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">ما في طلبات هون.</p>`}</div>`}
function vUsers(){return `<div class="panel"><div class="row" style="margin-bottom:10px"><input class="in" id="q" placeholder="ابحث بالاسم أو الإيميل أو الجوال" value="${esc(ST.q)}" style="flex:1;min-width:200px"><button class="btn" data-a="search">بحث</button></div>
  <div class="scroll"><table><thead><tr><th>المستخدم</th><th>المستوى</th><th>الاشتراك</th><th>تاريخ التسجيل</th><th>إجراءات</th></tr></thead><tbody>
  ${ST.users.map(u=>`<tr><td>${esc(u.full_name||"")} ${u.role==="admin"?"👑":""}<br><span class="muted en">${esc(u.email)}</span><br><span class="muted en">${esc(u.phone||"")}</span></td><td>${esc(u.level||"—")}</td>
    <td>${u.role==="admin"?`<span class="chip ok">أدمن</span>`:active(u)?`<span class="chip ${u.is_trial?"wait":"ok"}">${u.is_trial?"🎁 تجربة":"فعّال"}</span><br><small>لحد ${fmt(u.plan_until)}</small>`:`<span class="chip">مجاني</span>`}</td><td>${fmt(u.created_at)}</td>
    <td><div class="row"><select class="in" id="m_${u.id}"><option value="1">+ شهر</option><option value="3">+ 3 شهور</option><option value="12">+ سنة</option></select><button class="btn good sm" data-a="extend" data-v="${u.id}">تمديد</button>${active(u)?`<button class="btn bad sm" data-a="revoke" data-v="${u.id}">إلغاء</button>`:""}</div></td></tr>`).join("")}</tbody></table></div></div>`}
function vPlans(){return `<div class="panel"><p class="muted">عدّل الأسعار والأسماء، والتغيير بيظهر للمشتركين فوراً.</p><div class="scroll"><table><thead><tr><th>المعرّف</th><th>الاسم</th><th>الشهور</th><th>السعر (${cur})</th><th>مفعّلة</th><th></th></tr></thead><tbody>
  ${ST.plans.map(p=>`<tr><td class="en">${esc(p.id)}</td><td><input class="in" id="pn_${p.id}" value="${esc(p.name)}"></td><td><input class="in" id="pm_${p.id}" type="number" min="1" value="${p.months}" style="width:80px"></td><td><input class="in" id="pp_${p.id}" type="number" min="0" step="0.5" value="${+p.price}" style="width:100px"></td>
    <td><input type="checkbox" id="pa_${p.id}" ${p.active?"checked":""}></td><td><button class="btn sm" data-a="saveplan" data-v="${esc(p.id)}">حفظ</button></td></tr>`).join("")}
  <tr><td><input class="in en" id="np_id" placeholder="id" style="width:110px"></td><td><input class="in" id="np_name" placeholder="اسم الخطة"></td><td><input class="in" id="np_months" type="number" min="1" value="6" style="width:80px"></td><td><input class="in" id="np_price" type="number" min="0" value="100" style="width:100px"></td><td></td><td><button class="btn good sm" data-a="addplan">إضافة</button></td></tr>
  </tbody></table></div></div>`}
function bars(rows,key,color){const mx=Math.max(1,...rows.map(r=>+r[key]||0));return rows.map(r=>`<div class="bar" title="${r.d}: ${r[key]}"><i style="height:${Math.round(100*(+r[key]||0)/mx)}%;background:${color}"></i></div>`).join("")}
function listBars(rows,tr){const mx=Math.max(1,...rows.map(r=>r.c));return rows.length?rows.map(r=>`<div class="lb"><span>${esc(tr?tr(r.s):r.s)}</span><div><i style="width:${Math.round(100*r.c/mx)}%"></i></div><b>${r.c}</b></div>`).join(""):`<p class="muted">ما في بيانات لسا.</p>`}
function vAn(){const a=ST.an;if(!a)return `<div class="panel">جاري التحميل…</div>`;
  if(a.error)return `<div class="panel"><div class="fb bad">الإحصائيات مش جاهزة: شغّل ملف <b>upgrade-v3.sql</b> في Supabase.</div></div>`;
  const conv=a.visits?Math.round(1000*a.signups/a.visits)/10:0,pay=a.signups?Math.round(1000*a.paid/a.signups)/10:0,d=a.daily||[];
  const base=location.href.replace(/admin\.html.*$/,"");
  return `<div class="panel"><div class="row" style="margin-bottom:12px"><b>الفترة:</b>${[[7,"أسبوع"],[30,"شهر"],[90,"3 شهور"]].map(([n,l])=>`<button class="btn ${ST.anDays===n?"":"ghost"} sm" data-a="andays" data-v="${n}">${l}</button>`).join("")}</div>
    <div class="stats"><div><b>${a.visits}</b><span>زيارة</span></div><div><b>${a.signups}</b><span>تسجيل جديد</span></div><div><b>${conv}%</b><span>من الزوار سجّلوا</span></div>
      <div><b>${a.requests}</b><span>طلب اشتراك</span></div><div><b>${a.paid}</b><span>اشتراك مفعّل</span></div><div><b>${+a.revenue} ${cur}</b><span>دخل الفترة</span></div></div></div>
  <div class="panel"><h3>يومياً</h3><div class="legend"><span><i style="background:#C7D8FF"></i>زيارات</span><span><i style="background:#2F6BFF"></i>تسجيلات</span><span><i style="background:#1DB36B"></i>اشتراكات</span></div>
    <div class="chart">${d.map(r=>`<div class="day" title="${r.d}"><div class="stack">${["visits","signups","paid"].map((k,i)=>{const mx=Math.max(1,...d.map(x=>+x[k]||0));return `<i style="height:${Math.round(100*(+r[k]||0)/mx)}%;background:${["#C7D8FF","#2F6BFF","#1DB36B"][i]}"></i>`}).join("")}</div></div>`).join("")}</div>
    <div class="spread muted" style="font-size:.8rem"><span>${d[0]?d[0].d:""}</span><span>${d.length?d[d.length-1].d:""}</span></div></div>
  <div class="panel"><h3>من وين إجو الزوار؟</h3>${listBars(a.sources||[])}
    <p class="muted" style="margin-top:10px">💡 لما تنشر الرابط بمكان، ضيف لآخره <b class="en">?src=</b> واسم المكان، عشان تعرف مين جاب زوار أكثر:</p>
    <div class="en" style="background:var(--sky);padding:8px 10px;border-radius:8px;font-size:.88rem;line-height:1.9">${esc(base)}?src=facebook<br>${esc(base)}?src=instagram<br>${esc(base)}?src=whatsapp</div></div>
  <div class="panel"><h3>الأجهزة</h3>${listBars(a.devices||[],x=>({mobile:"📱 جوال",desktop:"💻 كمبيوتر",app:"📲 التطبيق المثبّت"})[x]||x)}
    <h3>مستويات المستخدمين</h3>${listBars(a.levels||[])}</div>`}
function vCoupons(){return `<div class="panel"><p class="muted">الكود بيعطي خصم على سعر أي خطة. المشترك بيكتبه بصفحة الاشتراك، والخصم بينحسب على السيرفر.</p>
  <div class="row" style="margin-bottom:12px"><input class="in en" id="c_code" placeholder="CODE مثلاً SPEAK20" style="width:160px"><input class="in" id="c_pct" type="number" min="1" max="100" placeholder="نسبة %" style="width:100px">
  <input class="in" id="c_max" type="number" min="1" placeholder="أقصى استخدام (اختياري)" style="width:190px"><input class="in" id="c_exp" type="date" title="تاريخ الانتهاء (اختياري)"><button class="btn good" data-a="addcoupon">إضافة كود</button></div>
  ${ST.coupons.length?`<div class="scroll"><table><thead><tr><th>الكود</th><th>الخصم</th><th>الاستخدام</th><th>ينتهي</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${ST.coupons.map(c=>`<tr><td class="en"><b>${esc(c.code)}</b></td><td>${c.percent}%</td><td>${c.used_count}${c.max_uses?" / "+c.max_uses:""}</td><td>${c.expires_at?fmt(c.expires_at):"—"}</td>
    <td><span class="chip ${c.active?"ok":"no"}">${c.active?"فعّال":"موقّف"}</span></td><td><div class="row"><button class="btn ghost sm" data-a="togglecoupon" data-v="${esc(c.code)}">${c.active?"إيقاف":"تفعيل"}</button><button class="btn bad sm" data-a="delcoupon" data-v="${esc(c.code)}">حذف</button></div></td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">ما في أكواد لسا.</p>`}</div>`}
function vSettings(){const g=ST.settings||{};return `<div class="panel"><h3>🎁 التجربة المجانية</h3><p class="muted">عدد الأيام اللي بياخدها كل حساب جديد بكل الميزات. حط 0 لإلغاء التجربة.</p>
  <div class="row"><input class="in" id="s_trial" type="number" min="0" max="60" value="${esc(g.trial_days??3)}" style="width:100px"><span>يوم</span><button class="btn" data-a="savetrial">حفظ</button></div></div>
  <div class="panel"><h3>🔔 إشعارات تيليجرام</h3><p class="muted">كل ما حدا يبعت طلب اشتراك بتوصلك رسالة على تيليجرام.</p>
  <ol class="muted" style="line-height:2"><li>بتيليجرام افتح <b class="en">@BotFather</b>، وابعتله <b class="en">/newbot</b>، واختار اسم للبوت. رح يعطيك <b>Token</b>.</li>
  <li>افتح البوت اللي عملته واضغط <b>Start</b>.</li><li>افتح <b class="en">@userinfobot</b> واضغط Start، رح يعطيك رقمك (<b>Id</b>).</li><li>الصقهم هون واضغط حفظ، وبعدين «إرسال تجربة».</li></ol>
  <label style="display:block;margin:8px 0">Bot Token<input class="in en" id="s_tok" value="${esc(g.telegram_token||"")}" style="width:100%" autocomplete="off"></label>
  <label style="display:block;margin:8px 0">Chat Id<input class="in en" id="s_chat" value="${esc(g.telegram_chat_id||"")}" style="width:100%" autocomplete="off"></label>
  <div class="row"><button class="btn" data-a="savetg">حفظ</button><button class="btn ghost" data-a="testtg">إرسال تجربة</button></div></div>`}
function render(){$("#who").textContent=ST.user?ST.user.email:"";
  if(!ST.ready){$("#app").innerHTML=`<div class="panel">جاري التحميل…</div>`;return}
  if(!ST.user){$("#app").innerHTML=vLogin();return}
  if(!ST.prof||ST.prof.role!=="admin"){$("#app").innerHTML=`<div class="panel login"><h2>🚫 مش مسموح</h2><p>هاد الحساب مش أدمن.</p><div class="row"><a class="btn ghost" href="index.html">رجوع للموقع</a><button class="btn" data-a="logout">تسجيل خروج</button></div></div>`;return}
  $("#app").innerHTML=vMain()}
const act={
  login:async()=>{const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(error){ST.err="الإيميل أو كلمة السر غلط.";render()}},
  logout:()=>sb.auth.signOut(),
  tab:v=>{ST.tab=v;ST.msg=null;render()},
  filter:v=>{ST.filter=v;load()},
  reload:()=>{ST.msg=null;load()},
  search:()=>{ST.q=$("#q").value;load()},
  proof:async v=>{const {data,error}=await sb.storage.from("proofs").createSignedUrl(v,600);if(error){alert("تعذّر فتح الإيصال");return}window.open(data.signedUrl,"_blank","noopener")},
  approve:async v=>{if(!confirm("تأكدت من وصول المبلغ؟ رح يتفعّل الاشتراك."))return;ST.busy=true;render();const {error}=await sb.rpc("approve_payment",{req:+v});ST.busy=false;ST.msg=error?null:"تم التفعيل ✅";ST.err=error?error.message:null;load()},
  reject:async v=>{const note=prompt("سبب الرفض (بيظهر للمستخدم):","ما وصلنا التحويل");if(note===null)return;const {error}=await sb.rpc("reject_payment",{req:+v,note});ST.msg=error?null:"تم الرفض";ST.err=error?error.message:null;load()},
  extend:async v=>{const m=+$("#m_"+v).value;const {error}=await sb.rpc("admin_extend",{uid:v,months:m});ST.msg=error?null:"تم التمديد ✅";ST.err=error?error.message:null;load()},
  revoke:async v=>{if(!confirm("إلغاء اشتراك هاد المستخدم؟"))return;const {error}=await sb.rpc("admin_revoke",{uid:v});ST.msg=error?null:"انلغى الاشتراك";ST.err=error?error.message:null;load()},
  saveplan:async v=>{const {error}=await sb.from("plans").update({name:$("#pn_"+v).value.trim(),months:+$("#pm_"+v).value,price:+$("#pp_"+v).value,active:$("#pa_"+v).checked}).eq("id",v);ST.msg=error?null:"انحفظت الخطة ✅";ST.err=error?error.message:null;load()},
  andays:async v=>{ST.anDays=+v;const {data,error}=await sb.rpc("admin_analytics",{days:ST.anDays});ST.an=error?{error:error.message}:data;render()},
  addcoupon:async()=>{const code=$("#c_code").value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,""),pct=+$("#c_pct").value,mx=$("#c_max").value,ex=$("#c_exp").value;
    if(!code||!(pct>=1&&pct<=100)){alert("اكتب الكود ونسبة من 1 لـ 100");return}
    const {error}=await sb.from("coupons").insert({code,percent:pct,max_uses:mx?+mx:null,expires_at:ex?new Date(ex+"T23:59:59").toISOString():null});ST.msg=error?null:"انضاف الكود ✅";ST.err=error?(/duplicate/.test(error.message)?"الكود موجود من قبل":error.message):null;load()},
  togglecoupon:async v=>{const c=ST.coupons.find(x=>x.code===v);const {error}=await sb.from("coupons").update({active:!c.active}).eq("code",v);ST.msg=error?null:"تم ✅";ST.err=error?error.message:null;load()},
  delcoupon:async v=>{if(!confirm("حذف الكود "+v+"؟"))return;const {error}=await sb.from("coupons").delete().eq("code",v);ST.msg=error?null:"انحذف";ST.err=error?error.message:null;load()},
  savetrial:async()=>{const {error}=await sb.rpc("admin_set_setting",{k:"trial_days",v:String(Math.max(0,+$("#s_trial").value||0))});ST.msg=error?null:"انحفظ ✅";ST.err=error?error.message:null;load()},
  savetg:async()=>{const a=await sb.rpc("admin_set_setting",{k:"telegram_token",v:$("#s_tok").value});const b=await sb.rpc("admin_set_setting",{k:"telegram_chat_id",v:$("#s_chat").value});const e=a.error||b.error;ST.msg=e?null:"انحفظ ✅ جرّب «إرسال تجربة»";ST.err=e?e.message:null;load()},
  testtg:async()=>{const {error}=await sb.rpc("admin_test_telegram");ST.msg=error?null:"انبعتت رسالة تجربة، شيّك تيليجرام 📱";ST.err=error?error.message:null;render()},
  addplan:async()=>{const id=$("#np_id").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");if(!id||!$("#np_name").value.trim()){alert("عبّي المعرّف والاسم");return}
    const {error}=await sb.from("plans").insert({id,name:$("#np_name").value.trim(),months:+$("#np_months").value,price:+$("#np_price").value,sort:ST.plans.length+1});ST.msg=error?null:"انضافت الخطة ✅";ST.err=error?error.message:null;load()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.disabled)return;act[el.dataset.a]&&act[el.dataset.a](el.dataset.v)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="q")act.search();if(e.key==="Enter"&&e.target.id==="pw")act.login()});
sb.auth.onAuthStateChange((ev,session)=>{setTimeout(async()=>{ST.user=session?session.user:null;ST.prof=null;
  if(ST.user){const {data}=await sb.from("profiles").select("*").eq("id",ST.user.id).single();ST.prof=data}
  ST.ready=true;render();if(ST.prof&&ST.prof.role==="admin")load()},0)});
</script>
</body>
</html>
