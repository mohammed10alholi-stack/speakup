<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="تعلّم الإنجليزي وإنت بتحكيه: محادثة صوتية مع معلم ذكي، اختبار يحدد مستواك، كلمات بصوت وصور، قواعد، قصص، ألعاب وشهادات. جرّب مجاناً.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SpeakUp">
<meta property="og:title" content="SpeakUp — تعلّم الإنجليزي وإنت بتحكيه">
<meta property="og:description" content="محادثة صوتية مع معلم ذكي، مسار على قد مستواك، وشهادات. جرّب مجاناً 3 أيام.">
<meta property="og:image" content="https://speakup-ar.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://speakup-ar.com/">
<meta property="og:locale" content="ar_AR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://speakup-ar.com/og-image.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SpeakUp">
<title>SpeakUp — تعلّم الإنجليزي من الصفر للاحتراف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--elev:0 1px 2px rgba(16,24,40,.05),0 2px 8px -2px rgba(16,24,40,.08);--elev2:0 2px 4px rgba(16,24,40,.05),0 12px 24px -8px rgba(16,24,40,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#FFFFFF;--card:#FFFFFF;--ink:#1F2433;--ink-2:#3A4257;--soft:#6B7389;--line:#E7EBF2;--sky:#F3F6FB;--rule:#DCE2EC;--rule-faint:#EEF2F7;
  --primary:#2F6BFF;--primary-d:#1D4FD6;--primary-soft:#E8F0FF;--on-primary:#FFFFFF;
  --hl:#FFC940;--hl-d:#E3A600;--gold-soft:#FFF5D6;--on-hl:#3A2A00;
  --good:#1DB36B;--good-d:#13904F;--good-bg:#E6F8EE;--margin:#FF5A5F;--margin-d:#D93D43;--bad-bg:#FFEDEE;
  --purple:#8B5CF6;--orange:#FF8A1F;--pink:#FF6B9A;
  --font:"Rubik",system-ui,"Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1420;--card:#161D2C;--ink:#EEF2FF;--ink-2:#D5DCF0;--soft:#9AA6C4;--line:#253049;--sky:#1B2437;--rule:#2C3854;--rule-faint:#1A2233;
  --primary:#4C82FF;--primary-d:#2F5FD6;--primary-soft:#1D2A4A;--gold-soft:#3A3014;--good-bg:#133426;--bad-bg:#3A1C22}}
:root[data-theme="dark"]{--paper:#0F1420;--card:#161D2C;--ink:#EEF2FF;--ink-2:#D5DCF0;--soft:#9AA6C4;--line:#253049;--sky:#1B2437;--rule:#2C3854;--rule-faint:#1A2233;
  --primary:#4C82FF;--primary-d:#2F5FD6;--primary-soft:#1D2A4A;--gold-soft:#3A3014;--good-bg:#133426;--bad-bg:#3A1C22}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;font-family:var(--font);font-weight:500;font-size:16.5px;color:var(--ink);background:var(--paper);line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.en{direction:ltr;unicode-bidi:isolate}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.toki{display:inline-block;flex:none;vertical-align:middle}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.brand .logo{display:flex}
.brand b{display:block;font-weight:700;font-size:1.45rem;letter-spacing:-.01em;line-height:1;color:var(--primary)}
.brand small{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:.9rem;font-weight:700;white-space:nowrap;background:var(--sky)}
.c-xp{color:#C98A00}.c-streak{color:var(--orange)}.c-goal{color:var(--good)}
.icon-btn{border:none;background:var(--sky);border-radius:12px;width:36px;height:36px}

/* layout */
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:20px;margin-bottom:18px}
.hlpanel{border-color:var(--hl);background:var(--gold-soft)}
h1{font-size:1.7rem;font-weight:700;margin:0 0 4px;line-height:1.25}
h2{font-size:1.3rem;font-weight:700;margin:0 0 6px;line-height:1.3}
h3{font-size:1.05rem;font-weight:700;margin:20px 0 8px}
p{margin:0 0 10px}.muted{color:var(--soft);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.center{text-align:center}
.topbar{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.back{flex:none;width:42px;height:42px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:1.15rem;color:var(--soft);box-shadow:var(--elev)}
.lv{display:inline-block;direction:ltr;font-size:.8rem;font-weight:700;padding:0 9px;border-radius:9px;color:#fff;background:var(--primary);vertical-align:middle;line-height:1.7}
.lv-A1{background:var(--good)}.lv-A2{background:var(--primary)}.lv-B1{background:var(--purple)}.lv-B2{background:var(--orange)}

/* chunky 3D buttons */
.btn{border:none;background:var(--primary);color:var(--on-primary);border-radius:16px;padding:12px 22px;font-weight:700;font-size:1rem;letter-spacing:.01em;box-shadow:0 2px 0 var(--primary-d);transition:transform .08s,box-shadow .08s;position:relative;top:0}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:active{box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.hl{background:var(--hl);color:var(--on-hl);box-shadow:0 2px 0 var(--hl-d)}
.btn.good{background:var(--good);color:#fff;box-shadow:0 2px 0 var(--good-d)}
.btn.danger{color:var(--margin)}
.btn.big{padding:15px 30px;font-size:1.1rem;border-radius:18px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
a.btn{text-decoration:none;display:inline-block}
.say{border:none;background:var(--primary-soft);border-radius:12px;padding:5px 12px;font-size:.9rem;font-weight:700;color:var(--primary)}
.say.mini{padding:1px 8px;font-size:.8rem;margin-top:4px}
.linkbtn{border:none;background:none;color:var(--primary);font-weight:700;padding:0;text-decoration:none}
.play-big{width:96px;height:96px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:2.2rem;box-shadow:0 3px 0 var(--primary-d)}
.play-big:active{transform:translateY(6px);box-shadow:none}

/* the word */
.guide{direction:ltr;text-align:center;margin:18px 0 8px;padding:4px 8px}
.guide .w{font-weight:700;font-size:clamp(44px,12vw,78px);line-height:1.15;letter-spacing:-.015em;color:var(--ink);word-break:break-word;display:inline-block;padding-bottom:12px;
  background:linear-gradient(var(--hl),var(--hl)) center bottom/56px 7px no-repeat;border-radius:4px}
.guide.s .w{font-size:clamp(24px,6vw,34px);line-height:1.45;background-size:40px 5px}
.ar-big{font-size:clamp(24px,6.5vw,34px);font-weight:700;text-align:center;margin:14px 0;color:var(--primary)}

/* home greeting with Toki */
.greet{display:flex;align-items:flex-end;gap:10px;margin:0 0 18px}
.greet .toki{animation:float 3.2s ease-in-out infinite}
.greet .bubble{position:relative;flex:1;background:var(--primary-soft);border-radius:22px;border-bottom-right-radius:6px;padding:14px 16px}
.greet .bubble b{display:block;font-size:1.15rem;font-weight:700}
.greet .bubble span{display:block;color:var(--ink-2)}
.greet .bubble .btn{margin-top:10px}
@keyframes float{50%{transform:translateY(-6px)}}

/* tiles & lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.act{display:flex;gap:14px;align-items:center;text-align:start;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:14px;width:100%;box-shadow:var(--elev);transition:transform .08s,box-shadow .08s;color:var(--ink)}
.act:active{transform:translateY(4px);box-shadow:none}
.act .ic{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;line-height:1;background:#E8F0FF}
.act b{display:block;font-weight:700}.act span{color:var(--soft);font-size:.88rem;font-weight:500}
.grid>.act:nth-child(6n+2) .ic{background:#FFF3CC}.grid>.act:nth-child(6n+3) .ic{background:#E1F7EA}.grid>.act:nth-child(6n+4) .ic{background:#FFE6EF}.grid>.act:nth-child(6n+5) .ic{background:#EFE8FF}.grid>.act:nth-child(6n+6) .ic{background:#FFEBDD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .act .ic,:root:not([data-theme="light"]) .cat .ic,:root:not([data-theme="light"]) .feats .ic{background:var(--sky)!important}}
:root[data-theme="dark"] .act .ic,:root[data-theme="dark"] .cat .ic,:root[data-theme="dark"] .feats .ic{background:var(--sky)!important}
.act.locked{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.stats div{border:1.5px solid var(--line);border-radius:18px;padding:10px 14px}
.stats div b{display:block;font-size:1.6rem;font-weight:700;line-height:1.2;color:var(--primary)}.stats div span{color:var(--soft);font-size:.82rem}
.cat{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:none;border-bottom:2px solid var(--line);background:none;padding:12px 2px;color:var(--ink)}
.cat .ic{flex:none;width:46px;height:46px;border-radius:15px;background:#E8F0FF;display:grid;place-items:center;font-size:1.3rem}
.cat:nth-of-type(6n+2) .ic{background:#FFF3CC}.cat:nth-of-type(6n+3) .ic{background:#E1F7EA}.cat:nth-of-type(6n+4) .ic{background:#FFE6EF}.cat:nth-of-type(6n+5) .ic{background:#EFE8FF}.cat:nth-of-type(6n+6) .ic{background:#FFEBDD}
.cat .nm{flex:1;font-weight:700}
.meter{width:80px;height:10px;border-radius:99px;background:var(--rule-faint);overflow:hidden;flex:none}.meter i{display:block;height:100%;background:var(--good);border-radius:99px}
.seg{display:inline-flex;background:var(--sky);border-radius:16px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 15px;border-radius:12px;color:var(--soft);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--primary);box-shadow:0 2px 0 var(--line)}
input.answer,textarea.answer{width:100%;direction:ltr;text-align:left;font-size:1.2rem;padding:13px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--sky);font-weight:600}
textarea.answer{min-height:96px;font-size:1.05rem}
input.answer:focus,textarea.answer:focus{border-color:var(--primary);background:var(--card);outline:none}
.fb{border-radius:18px;padding:13px 16px;margin-top:12px;border:2px solid transparent}.fb.good{background:var(--good-bg);border-color:#BEEBD2}.fb.bad{background:var(--bad-bg);border-color:#FFCACC}
.fb .line{direction:ltr;text-align:left;font-size:1.12rem;line-height:1.9}.fb h3{margin:12px 0 4px}
.ok{color:var(--good);font-weight:700}
.miss{color:var(--margin);font-weight:700;text-decoration:underline wavy;text-underline-offset:4px}
.mis{padding:7px 0;border-bottom:2px solid var(--line)}
.tiles{direction:ltr;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.tile{min-width:48px;padding:9px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:1.2rem;font-weight:700;color:var(--ink);box-shadow:var(--elev);transition:transform .08s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile.used{opacity:.25;cursor:default;box-shadow:none;transform:translateY(4px)}
.slots{direction:ltr;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:62px;padding:10px;border-bottom:2px solid var(--line);margin:10px 0}
.slot{min-width:48px;padding:9px 14px;border-radius:14px;background:var(--primary-soft);color:var(--primary);font-size:1.2rem;font-weight:700;border:2px solid #C7D8FF}
.slot.empty{background:transparent;border:2px dashed var(--rule);cursor:default}
.opt{display:block;width:100%;text-align:start;padding:14px 16px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);font-size:1.05rem;font-weight:700;margin-bottom:10px;color:var(--ink);box-shadow:var(--elev);transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good-d);box-shadow:0 4px 0 var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--margin);color:var(--margin-d);box-shadow:0 4px 0 var(--margin)}.opt:disabled{cursor:default}
.lesson-ex{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:2px solid var(--line)}
.lesson-ex .e{flex:1;min-width:0}.lesson-ex .e b{display:block;direction:ltr;text-align:left;font-weight:700}.lesson-ex .e span{color:var(--soft);font-size:.9rem}
.q{margin-top:16px}.q p{font-weight:700}
.q .opts{display:flex;flex-wrap:wrap;gap:8px;direction:ltr}.q .opts .opt{width:auto;display:inline-block;margin:0;padding:8px 18px}
.mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--margin);color:#fff;font-size:2.3rem;box-shadow:0 3px 0 var(--margin-d)}
.mic.sm{width:50px;height:50px;font-size:1.25rem;box-shadow:0 2px 0 var(--margin-d)}
.mic.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 3px 0 var(--margin-d),0 0 0 16px rgba(255,90,95,.18)}}
.progress{height:14px;background:var(--rule-faint);border-radius:99px;overflow:hidden;margin:8px 0 2px}.progress.big{height:18px}
.progress i{display:block;height:100%;border-radius:99px;background:var(--good);background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35));background-size:calc(100% - 16px) 4px;background-repeat:no-repeat;background-position:8px 3px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grades .btn{padding:11px 4px}
@media (max-width:480px){.grades{grid-template-columns:repeat(2,1fr)}}
.steps{list-style:none;padding:0;margin:16px 0 0;position:relative}
.steps::before{content:"";position:absolute;right:19px;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--rule-faint)}
.steps li button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:none;background:none;padding:9px 0;position:relative;color:var(--ink)}
.steps .dot{flex:none;width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:700;color:#fff;z-index:1;box-shadow:var(--elev)}
.steps li.done .dot{background:var(--hl);border-color:var(--hl);box-shadow:0 3px 0 var(--hl-d);color:var(--on-hl)}
.steps .ic{font-size:1.25rem}.steps .nm{flex:1;font-weight:700}.steps .kind{font-size:.76rem;color:var(--soft);background:var(--sky);border-radius:9px;padding:0 9px;font-weight:700}
.alpha{direction:ltr;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin:14px 0}
.alpha .tile{display:flex;flex-direction:column;align-items:center;padding:8px 4px}.alpha .tile b{font-size:1.6rem;font-weight:700}.alpha .tile small{color:var(--soft);font-size:.74rem}
.alpha .vow{border-color:var(--hl);box-shadow:0 2px 0 var(--hl-d);background:var(--gold-soft)}
.pairbox{display:inline-flex;gap:4px;align-items:center;background:var(--sky);border-radius:14px;padding:3px}
.scroll{overflow-x:auto;margin-top:12px}
table.vt{border-collapse:collapse;width:100%;direction:ltr;font-size:.95rem;min-width:520px}
table.vt th,table.vt td{padding:9px 10px;border-bottom:2px solid var(--line);text-align:left}
table.vt th{font-weight:700;background:var(--sky);position:sticky;top:0}table.vt td.ar{direction:rtl;text-align:right;color:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.two label{font-size:.88rem;color:var(--soft)}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.story{margin-top:16px;font-size:1.15rem;line-height:1.95;font-weight:600}
.story p.en{text-align:left;margin:0 0 6px}
.tw{cursor:pointer;border-radius:6px;padding:0 1px}.tw:hover{background:var(--gold-soft)}
.trn{color:var(--soft);font-size:.95rem;font-weight:500;margin:0 0 16px;border-right:4px solid var(--hl);padding-right:12px;direction:rtl;text-align:right;line-height:1.7}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.bub{max-width:86%;padding:10px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card)}
.bub small{display:block;color:var(--soft);font-size:.76rem;font-weight:700}
.bub .en{text-align:left;font-weight:600}
.bub.a{align-self:flex-end;background:var(--sky);border-color:transparent;border-bottom-left-radius:6px}
.bub.b{align-self:flex-start;border-bottom-right-radius:6px}
.bub.me{border-color:var(--primary)}
.bub.u{align-self:flex-start;background:var(--primary);color:#fff;border-color:transparent;border-bottom-right-radius:6px}
.bub.now{border-color:var(--hl);box-shadow:0 0 0 3px var(--gold-soft)}
.bub.turn{border:2px dashed var(--primary);background:var(--primary-soft)}
.tchat .bub.a{display:flex;gap:8px;align-items:flex-start;background:var(--sky)}
.tchat .bub.a .av{flex:none;margin-top:2px}.tchat .bub.a>div{flex:1;min-width:0}
.typing{display:flex;gap:4px;padding:8px 2px}.typing i{width:8px;height:8px;border-radius:50%;background:var(--soft);animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-4px);opacity:.5}}
.tutor-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}.tutor-head h1{font-size:1.4rem}.tutor-head p{margin:0}
.tchat{max-height:52vh;overflow-y:auto;padding:10px;border:1.5px solid var(--line);border-radius:22px;background:var(--paper)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chipbtn{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:6px 13px;font-size:.9rem;font-weight:700;color:var(--ink);box-shadow:var(--elev)}
.chipbtn[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);box-shadow:0 3px 0 var(--primary)}
.composer{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.composer textarea{flex:1;resize:vertical;border:1.5px solid var(--line);border-radius:18px;padding:11px 14px;background:var(--sky);font-size:1rem;font-weight:600}
.composer textarea:focus{border-color:var(--primary);background:var(--card);outline:none}
.composer .col{display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.voicebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;padding:10px 14px;border-radius:18px;background:var(--primary-soft)}
.voicebar.on{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--hl)}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{border:2px solid var(--hl);border-radius:14px;padding:4px 12px;background:var(--gold-soft);font:inherit;font-weight:700;color:var(--ink)}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0;border-bottom:2px solid var(--line)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line);flex-wrap:wrap}.set:last-child{border-bottom:none}
select{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-weight:700}
input[type=range]{accent-color:var(--primary)}
.lvls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 16px}.lvls div{border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700}
.match{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.match .tile{font-size:1rem;min-height:58px}.match .tile.en{direction:ltr}
.tile.sel{background:var(--primary-soft);border-color:var(--primary);box-shadow:0 4px 0 var(--primary)}
.tile.bad{border-color:var(--margin);background:var(--bad-bg);box-shadow:0 4px 0 var(--margin)}
.tile.hit{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good);opacity:1}
.kbd{direction:ltr;display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:14px 0}
.kbd .tile{min-width:0;padding:8px 0;font-size:1.05rem}

/* bottom navigation — floating bar with Toki in the middle */
nav.bnav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;max-width:520px;margin:0 auto;height:70px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;
  background:var(--card);border:1.5px solid var(--line);border-radius:26px;box-shadow:var(--elev),0 18px 36px -18px rgba(31,36,51,.35)}
nav.bnav .nb{flex:1;height:100%;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#A3ABBE;padding:0}
nav.bnav .nb em{font-style:normal;font-size:.72rem;font-weight:700;line-height:1}
nav.bnav .nb .ico{display:grid;place-items:center;width:46px;height:34px;border-radius:12px;transition:background .15s,transform .15s}
nav.bnav .nb[aria-current="page"]{color:var(--primary)}
nav.bnav .nb[aria-current="page"] .ico{background:var(--primary-soft);transform:translateY(-1px)}
nav.bnav .nb[aria-current="page"] .ico svg{stroke-width:2.6}
nav.bnav .nb:active .ico{transform:scale(.9)}
nav.bnav .nb.mid{flex:0 0 78px;justify-content:flex-end;padding-bottom:9px}
nav.bnav .orb{position:absolute;top:-26px;width:64px;height:64px;border-radius:50%;background:var(--hl);display:grid;place-items:center;border:5px solid var(--paper);box-shadow:0 5px 0 var(--hl-d);transition:transform .15s}
nav.bnav .nb.mid{position:relative}
nav.bnav .nb.mid[aria-current="page"] .orb{background:var(--primary);box-shadow:0 5px 0 var(--primary-d)}
nav.bnav .nb.mid:active .orb{transform:translateY(4px);box-shadow:0 1px 0 var(--hl-d)}
nav.bnav .nb.mid em{color:var(--ink)}
main{padding-bottom:calc(118px + env(safe-area-inset-bottom,0px))}

/* home */
.sec{font-size:1.15rem;margin:22px 2px 10px}
.today{position:relative;overflow:hidden;background:linear-gradient(140deg,#2F6BFF 0%,#4F86FF 60%,#6C9BFF 100%);color:#fff;border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:0 3px 0 var(--primary-d)}
.today::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);top:-70px;left:-50px}
.today-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.today-top small{display:block;opacity:.85;font-weight:700}.today-top b{display:block;font-size:1.3rem;font-weight:700;line-height:1.25}.today-top span{display:block;opacity:.9;font-size:.9rem}
.today-next{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;border:none;border-radius:20px;padding:12px;background:var(--card);color:var(--ink);text-align:start;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.today-next:active{transform:translateY(3px);box-shadow:none}
.today-next .ni{flex:none;width:48px;height:48px;border-radius:15px;background:var(--gold-soft);display:grid;place-items:center;font-size:1.5rem}
.today-next .nt{flex:1;min-width:0}.today-next small{display:block;color:var(--soft);font-weight:700;font-size:.8rem}.today-next b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-next .play{flex:none;width:46px;height:46px;border-radius:50%;background:var(--hl);color:var(--on-hl);display:grid;place-items:center;font-size:1.1rem;box-shadow:0 2px 0 var(--hl-d)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis .k{border-radius:20px;padding:12px 10px;text-align:center;border:2px solid transparent}
.kpis .k span{font-size:1.4rem;display:block;line-height:1.2}.kpis .k b{display:block;font-size:1.5rem;font-weight:700;line-height:1.2}.kpis .k small{color:var(--soft);font-size:.78rem;font-weight:700}
.kpis .k1{background:#FFEBDD;border-color:#FFD2B3}.kpis .k1 b{color:var(--orange)}
.kpis .k2{background:#FFF3CC;border-color:#FFE28A}.kpis .k2 b{color:#C98A00}
.kpis .k3{background:#E1F7EA;border-color:#B4EACB}.kpis .k3 b{color:var(--good-d)}
.sqgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.sqgrid{grid-template-columns:repeat(3,1fr)}}
.sq{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:1.5px solid var(--line);background:var(--card);border-radius:22px;padding:14px;min-height:132px;color:var(--ink);box-shadow:var(--elev);transition:transform .08s,box-shadow .08s}
.sq:active{transform:translateY(4px);box-shadow:none}
.sq .ic{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:1.6rem;margin-bottom:8px;background:#E8F0FF}
.sq b{font-weight:700;font-size:1.02rem;line-height:1.3}.sq small{color:var(--soft);font-size:.8rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sqgrid>.sq:nth-child(6n+2) .ic{background:#FFF3CC}.sqgrid>.sq:nth-child(6n+3) .ic{background:#E1F7EA}.sqgrid>.sq:nth-child(6n+4) .ic{background:#FFE6EF}.sqgrid>.sq:nth-child(6n+5) .ic{background:#EFE8FF}.sqgrid>.sq:nth-child(6n+6) .ic{background:#FFEBDD}
.badge-n{position:absolute;top:10px;left:10px;min-width:24px;height:24px;border-radius:12px;background:var(--margin);color:#fff;font-style:normal;font-weight:700;font-size:.8rem;display:grid;place-items:center;padding:0 6px}
.wod{border-radius:26px;padding:16px 18px 18px;background:var(--gold-soft);border:2px solid #FFE28A;margin-bottom:10px}
.wod .guide{margin:8px 0 0}.wod .ar-big{margin:6px 0 10px}
.hubhead{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}.hubhead h1{margin:0}.hubhead p{margin:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpis .k,:root:not([data-theme="light"]) .wod{background:var(--sky);border-color:var(--line)}:root:not([data-theme="light"]) nav.bnav .orb{border-color:var(--paper)}}
:root[data-theme="dark"] .kpis .k,:root[data-theme="dark"] .wod{background:var(--sky);border-color:var(--line)}
@media (prefers-reduced-motion:reduce){nav.bnav .ico,nav.bnav .orb{transition:none}}

#sheet{position:fixed;inset:0;z-index:30;background:rgba(15,20,32,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheet-in{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));text-align:center;max-height:90vh;overflow-y:auto}

/* forms, auth, subscription */
.fld{display:block;text-align:start;margin:12px 0}.fld span{display:block;font-size:.88rem;font-weight:700;color:var(--soft);margin-bottom:5px}
.fld input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--sky);font-size:1rem;font-weight:600}.fld input:focus{border-color:var(--primary);background:var(--card);outline:none}
.authcard{max-width:460px;margin-left:auto;margin-right:auto}.btn.wide{width:100%;margin-top:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.cmp>div{border:1.5px solid var(--line);border-radius:20px;padding:14px}.cmp .pro{border-color:var(--hl);background:var(--gold-soft)}.cmp h3{margin:0 0 6px}.cmp ul{margin:0;padding-inline-start:18px}
@media (max-width:520px){.cmp{grid-template-columns:1fr}}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.plan{border:1.5px solid var(--line);border-radius:20px;background:var(--card);padding:16px 12px;display:flex;flex-direction:column;gap:0;align-items:center;color:var(--ink);box-shadow:var(--elev)}
.plan[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 4px 0 var(--primary)}
.plan.pro{border-color:var(--hl);box-shadow:0 2px 0 var(--hl-d)}
.plan .price{font-size:1.7rem;font-weight:700;color:var(--primary)}.plan small{color:var(--soft)}
.paybox{border-radius:18px;padding:6px 16px;background:var(--sky)}.paybox .spread{padding:9px 0;border-bottom:2px solid var(--line)}.paybox .spread:last-child{border-bottom:none}
.coupon{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.coupon input{flex:1;min-width:160px;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--sky);font-weight:700}
.agree{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0;font-size:.95rem}.agree input{width:20px;height:20px;accent-color:var(--primary)}
.terms h3{margin:18px 0 4px}.terms p{color:var(--ink);font-weight:500;max-width:68ch}
body.guest .bar .chip{display:none}
body.gated nav.bnav{display:none}body.gated main{padding-bottom:40px}

/* landing */
.hero{text-align:center;padding:14px 8px 26px}
.hero-in{max-width:600px;margin:0 auto}
.hero .toki{animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 14px rgba(47,107,255,.25))}
.hero .say-hi{display:inline-block;position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:8px 16px;font-weight:700;margin-bottom:6px;box-shadow:var(--elev)}
.hero .say-hi::after{content:"";position:absolute;bottom:-9px;left:50%;width:14px;height:14px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.hero h1{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:700;margin:10px 0 10px;line-height:1.2}
.hero p{font-size:1.08rem;color:var(--soft);max-width:48ch;margin-left:auto;margin-right:auto}
.hero .trial{display:inline-block;background:var(--gold-soft);color:var(--ink);border:2px solid var(--hl);border-radius:14px;padding:6px 16px;margin:6px 0 18px;font-weight:700}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.feats div{border:1.5px solid var(--line);border-radius:20px;padding:16px}
.feats .ic{font-size:1.6rem;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:#E8F0FF;margin-bottom:8px}
.feats div:nth-child(2) .ic{background:#FFF3CC}.feats div:nth-child(3) .ic{background:#E1F7EA}.feats div:nth-child(4) .ic{background:#FFE6EF}.feats div:nth-child(5) .ic{background:#EFE8FF}.feats div:nth-child(6) .ic{background:#FFEBDD}
.feats b{display:block;margin:2px 0 4px;font-weight:700}.feats span{color:var(--soft);font-size:.92rem;font-weight:500}
.how{counter-reset:h;list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.how li{counter-increment:h;border:1.5px solid var(--line);border-radius:20px;padding:16px;padding-top:58px;position:relative}
.how li::before{content:counter(h);position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 3px 0 var(--primary-d)}
.how b{display:block;font-weight:700}.how span{color:var(--soft);font-size:.92rem;font-weight:500}
.faq{border-bottom:2px solid var(--line)}.faq button{width:100%;display:flex;justify-content:space-between;gap:10px;border:none;background:none;padding:14px 2px;font-weight:700;text-align:start;color:var(--ink)}
.faq button span{color:var(--primary);font-size:1.3rem}.faq p{color:var(--soft);margin:0 0 14px;font-weight:500}
.foot{text-align:center;padding:10px 0 30px}

/* ===== engagement ===== */
.toki .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.toki.t-jump{animation:tjump .55s cubic-bezier(.3,1.6,.5,1)}.toki.t-shake{animation:tshake .45s ease}
@keyframes tjump{30%{transform:translateY(-14px) scale(1.06)}60%{transform:translateY(0) scale(.97)}}
@keyframes tshake{20%,60%{transform:translateX(-6px) rotate(-4deg)}40%,80%{transform:translateX(6px) rotate(4deg)}}
#react{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;border-radius:22px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--elev);
  transform:translate(-50%,30px) scale(.9);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .2s;max-width:calc(100vw - 24px)}
#react.show{transform:translate(-50%,0) scale(1);opacity:1}
#react.ok{border-color:#BEEBD2;box-shadow:0 5px 0 #BEEBD2;background:var(--good-bg)}#react.bad{border-color:#FFCACC;box-shadow:0 5px 0 #FFCACC;background:var(--bad-bg)}
#react b{display:block;font-weight:700;font-size:1.05rem;line-height:1.2}#react.ok b{color:var(--good-d)}#react.bad b{color:var(--margin-d)}#react span{display:block;font-size:.82rem;font-weight:700;color:var(--ink-2)}
.confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
.quests{border:1.5px solid var(--line);border-radius:24px;padding:8px 12px 12px;background:var(--card)}
.quest{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:10px 2px;border-bottom:2px solid var(--line);text-align:start;color:var(--ink)}
.quest .qi{flex:none;width:44px;height:44px;border-radius:14px;background:var(--sky);display:grid;place-items:center;font-size:1.3rem}
.quest.done .qi{background:var(--good-bg)}
.quest .qt{flex:1;min-width:0}.quest .qt b{display:block;font-weight:700;font-size:.95rem}
.qbar{display:block;height:10px;border-radius:99px;background:var(--rule-faint);overflow:hidden;margin-top:5px}.qbar i{display:block;height:100%;border-radius:99px;background:var(--hl)}
.quest.done .qbar i{background:var(--good)}
.quest .qn{flex:none;font-weight:700;color:var(--soft);font-size:.85rem}
.chest{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:18px;background:var(--sky)}
.chest .cb{font-size:2rem;flex:none}.chest div{flex:1}.chest b{display:block;font-weight:700}.chest span.muted{display:block;font-size:.85rem}
.chest.ready{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--hl)}.chest.ready .cb{animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;direction:ltr}
.cal i{display:block;aspect-ratio:1;border-radius:9px;background:var(--rule-faint)}.cal i.on{background:var(--orange)}.cal i.fz{background:#8FD3FF}.cal i.td{box-shadow:0 0 0 3px var(--primary-soft),0 0 0 5px var(--primary)}
.cal-l{display:flex;gap:14px;margin-top:10px;font-size:.8rem;color:var(--soft);font-weight:700}.cal-l i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--rule-faint);margin-inline-end:4px;vertical-align:-1px}.cal-l i.on{background:var(--orange)}.cal-l i.fz{background:#8FD3FF}
.rankcard{display:flex;align-items:center;gap:14px;border-radius:24px;padding:16px;margin-bottom:14px;background:linear-gradient(140deg,#5B21B6,#8B5CF6);color:#fff;box-shadow:0 16px 28px -18px rgba(91,33,182,.7)}
.rankcard small{display:block;opacity:.85;font-weight:700}.rankcard b{display:block;font-size:1.4rem;font-weight:700}.rankcard>div{flex:1}
.rankcard .qbar{background:rgba(255,255,255,.3)}.rankcard .qbar i{background:#FFC940}.rankcard .nx{display:block;font-size:.82rem;margin-top:4px;opacity:.95}
.myrank{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--primary-soft);margin-bottom:12px}.myrank b{display:block;font-weight:700;font-size:1.15rem}.myrank span{display:block}
.league{list-style:none;padding:0;margin:0}
.league li{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:2px solid var(--line)}
.league .pos{flex:none;width:34px;text-align:center;font-weight:700;color:var(--soft);font-size:1.05rem}.league li.top .pos{font-size:1.5rem}
.league .nm{flex:1;font-weight:700}.league b{font-weight:700;color:#C98A00}
.league li.me{background:var(--primary-soft);border-radius:14px;border-color:transparent}
@media (prefers-reduced-motion:reduce){.toki .eyes,.toki.t-jump,.toki.t-shake,.chest.ready .cb{animation:none}#react{transition:none}}

/* ===== lists as cards ===== */
.panel:has(> .cat),.panel.list{background:transparent;border:none;padding:4px 0}
.cat{border:1.5px solid var(--line);border-radius:20px;background:var(--card);padding:12px 14px;margin-bottom:10px;box-shadow:var(--elev);transition:transform .08s,box-shadow .08s}
.cat:active{transform:translateY(4px);box-shadow:none}
.cat::after{content:"‹";font-size:1.6rem;line-height:1;color:var(--rule);font-weight:700;margin-inline-start:4px}
.cat .ic{width:48px;height:48px;border-radius:16px;font-size:1.4rem}
.panel:has(> .cat) h3,.panel.list h3{margin:22px 4px 10px}
.ok-chip{background:var(--good-bg);color:var(--good-d)}
/* ===== lesson learn screen ===== */
.lesson-hero{display:flex;align-items:center;gap:14px;margin:14px 0 16px}.lesson-hero h1{margin:0;font-size:1.45rem}.lesson-hero p{margin:4px 0 0}
.lh-ic{flex:none;width:64px;height:64px;border-radius:20px;background:#EFE8FF;display:grid;place-items:center;font-size:2rem}
.explain{display:flex;gap:10px;align-items:flex-start;background:var(--primary-soft);border-radius:22px;padding:14px}.explain p{margin:0;line-height:1.9}
.exlist{display:grid;gap:10px}
.exitem{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:start;gap:2px 10px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);padding:12px 14px;box-shadow:var(--elev);color:var(--ink)}
.exitem:active{transform:translateY(4px);box-shadow:none}
.exitem .en{grid-column:1;font-weight:700;font-size:1.08rem;text-align:left}.exitem small{grid-column:1;color:var(--soft);font-weight:600}.exitem .spk{grid-column:2;grid-row:1/3;width:40px;height:40px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center}
.cta-bar{display:grid;gap:12px;margin-top:22px}
/* ===== player ===== */
body.playing header.top,body.playing nav.bnav{display:none}
body.playing main{padding-top:10px;padding-bottom:180px}
.ply-top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:8px 0 12px;background:var(--paper)}
.ply-x{flex:none;width:40px;height:40px;border:none;background:none;font-size:1.4rem;color:var(--soft);font-weight:700}
.ply-bar{flex:1;height:16px;margin:0}.ply-n{flex:none;font-weight:700;color:var(--soft);font-size:.9rem}
.ply-card{padding:8px 2px}
.ply-card.enter{animation:slideIn .38s cubic-bezier(.2,.9,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
.ply-lbl{font-weight:700;font-size:1.25rem;margin:6px 0 14px}
.ply-prompt{margin-bottom:18px}
.ply-sent{font-size:1.5rem;font-weight:700;line-height:1.6;text-align:left;margin:10px 0 6px;padding:18px;border:1.5px solid var(--line);border-radius:22px;background:var(--card)}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--primary);color:transparent;margin:0 4px;line-height:1}
.ply-opts{display:grid;gap:12px}
.ply-opt{display:flex;align-items:center;gap:12px;margin:0;padding:14px 16px;font-size:1.12rem}
.ply-opt .ok-n{flex:none;width:30px;height:30px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--soft);font-weight:700}
.ply-opt[dir=ltr] .ot{flex:1;text-align:left}

@keyframes vpSpeak{50%{transform:scale(1.07)}}@keyframes vpListen{0%{box-shadow:0 0 0 0 rgba(255,90,95,.35)}100%{box-shadow:0 0 0 26px rgba(255,90,95,0)}}

/* ===== bento tiles ===== */
.sqgrid{gap:12px}
.sq{--c1:#5B8CFF;--c2:#2F6BFF;--sh:rgba(47,107,255,.55);--tx:#fff;
  position:relative;overflow:hidden;border:none;border-radius:26px;padding:16px;min-height:150px;justify-content:flex-end;color:var(--tx);
  background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 12px 22px -14px var(--sh);transition:transform .15s cubic-bezier(.3,1.4,.5,1)}
.sq:active{transform:scale(.96);box-shadow:0 6px 14px -10px var(--sh)}
.sq::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);bottom:-60px;left:-50px}
.sq::after{content:"‹";position:absolute;top:14px;left:16px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.3rem;font-weight:700;line-height:1}
.sq .ic{position:absolute;top:14px;right:14px;width:56px;height:56px;border-radius:18px;margin:0;font-size:1.8rem;background:rgba(255,255,255,.24)!important;backdrop-filter:blur(2px)}
.sq b{position:relative;font-size:1.12rem;font-weight:700;color:var(--tx)}
.sq small{position:relative;color:var(--tx);opacity:.88;font-weight:600}
.sqgrid>.sq:nth-child(6n+2){--c1:#FFE07A;--c2:#FFC024;--sh:rgba(224,160,0,.6);--tx:#3A2A00}
.sqgrid>.sq:nth-child(6n+3){--c1:#4ADEA0;--c2:#12B981;--sh:rgba(16,185,129,.55)}
.sqgrid>.sq:nth-child(6n+4){--c1:#FF9EC0;--c2:#FF5C8D;--sh:rgba(255,92,141,.55)}
.sqgrid>.sq:nth-child(6n+5){--c1:#B9A2FF;--c2:#7C5CF6;--sh:rgba(124,92,246,.55)}
.sqgrid>.sq:nth-child(6n+6){--c1:#FFBE85;--c2:#FF8A1F;--sh:rgba(255,138,31,.55)}
/* wide feature tiles: 1st, 6th, 11th… */
.sqgrid:not(.nowide)>.sq:nth-child(5n+1){grid-column:1/-1;min-height:118px;padding-right:86px}
.sqgrid:not(.nowide)>.sq:nth-child(5n+1) .ic{top:50%;transform:translateY(-50%);width:62px;height:62px;font-size:2rem}
.sqgrid:not(.nowide)>.sq:nth-child(5n+1) b{font-size:1.25rem}
.sq .badge-n{top:auto;bottom:14px;left:14px;background:#fff;color:var(--margin);box-shadow:0 2px 0 rgba(0,0,0,.1)}
.sq:has(.badge-n)::after{display:none}
@media (min-width:640px){.sqgrid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.sq{transition:none}}

/* ===== toki pro ===== */
.mission{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--gold-soft);border-bottom:1.5px solid var(--line);scrollbar-width:none;align-items:center}
.mission::-webkit-scrollbar{display:none}
.mission .mt{flex:none;font-weight:700;font-size:.85rem;color:var(--ink)}

.tw2{cursor:pointer;border-radius:4px;transition:background .15s}.tw2:hover,.tw2:active{background:var(--gold-soft)}
.trn2{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--soft);font-size:.9rem;direction:rtl;text-align:right}
.c-help{flex:none;width:44px;height:48px;border:none;border-radius:14px;background:var(--gold-soft);font-size:1.2rem}

.sugg2 .sg-x{flex:none;border:none;background:var(--sky);border-radius:12px;width:36px}
.wsheet{text-align:center}.ws-w{font-size:2rem;font-weight:700}.ws-ar{font-size:1.4rem;font-weight:700;color:var(--primary);margin:10px 0 4px}
.ws-ex{margin:12px 0;padding:10px 12px;border-radius:14px;background:var(--sky);text-align:start}.ws-ex b{display:block;font-weight:600}.ws-ex span{display:block;color:var(--soft);font-size:.9rem}
.tokime{text-align:start}.tokime h2,.tokime>p{text-align:center}.tokime .toki{display:block;margin:0 auto}
.report{text-align:start}.report .ring{display:block;margin:0 auto;color:var(--ink)}.report h2{text-align:center;margin-top:6px}.report>p.muted{text-align:center}
.rl{margin:0;padding-inline-start:20px}.rm{padding:10px 12px;border-radius:14px;background:var(--bad-bg);margin-bottom:8px}.rm s{display:block;color:var(--margin-d)}.rm b{display:block;color:var(--good-d);font-weight:600}.rm small{display:block;color:var(--ink-2)}
.rw{display:flex;flex-wrap:wrap;gap:8px}.rtip{margin:14px 0;padding:12px 14px;border-radius:16px;background:var(--gold-soft);font-weight:500}
.aigen{background:var(--primary-soft)!important;border:1.5px dashed var(--primary)!important;padding:16px!important;margin-top:10px}

/* ===== live voice call ===== */
.vcall{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(26px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 80% at 50% 0%,#1E3A8A 0%,#0B1022 70%);color:#fff}
.vc-top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;font-weight:600}.vc-time{opacity:.7;font-variant-numeric:tabular-nums}
.vc-mid{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:520px}
.vc-orb{position:relative;width:250px;height:250px;border:none;border-radius:50%;background:transparent;display:grid;place-items:center;padding:0}
.vc-core{position:relative;z-index:2;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#8FB3FF,#2F6BFF 55%,#1E40AF);box-shadow:0 0 60px rgba(79,134,255,.55);transition:transform .3s}
.vc-ring{position:absolute;inset:18px;border-radius:50%;border:3px solid rgba(143,179,255,.35)}
.vcall.listen .vc-ring{animation:vcl 1.6s ease-out infinite}.vcall.listen .vc-ring.r2{animation-delay:.8s}
.vcall.listen .vc-core{background:radial-gradient(circle at 35% 30%,#FFE08A,#FFC940 55%,#E0A800);box-shadow:0 0 70px rgba(255,201,64,.55)}
.vcall.speak .vc-core{animation:vcs .9s ease-in-out infinite}.vcall.speak .vc-ring{animation:vcl 1.1s ease-out infinite}.vcall.speak .vc-ring.r2{animation-delay:.55s}
.vcall.think .vc-core{animation:vct 1.4s linear infinite}
@keyframes vcl{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes vcs{0%,100%{transform:scale(1)}30%{transform:scale(1.08)}60%{transform:scale(.97)}}
@keyframes vct{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.vc-status{font-size:1.15rem;font-weight:600;text-align:center;opacity:.95}
.vc-cap{min-height:3em;max-width:100%;text-align:center;font-size:1.25rem;line-height:1.6;opacity:.9}
.vc-lang{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-size:.9rem;opacity:.95}
.vc-lang button{border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:6px 14px;font-weight:600}
.vc-lang button[aria-pressed="true"]{background:#fff;color:#1E3A8A;border-color:#fff}
.vc-ctrl{display:flex;gap:26px;justify-content:center;width:100%}
.vc-b{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;color:#fff}
.vc-b span{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:1.5rem}
.vc-b.end span{background:#EF4444}.vc-b[aria-pressed="true"] span{background:rgba(255,255,255,.3)}
.vc-b small{font-size:.8rem;opacity:.85}
@media (prefers-reduced-motion:reduce){.vc-ring,.vc-core{animation:none!important}}
body.incall #livecap{left:50%!important;right:auto!important;transform:translateX(-50%);bottom:calc(200px + env(safe-area-inset-bottom,0px))!important;background:rgba(255,255,255,.12)!important;color:#fff!important;border:1px solid rgba(255,255,255,.2)!important;max-width:88vw}

.vc-test{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:600}
.vc-warn{margin-top:10px;width:100%;max-width:520px;border:1px solid #FFC940;background:rgba(255,201,64,.15);color:#FFE08A;border-radius:14px;padding:10px 14px;font-weight:600;font-size:.9rem}
.ar-warn{display:block;width:100%;border:none;border-top:1.5px solid var(--line);background:var(--gold-soft);color:var(--ink);padding:8px 12px;font-weight:600;font-size:.85rem}
.c-ml{flex:none;width:40px;height:48px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-weight:700;font-size:1rem;color:var(--primary)}
.arhelp ol{padding-inline-start:22px;margin:6px 0 10px}.arhelp li{margin:4px 0}.arhelp h3{margin:14px 0 4px}

.lv .vc-core{background:radial-gradient(circle at 35% 30%,#C4B5FD,#8B5CF6 55%,#5B21B6);box-shadow:0 0 70px rgba(139,92,246,.6)}
.lv.listen .vc-core{background:radial-gradient(circle at 35% 30%,#A7F3D0,#10B981 55%,#047857);box-shadow:0 0 70px rgba(16,185,129,.5)}
.lv.listen .vc-ring{animation:vcl 2s ease-out infinite}.lv.listen .vc-ring.r2{animation-delay:1s}
.lv.connecting .vc-core{animation:vct 1.4s linear infinite}
.lv-beta{background:#FFC940;color:#2A1E00;border-radius:999px;padding:1px 8px;font-size:.7rem;font-weight:700;margin-inline-start:4px}
.lv-caps{width:100%;min-height:5.5em;display:flex;flex-direction:column;gap:8px;text-align:center}
.lv-u{opacity:.7;font-size:1rem}.lv-t{font-size:1.2rem;line-height:1.6}
.live-btn{background:linear-gradient(135deg,#8B5CF6,#2F6BFF)!important;color:#fff!important}

.vc-live{border:none;border-radius:999px;padding:10px 20px;font-weight:700;background:linear-gradient(90deg,#FFC940,#FF8A3D);color:#2A1E00;box-shadow:0 10px 30px -10px rgba(255,160,60,.7)}
.vc-live small{font-weight:600;opacity:.75;margin-inline-start:4px}
.vc-badge{font-size:.75rem;padding:3px 10px;border-radius:999px;background:rgba(255,201,64,.2);color:#FFE08A;font-weight:600}
.vcall.live{background:radial-gradient(120% 80% at 50% 0%,#4C1D95 0%,#0B1022 70%)}
.vc-note{font-size:.85rem;opacity:.8;text-align:center;max-width:420px}

.vc-live.alt{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35);box-shadow:none}
.minbal{display:flex;align-items:center;gap:14px;background:linear-gradient(140deg,#4C1D95,#2F6BFF);color:#fff;border-radius:22px;padding:14px 16px;margin-top:6px}
.minbal small{display:block;opacity:.85;font-weight:600}.minbal b{display:block;font-size:1.6rem;font-weight:700}.minbal span{display:block;font-size:.85rem;opacity:.9}

/* ===== compact header on phones + real-voice balance chip ===== */
.chip.c-min{border:none;cursor:pointer;background:#F3E8FF;color:#6D28D9;font-weight:700;font-family:inherit}

[data-theme="dark"] .chip.c-min{background:rgba(139,92,246,.22);color:#DDD6FE}

}

.vc-easy{border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-family:inherit}
.vc-easy[aria-pressed="true"]{background:#34D399;border-color:#34D399;color:#053B2A}

/* ===== roadmap (خطتي) ===== */
.rm-path{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 14px}
.rm-lv{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.rm-lv span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sky);color:var(--soft);border:2px solid var(--line)}
.rm-lv small{font-size:.72rem;color:var(--soft);font-weight:600}

.rm-skills{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

.rm-units{position:relative;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}

.rm-unit.next{opacity:.8}
.rm-unit.exam{border:2px dashed #FFC940;background:var(--gold-soft)}
.rm-unit.exam.done{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.rm-uh{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:14px;text-align:start;color:var(--ink)}
.rm-no{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sky)}
.rm-unit.done .rm-no{background:var(--good);color:#fff}.rm-unit.cur .rm-no{background:var(--primary);color:#fff}
.rm-ut{flex:1;min-width:0}.rm-ut b{display:block;font-weight:700}.rm-ut small{display:block;color:var(--soft);font-weight:500;margin-bottom:4px}

.rm-ub{padding:0 14px 10px}

.vc-cap.live-cap{max-height:28vh;overflow-y:auto;padding:4px 8px;font-size:1.3rem;line-height:1.7;white-space:pre-wrap}

/* ===== new Toki chat ===== */
.tc{background:linear-gradient(180deg,var(--bg) 0%,var(--primary-soft) 140%)}
.tc-head{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--card);border-bottom:1px solid var(--line)}

.tc-av{position:relative;flex:none;line-height:0}.tc-av i{position:absolute;bottom:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#22C55E;border:2.5px solid var(--card)}
.tc-name{flex:1;min-width:0}.tc-name b{display:block;font-size:1.1rem;font-weight:700}.tc-name small{color:#16A34A;font-weight:600;font-size:.8rem}.tc-name small.live{color:var(--primary)}
.tc-call{flex:none;width:44px;height:44px;border:none;border-radius:50%;color:#fff;display:grid;place-items:center;background:linear-gradient(135deg,#34D399,#10B981);box-shadow:0 8px 18px -8px rgba(16,185,129,.8)}

.tc-scn{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--sky);color:var(--ink);border-radius:999px;padding:6px 12px;font-family:inherit;font-size:.9rem}
.tc-scn b{font-weight:700}
.tc-mis{display:flex;gap:6px;align-items:center}.tc-mt{flex:none;font-weight:700;font-size:.82rem}
.tc-mg{flex:none;font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--soft);white-space:nowrap}.tc-mg.ok{background:var(--good-bg);border-color:var(--good);color:var(--good-d);font-weight:600}
.tc-body{padding:14px 12px 8px}

.tc .msg.bot{justify-content:flex-start;flex-direction:row}

.tc .bub.a{background:var(--card);border-bottom-right-radius:6px}
.tc .bub.u{background:linear-gradient(135deg,#4F86FF,#2F6BFF);color:#fff;border-bottom-left-radius:6px}

.tc-acts{display:flex;gap:4px;margin-top:6px}

.tc-acts button:disabled{opacity:.4}
.tc-quick{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:6px 0 4px 38px}
.tc-quick button{border:1.5px solid var(--primary);background:var(--card);color:var(--primary);border-radius:18px;padding:8px 14px;font-weight:600;font-family:inherit;text-align:start}
.tc-comp{background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.tc-tools{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}

.tc-row{display:flex;align-items:flex-end;gap:8px}

.tc-menu h2,.tc-scs h2{text-align:center;margin-top:0}
.tc-menu button{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;width:100%;text-align:start;border:none;background:var(--sky);border-radius:18px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font-family:inherit}
.tc-menu button span{grid-row:1/3;font-size:1.5rem}.tc-menu button b{font-weight:700}.tc-menu button small{color:var(--soft)}.tc-menu button:disabled{opacity:.5}

/* ===== talking Toki character on calls ===== */
.tk-wrap{position:relative;width:250px;height:250px;display:grid;place-items:center}
.tk-glow{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(79,134,255,.55),rgba(79,134,255,0) 68%);transition:transform .08s linear}
.tk-listen .tk-glow{background:radial-gradient(circle,rgba(255,201,64,.55),rgba(255,201,64,0) 68%)}
.tk-char{position:relative;width:230px;height:230px;overflow:visible}
.tk-body{transform-box:fill-box;transform-origin:50% 100%;animation:tkbob 3s ease-in-out infinite}
.tk-speak .tk-body{animation:tkbob .9s ease-in-out infinite}
.tk-listen .tk-body{animation:tktilt 2.4s ease-in-out infinite}
@keyframes tkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes tktilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-1deg) translateY(-3px)}}
.tk-eyes{transform-box:fill-box;transform-origin:center;animation:tkblink 4s infinite}
@keyframes tkblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.tk-think .tk-pupils{transform:translate(4px,-6px)}
.tk-listen .tk-pupils{transform:translate(-3px,2px)}
.tk-mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.35)}
.tk-speak .tk-mouth:not(.amp){animation:tktalk .5s infinite}
@keyframes tktalk{0%{transform:scaleY(.3)}25%{transform:scaleY(1.1)}50%{transform:scaleY(.5)}75%{transform:scaleY(1.3)}100%{transform:scaleY(.3)}}
.tk-think .tk-mouth{transform:scaleY(.2) scaleX(.6)}
.tk-arm{transform-box:fill-box;transform-origin:50% 10%}
.tk-speak .tk-arm-r{animation:tkwave 1.1s ease-in-out infinite}
.tk-speak .tk-arm-l{animation:tkwave 1.4s ease-in-out infinite reverse}
@keyframes tkwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.tk-waves{opacity:.35}.tk-listen .tk-waves{opacity:1;animation:tkw 1s infinite}
@keyframes tkw{0%,100%{opacity:.4}50%{opacity:1}}
.tk-dots{opacity:0}.tk-think .tk-dots{opacity:1;animation:tkw 1.2s infinite}
.vc-orb{width:auto;height:auto;background:none!important}
@media (prefers-reduced-motion:reduce){.tk-body,.tk-eyes,.tk-arm,.tk-mouth,.tk-waves,.tk-dots{animation:none!important}}

/* ===== letters course ===== */
.abc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.abc-tile{display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:12px 8px;color:var(--ink);font-family:inherit;box-shadow:var(--elev)}
.abc-tile b{font-size:2rem;font-weight:700;color:var(--primary);font-family:"Rubik","Noto Sans SC",sans-serif}
.abc-em{font-size:1.6rem}.abc-w{font-weight:700;font-size:1.05rem}.abc-tile small{color:var(--soft)}
.abc-tile em{font-style:normal;font-size:.8rem;background:var(--gold-soft);color:#6B4A00;border-radius:10px;padding:4px 8px;margin-top:4px;line-height:1.5}
.abc-tile:active{transform:scale(.97)}
.abc-qw{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px 0}.abc-qw span{font-size:3rem}.abc-qw b{font-size:1.6rem}
.abc-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.abc-opts .opt{text-align:center;font-size:1.5rem;font-weight:700}

[data-theme="dark"] .abc-tile em{background:rgba(255,201,64,.16);color:#FFE08A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .abc-tile em{background:rgba(255,201,64,.16);color:#FFE08A}}
[data-theme="dark"] .abc-tile b{color:#8FB3FF}

/* ===== letters: pronunciation practice ===== */
.abc-card{display:flex;flex-direction:column;gap:6px}
.abc-card .abc-tile{width:100%}
.abc-acts{display:flex;gap:6px;justify-content:center}
.pn-btn{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0;font-size:1.15rem}
.pn-btn.on{background:#EF4444;border-color:#EF4444;animation:tkpulse 1.2s infinite}
.pn-res{border-radius:14px;padding:7px 10px;font-weight:700;font-size:.9rem;text-align:center;line-height:1.5}
.pn-res small{display:block;font-weight:500;font-size:.8rem;margin-top:3px}
.pn-res.ok{background:var(--good-bg);color:var(--good-d)}.pn-res.mid{background:var(--gold-soft);color:#6B4A00}.pn-res.bad{background:#FEE2E2;color:#991B1B}
[data-theme="dark"] .pn-res.mid{background:rgba(255,201,64,.16);color:#FFE08A}[data-theme="dark"] .pn-res.bad{background:rgba(239,68,68,.18);color:#FCA5A5}
.dr-go{margin:10px 0 4px;background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff;border:none}
.dr-big{font-size:4.5rem;font-weight:700;color:var(--primary);margin-top:14px;font-family:"Rubik","Noto Sans SC",sans-serif}
.dr-em{font-size:3rem}.dr-state{margin:14px auto;font-size:1.3rem;font-weight:700;padding:10px 18px;border-radius:18px;background:var(--sky);display:inline-block}
.dr-state.listen{background:#FEE2E2;color:#B91C1C;animation:tkpulse 1.2s infinite}
.dr-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.dr-chip{padding:6px 10px;border-radius:12px;background:var(--sky);font-weight:700}.dr-chip.ok{background:var(--good-bg);color:var(--good-d)}.dr-chip.mid{background:var(--gold-soft);color:#6B4A00}.dr-chip.bad{background:#FEE2E2;color:#991B1B}
.mo-sheet h2{font-size:2.4rem;margin:0;text-align:center}.mo-sheet ol{padding-inline-start:22px;line-height:1.9}
.mouth .mo-lips{transform-box:fill-box;transform-origin:center;animation:moPuff 1.6s infinite}
@keyframes moPuff{0%,40%{transform:scaleY(.25)}55%,100%{transform:scaleY(1)}}
.mouth .mo-air{animation:moAir 1.6s infinite}@keyframes moAir{0%,50%{opacity:0;transform:translateX(-6px)}70%{opacity:1}100%{opacity:0;transform:translateX(6px)}}
.mouth .mo-round{transform-box:fill-box;transform-origin:center;animation:moRound 1.8s infinite}@keyframes moRound{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
.mouth .mo-tongue{transform-box:fill-box;transform-origin:center;animation:moRound 1.4s infinite}
.mouth .mo-wave{animation:moAir 1.2s infinite}
.mouth .mo-trill{transform-box:fill-box;transform-origin:center bottom;animation:moTrill .18s infinite alternate}@keyframes moTrill{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.mouth .mo-curl{transform-box:fill-box;transform-origin:left bottom;animation:moCurl 1.6s infinite}@keyframes moCurl{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
@media (prefers-reduced-motion:reduce){.mouth *{animation:none!important}}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:16px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;white-space:nowrap}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.greet .toki,.hero .toki,.typing i{animation:none}.mic.on{animation:none;box-shadow:0 0 0 4px var(--hl)}.btn,.opt,.tile,.act{transition:none}}

{id:"s4",lv:"A2",t:"A Visit to the Lab",ar:"زيارة إلى المختبر",
en:["Sara felt tired for many days, so she went to the doctor. The doctor asked for a blood test.","In the morning, Sara went to the laboratory without breakfast. The technician was friendly. He took a small blood sample from her arm.","In the afternoon, the results were ready. Her iron was low. The doctor told her to eat more meat, beans, and green vegetables, and to take iron tablets."],
tr:["شعرت سارة بالتعب لأيام كثيرة، فذهبت إلى الطبيب. طلب الطبيب فحص دم.","في الصباح ذهبت سارة إلى المختبر بدون فطور. كان الفني لطيفاً. أخذ عينة دم صغيرة من ذراعها.","بعد الظهر كانت النتائج جاهزة. كان الحديد عندها منخفضاً. قال لها الطبيب أن تأكل لحماً وبقوليات وخضاراً خضراء أكثر، وأن تأخذ حبوب حديد."],

{id:"s5",lv:"A2",t:"The Rainy Day",ar:"اليوم الماطر",
en:["It was a cold winter day. Yousef was walking to school when it started to rain heavily.","He didn't have an umbrella, and his clothes got wet. An old man opened his door and said, \"Come in, son.\"","He gave Yousef a cup of hot tea and a towel. When the rain stopped, Yousef thanked him and continued to school. He never forgot that kind man."],
tr:["كان يوماً شتوياً بارداً. كان يوسف يمشي إلى المدرسة عندما بدأت تمطر بغزارة.","لم تكن معه مظلة، وتبللت ملابسه. فتح رجل عجوز بابه وقال: تفضل يا ابني.","أعطى يوسف كوب شاي ساخن ومنشفة. عندما توقف المطر شكره يوسف وأكمل طريقه إلى المدرسة. لم ينسَ أبداً ذلك الرجل الطيب."],

{id:"s6",lv:"B1",t:"Learning a New Language",ar:"تعلّم لغة جديدة",
en:["Many people believe that learning a language is only about memorizing words. However, research shows that regular practice is much more important.","If you listen to English for fifteen minutes every day, your brain slowly gets used to the sounds. Speaking, even with mistakes, builds confidence.","Experts suggest reviewing new words after one day, then after three days, then after a week. This method, called spaced repetition, helps you remember words for a long time."],
tr:["يعتقد كثير من الناس أن تعلم اللغة يعني فقط حفظ الكلمات. لكن الأبحاث تُظهر أن التدريب المنتظم أهم بكثير.","إذا استمعت للإنجليزية خمس عشرة دقيقة يومياً، يعتاد دماغك تدريجياً على الأصوات. والكلام، حتى مع الأخطاء، يبني الثقة.","ينصح الخبراء بمراجعة الكلمات الجديدة بعد يوم، ثم بعد ثلاثة أيام، ثم بعد أسبوع. هذه الطريقة، اسمها التكرار المتباعد، تساعدك على تذكر الكلمات لمدة طويلة."],
q:[["According to research, what is more important?",["memorizing words","regular practice","reading grammar books"],"regular practice"],["What does speaking build?",["confidence","vocabulary lists","money"],"confidence"],["What is the method called?",["fast reading","spaced repetition","word lists"],"spaced repetition"]]},
{id:"s7",lv:"B1",t:"The Olive Harvest",ar:"موسم قطف الزيتون",
en:["Every October, families in Palestine gather in the fields for the olive harvest. It is not just work; it is a tradition that has continued for hundreds of years.","Children, parents, and grandparents work together from early morning. They spread large sheets under the trees and shake the branches until the olives fall.","At lunchtime, everyone sits in the shade and eats bread with fresh oil and thyme. Although the work is hard, most people say it is the most beautiful time of the year."],
tr:["كل شهر أكتوبر تجتمع العائلات في فلسطين في الحقول لقطف الزيتون. إنه ليس مجرد عمل؛ بل تقليد استمر مئات السنين.","يعمل الأطفال والآباء والأجداد معاً منذ الصباح الباكر. يفرشون أغطية كبيرة تحت الأشجار ويهزّون الأغصان حتى يسقط الزيتون.","وقت الغداء يجلس الجميع في الظل ويأكلون الخبز مع الزيت الطازج والزعتر. بالرغم من أن العمل متعب، يقول أغلب الناس إنه أجمل وقت في السنة."],

{id:"s8",lv:"B1",t:"An Unexpected Opportunity",ar:"فرصة غير متوقعة",
en:["Layla had always wanted to become a programmer, but she studied biology at university because her family expected her to.","After graduating, she taught herself coding online in the evenings. At first it was difficult, and she almost gave up several times.","One day, a small company was looking for someone who understood both science and software. Layla applied, and because of her unusual mix of skills, she got the job. She now builds apps for hospitals and laboratories."],
tr:["كانت ليلى دائماً تريد أن تصبح مبرمجة، لكنها درست الأحياء في الجامعة لأن عائلتها توقعت منها ذلك.","بعد التخرج علّمت نفسها البرمجة عبر الإنترنت في المساء. في البداية كان الأمر صعباً، وكادت تستسلم عدة مرات.","في يوم من الأيام، كانت شركة صغيرة تبحث عن شخص يفهم العلوم والبرمجيات معاً. تقدمت ليلى، وبسبب مزيج مهاراتها غير المألوف حصلت على الوظيفة. هي الآن تبني تطبيقات للمستشفيات والمختبرات."],

{id:"s9",lv:"B2",t:"The Power of Small Habits",ar:"قوة العادات الصغيرة",
en:["Most people overestimate what they can achieve in a week and underestimate what they can achieve in a year. The secret, according to many psychologists, lies in small habits.","Improving by just one percent every day might seem insignificant, yet over twelve months the effect is enormous. Someone who reads ten pages a day will have finished more than a dozen books by the end of the year.","The difficulty is that the results of good habits are delayed, while the rewards of bad habits are immediate. That is why successful people focus on the process rather than the goal: they design their environment so that the right choice becomes the easy choice."],
tr:["معظم الناس يبالغون في تقدير ما يمكنهم إنجازه في أسبوع ويستهينون بما يمكنهم إنجازه في سنة. السر، حسب كثير من علماء النفس، يكمن في العادات الصغيرة.","التحسّن بنسبة واحد بالمئة فقط كل يوم قد يبدو غير مهم، لكن خلال اثني عشر شهراً يكون الأثر هائلاً. من يقرأ عشر صفحات يومياً سيكون قد أنهى أكثر من اثني عشر كتاباً مع نهاية السنة.","الصعوبة أن نتائج العادات الجيدة متأخرة، بينما مكافآت العادات السيئة فورية. لهذا يركز الناجحون على العملية بدلاً من الهدف: يصممون بيئتهم بحيث يصبح الخيار الصحيح هو الخيار السهل."],

en:["It was three in the morning when the emergency department called the laboratory. A young patient had arrived with severe symptoms, and the doctors needed results urgently.","Nadia, who had been working alone since midnight, noticed that the first result looked unusual. Rather than sending it immediately, she decided to repeat the test. The second result was completely different: the first sample had been contaminated.","Had she not checked, the patient might have received the wrong treatment. The next morning, her manager said something she never forgot: \"Speed matters, but accuracy saves lives.\""],
tr:["كانت الساعة الثالثة فجراً عندما اتصل قسم الطوارئ بالمختبر. وصل مريض شاب بأعراض شديدة، وكان الأطباء يحتاجون النتائج بسرعة.","لاحظت نادية، التي كانت تعمل وحدها منذ منتصف الليل، أن النتيجة الأولى تبدو غير طبيعية. بدلاً من إرسالها فوراً قررت إعادة الفحص. كانت النتيجة الثانية مختلفة تماماً: العينة الأولى كانت ملوثة.","لو لم تتحقق، لربما تلقى المريض علاجاً خاطئاً. في الصباح التالي قال لها مديرها جملة لم تنسها أبداً: السرعة مهمة، لكن الدقة تنقذ الأرواح."],

en:["I wake up at six o'clock. I wash my face and brush my teeth.","I eat bread, cheese, and olives for breakfast. My mother makes tea for everyone.","Then I take the bus to school. My friend Ali is always on the bus. We talk and laugh every morning."],

{id:"s12",lv:"A2",t:"The Birthday Surprise",ar:"مفاجأة عيد الميلاد",
en:["Last Friday was my sister Huda's birthday. She thought everyone forgot, because nobody said anything in the morning.","In the afternoon, we sent her to the market to buy bread. While she was out, we decorated the living room and put a big chocolate cake on the table.","When she opened the door, we all shouted \"Surprise!\" Huda was so happy that she started to cry. It was the best birthday of her life."],
tr:["الجمعة الماضية كان عيد ميلاد أختي هدى. اعتقدت أن الجميع نسوا، لأن لا أحد قال شيئاً في الصباح.","بعد الظهر أرسلناها إلى السوق لتشتري الخبز. بينما كانت خارج البيت، زيّنا غرفة الجلوس ووضعنا كعكة شوكولاتة كبيرة على الطاولة.","عندما فتحت الباب صرخنا جميعاً: مفاجأة! كانت هدى سعيدة جداً لدرجة أنها بدأت تبكي. كان أجمل عيد ميلاد في حياتها."],
q:[["Why did Huda feel sad in the morning?",["she was sick","she thought everyone forgot","she lost her bag"],"she thought everyone forgot"],["Where did they send her?",["to school","to the market","to the hospital"],"to the market"],["What was on the table?",["a chocolate cake","flowers","a present"],"a chocolate cake"]]},
{id:"s13",lv:"B1",t:"A Day Without Internet",ar:"يوم بدون إنترنت",
en:["When the internet stopped working in our neighborhood, I felt completely lost. I couldn't check my messages, watch videos, or read the news.","At first, I was bored and kept looking at my phone. Then my younger brother suggested playing a board game. We hadn't played together for years, and we laughed a lot.","In the evening, I read a book that I had bought months ago but never opened. By the end of the day, I realized that I had spent more real time with my family than in the whole previous month."],
tr:["عندما توقف الإنترنت في حيّنا شعرت بالضياع تماماً. لم أستطع قراءة رسائلي أو مشاهدة الفيديوهات أو قراءة الأخبار.","في البداية كنت ملولاً وأظل أنظر إلى هاتفي. ثم اقترح أخي الصغير أن نلعب لعبة لوحية. لم نلعب معاً منذ سنوات، وضحكنا كثيراً.","في المساء قرأت كتاباً اشتريته قبل أشهر ولم أفتحه أبداً. بنهاية اليوم أدركت أنني قضيت وقتاً حقيقياً مع عائلتي أكثر من الشهر الماضي كله."],
q:[["How did he feel at first?",["happy","lost and bored","angry"],"lost and bored"],["Who suggested a board game?",["his mother","his younger brother","his friend"],"his younger brother"],["What did he realize?",["he needs a new phone","he spent more real time with family","the internet is useless"],"he spent more real time with family"]]},
{id:"s14",lv:"B2",t:"The Interview That Changed Everything",ar:"المقابلة التي غيّرت كل شيء",
en:["Omar had applied for dozens of jobs without success. By the time he was invited to his thirtieth interview, he had almost given up hope.","Instead of repeating the same rehearsed answers, he decided to be completely honest. When the manager asked about his weaknesses, he admitted that he struggled with public speaking, but explained how he had been practicing every week to overcome it.","A week later, he received an offer. The manager later told him that his honesty and willingness to improve had impressed the panel far more than any perfect answer could have."],
tr:["تقدّم عمر لعشرات الوظائف دون نجاح. عندما دُعي لمقابلته الثلاثين كان قد فقد الأمل تقريباً.","بدلاً من تكرار نفس الإجابات المحفوظة، قرر أن يكون صادقاً تماماً. عندما سأله المدير عن نقاط ضعفه، اعترف بأنه يواجه صعوبة في التحدث أمام الجمهور، لكنه شرح كيف كان يتدرّب كل أسبوع للتغلب على ذلك.","بعد أسبوع وصله عرض عمل. أخبره المدير لاحقاً أن صدقه ورغبته في التحسّن أثّرا في اللجنة أكثر بكثير مما كانت ستفعله أي إجابة مثالية."],
q:[["How many interviews had Omar done?",["three","thirty","thirteen"],"thirty"],["What weakness did he admit?",["public speaking","being late","poor English"],"public speaking"],["Why did he get the job?",["his honesty and willingness to improve","his perfect answers","his experience"],"his honesty and willingness to improve"]]}
);

{id:"s17",lv:"A2",t:"My First Job",ar:"أول شغلة إلي",en:["Last summer, I got my first job at a small bookshop. I was nervous on the first day.","My boss, Mr. Adel, was very kind. He showed me how to use the computer and where to put the new books.","After two weeks, I knew every shelf. I learned a lot, and I bought three books with my first salary."],

{id:"s18",lv:"B1",t:"The Volunteer",ar:"المتطوعة",en:["After the war damaged many schools, Rana decided to volunteer as a teacher in a small tent classroom.","At first, the children were quiet and afraid. Rana used games, songs and drawings to make them feel safe again.","Months later, one boy gave her a drawing of the whole class smiling. \"This is our school,\" he said. Rana realized that hope can be taught too."],
 tr:["بعد ما الحرب خرّبت مدارس كتير، رنا قررت تتطوع معلمة بصف صغير بخيمة.","بالأول الأولاد كانوا ساكتين وخايفين. رنا استخدمت ألعاب وأغاني ورسومات لتخليهم يحسوا بالأمان من جديد.","بعد شهور، ولد أعطاها رسمة للصف كله وهم مبتسمين. قال: «هاي مدرستنا». رنا فهمت إنه الأمل كمان بيتعلّم."],

{id:"s19",lv:"B2",t:"The Startup",ar:"الشركة الناشئة",en:["When Khaled lost his job, he refused to give up. With only a laptop and an unreliable internet connection, he started building an app to help small shops manage their stock.","The first version was full of bugs, and his early customers complained constantly. Rather than feeling discouraged, he treated every complaint as free advice.","Two years later, hundreds of shops were using his app. When journalists asked about his secret, he simply said, \"I listened more than I talked.\""],
 tr:["لما خالد خسر شغله رفض يستسلم. بس بلابتوب وإنترنت مش ثابت، بلّش يبني تطبيق يساعد المحلات الصغيرة تدير بضاعتها.","النسخة الأولى كانت مليانة أخطاء، وأول زباينه ضلوا يشتكوا. بدل ما يحبط، اعتبر كل شكوى نصيحة ببلاش.","بعد سنتين صارت مئات المحلات تستخدم تطبيقه. لما الصحفيين سألوه عن السر، قال ببساطة: «سمعت أكثر ما حكيت»."],

{id:"s20",lv:"B2",t:"The Letter",ar:"الرسالة",en:["While cleaning her grandmother's old cupboard, Maya found a yellowed envelope that had never been opened. It was addressed to her grandmother and dated fifty years earlier.","Inside was a letter from a childhood friend who had emigrated, promising to return one day. Her grandmother had clearly never read it.","Maya searched online and, to her astonishment, found the friend's granddaughter. A week later, the two families were talking on a video call, laughing and crying at the same time."],

const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=a=>a[Math.random()*a.length|0];
const NUM={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","12":"twelve"};
function norm(s){return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim().split(" ").map(w=>NUM[w]||w).join(" ")}
function lcs(a,b){const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const r=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){r[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}return r}
function compare(target,typed){const orig=target.split(/\s+/);const tn=orig.map(w=>norm(w));const bn=norm(typed).split(" ").filter(Boolean);
  const r=lcs(tn,bn);const pct=Math.round(100*r.filter(Boolean).length/tn.length);
  return{pct,html:orig.map((w,i)=>`<span class="${r[i]?"ok":"miss"}">${esc(w)}</span>`).join(" ")}}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(alt){const same=voices.filter(v=>v.lang.replace("_","-")===S.accent);const en=voices.filter(v=>v.lang.startsWith("en"));const list=same.length?same:en;if(!list.length)return null;return alt&&list.length>1?list[1]:list[0]}
function speak(t,o={}){
  if(!("speechSynthesis" in window)){toast("المتصفح ما بدعم الصوت");return}
  if(!o.keep)speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang=S.accent;const v=pickVoice(o.alt);if(v)u.voice=v;
  u.rate=o.slow?Math.max(.5,S.rate-.35):S.rate;u.pitch=o.pitch||1;
  if(o.onend)u.onend=o.onend;if(o.onstart)u.onstart=o.onstart;speechSynthesis.speak(u)}
let seqId=0;
function speakSeq(items,done){const id=++seqId;speechSynthesis.cancel();let i=0;
  const next=()=>{if(id!==seqId)return;if(i>=items.length){done&&done();return}const it=items[i++];it.start&&it.start();speak(it.t,{keep:true,pitch:it.pitch,alt:it.alt,onend:()=>setTimeout(next,250)})};next()}
function stopSpeak(){seqId++;try{speechSynthesis.cancel()}catch(e){}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const SRERR={"not-allowed":"لازم تسمح للموقع يستخدم الميكروفون من إعدادات المتصفح.","service-not-allowed":"لازم تسمح للموقع يستخدم الميكروفون من إعدادات المتصفح.","no-speech":"ما سمعت شي، قرّب الجهاز واحكِ بصوت أوضح.","network":"التعرّف على الصوت بدو اتصال إنترنت.","audio-capture":"ما في ميكروفون شغّال على الجهاز."};

function listen(onAlts,onErr,onEnd){
  if(!SR){onErr("المتصفح هاد ما بدعم التعرّف على الصوت. استخدم Chrome أو Safari حديث.");onEnd&&onEnd();return}
  if(recOn&&rec){rec.stop();return}
  stopSpeak();rec=new SR();rec.lang=S.accent;rec.interimResults=false;rec.maxAlternatives=4;recOn=true;
  rec.onresult=e=>onAlts([...e.results[0]].map(r=>r.transcript));
  rec.onerror=e=>onErr(SRERR[e.error]||"صار خطأ بالتسجيل، جرّب مرة ثانية.");
  rec.onend=()=>{recOn=false;onEnd&&onEnd()};
  try{rec.start()}catch(e){recOn=false;onErr("ما قدرت أشغّل الميكروفون.");onEnd&&onEnd()}}
function bestMatch(target,alts){let best=null;for(const h of alts){const r=compare(target,h);if(!best||r.pct>best.pct)best={...r,heard:h}}return best}

let PATHLV=null;
function pathItems(lv){
  const c=CATS.filter(x=>x.lv===lv).map(x=>({type:"cat",id:x.id,name:x.name,icon:x.icon,kind:"كلمات",done:x.w.every(w=>S.known[x.id+":"+w[0]])}));
  const l=LESSONS.filter(x=>x.lv===lv).map(x=>({type:"lesson",id:x.id,name:x.t,icon:"📐",kind:"قواعد",done:!!S.done["g:"+x.id]}));
  const d=DIALOGS.filter(x=>x.lv===lv).map(x=>({type:"dialog",id:x.id,name:x.t,icon:x.icon,kind:"محادثة",done:!!S.done["d:"+x.id]}));
  const s=STORIES.filter(x=>x.lv===lv).map(x=>({type:"story",id:x.id,name:x.t+" — "+x.ar,icon:"📜",kind:"قراءة",done:!!S.done["s:"+x.id]}));
  const out=[];const n=Math.max(c.length,l.length,d.length*2,s.length*2);
  for(let i=0;i<n;i++){if(c[i])out.push(c[i]);if(l[i])out.push(l[i]);if(i%2===1&&d[(i-1)/2])out.push(d[(i-1)/2]);if(i%2===1&&s[(i-1)/2])out.push(s[(i-1)/2])}
  out.push({type:"exam",id:lv,name:"امتحان نهاية المستوى "+lv+" + شهادة",icon:"🎓",kind:"امتحان",done:!!(S.certs&&S.certs[lv])});
  return out}
function vPath(){

function openPath(type,id){

async function rGen(){

  const lv=userLv();
