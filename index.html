Reply with ONLY a JSON object, no markdown:
{"title":"title in ${LNAME_EN()}","title_ar":"Arabic title","paragraphs":["p1","p2","p3"],"translation":["Arabic of p1","Arabic of p2","Arabic of p3"],"questions":[{"q":"comprehension question in ${LNAME_EN()}","options":["a","b","c"],"answer":"must be exactly one of the options"}]}
Give exactly 3 questions.`;
  try{const r=await AI.json(prompt,{signal:aiCtl.signal,modelTier:"default"});
    if(!r||!Array.isArray(r.paragraphs)||!r.paragraphs.length||!Array.isArray(r.questions))throw{code:"invalid_json"};
    const st={id:"ai"+Date.now(),lv,t:String(r.title||topic),ar:String(r.title_ar||""),en:r.paragraphs.map(String),tr:(r.translation||[]).map(String),
      q:r.questions.filter(q=>q&&Array.isArray(q.options)&&q.options.includes(q.answer)).slice(0,5).map(q=>[String(q.q),q.options.map(String),String(q.answer)])};
    S.aiStories=[st,...(S.aiStories||[])].slice(0,20);save();clearField("aiTopic");R.id=st.id;R.ans={};R.tr=false;R.hide=false;addXP(3)}

  let t;do{t=shuffle([...SP.item.en.toLowerCase()])}while(t.join("")===SP.item.en.toLowerCase());SP.tiles=t;SP.picked=[];SP.done=false;AFTER=()=>speak(SP.item.en)}

let aiCtl=null;
async function wrAI(){

  WR.busy=true;WR.err=null;WR.ai=null;render();aiCtl=new AbortController();
  const prompt=`You are an expert ${LNAME_EN()} writing teacher for an Arabic-speaking learner (CEFR level ${userLv()}).
Topic: "${WR.topic}"
Learner's text:
"""${txt}"""
Correct the text. Reply with ONLY a JSON object, no markdown, in this exact shape:
{"score": integer 0-10, "corrected": "the full corrected text", "mistakes": [{"wrong": "wrong phrase", "right": "corrected phrase", "why": "very short explanation in Arabic"}], "better": "one more natural or advanced rewrite of one sentence from the text", "tip": "one short encouraging tip in Arabic"}

  try{const r=await AI.json(prompt,{signal:aiCtl.signal,modelTier:"default"});WR.ai=r;addXP(Math.max(5,(r.score|0)+5))}

    return `<section class="panel">${back}<div class="spread" style="margin-top:12px"><h2>⚡ تحدي السرعة</h2><span class="chip">⏱ <span id="timer">${left}</span></span></div>

      <div class="guide s"><span class="w">${esc(s.w.en)}</span></div><div class="ar-big">${esc(s.shown)}</div>
      <div class="row" style="justify-content:center"><button class="btn ghost danger big" data-act="sans" data-v="0">✗ غلط</button><button class="btn good big" data-act="sans" data-v="1">✓ صح</button></div></section>`}
  const h=GM.h;const word=h.w.en.toLowerCase();const shown=[...word].map(c=>h.g.has(c)?c:"_").join(" ");const win=[...word].every(c=>h.g.has(c)),lose=h.lives<=0;
  return `<section class="panel">${back}<div class="spread" style="margin-top:12px"><h2>🔠 خمّن الكلمة</h2><span class="chip">${"❤️".repeat(Math.max(h.lives,0))}${"🤍".repeat(6-Math.max(h.lives,0))}</span></div>

    ${win||lose?`<div class="row" style="justify-content:center;margin-top:10px">${sayBtn(h.w.en)}<button class="btn" data-act="gstart" data-g="hang">كلمة ثانية</button></div>`:
    `<div class="kbd">${"abcdefghijklmnopqrstuvwxyz".split("").map(c=>`<button class="tile ${h.g.has(c)?(word.includes(c)?"hit":"used"):""}" data-act="hkey" data-c="${c}" ${h.g.has(c)?"disabled":""}>${c}</button>`).join("")}</div>
    <div class="center">${h.lives<=3?sayBtn(h.w.en,"🔊 تلميح صوتي"):""}</div>`}</section>`}
function gStart(g){stopGame();S.st.games++;save();checkAch();GM.g=g;
  if(g==="match"){const ws=shuffle(poolWords().filter(w=>w.en.length<14)).slice(0,6);GM.m={words:ws,tiles:shuffle(ws.flatMap((w,i)=>[{id:i,txt:w.en,side:"en"},{id:i,txt:w.ar,side:"ar"}])),sel:null,bad:null,matched:new Set(),start:Date.now(),miss:0}}
  if(g==="speed"){GM.s={end:Date.now()+60000,score:0,wrong:0,over:false};nextSpeed();gTimer=setInterval(()=>{const el=$("#timer");const left=Math.ceil((GM.s.end-Date.now())/1000);if(left<=0){stopGame();GM.s.over=true;if(GM.s.score)addXP(GM.s.score);render()}else if(el)el.textContent=left},250)}
  if(g==="hang"){GM.h={w:pick(poolWords().filter(w=>/^[a-z]+$/i.test(w.en)&&w.en.length>=4)),g:new Set(),lives:6}}
  render()}
function nextSpeed(){const w=pick(poolWords());const ok=Math.random()<.5;GM.s.w=w;GM.s.ok=ok;GM.s.shown=ok?w.ar:pick(ALL.filter(x=>x.ar!==w.ar)).ar}

  return `You are ${sc.role} The learner is an Arabic speaker practicing English at CEFR level ${userLv()}.
Rules:
1. Reply in natural, simple English suited to level ${userLv()}: 1-3 short sentences, then a question to keep the conversation going.
2. If the learner's latest message has grammar, spelling or word-choice mistakes, add a new final line that starts with "✏️" and gives a short correction in Arabic, including the corrected English sentence. If there are no mistakes, do not add that line.
3. If the learner writes in Arabic, reply in English and add a "✏️" line showing how to say their message in English.

function examQs(lv){
  const qs=[],words=shuffle(ALL.filter(w=>w.lv===lv));
  words.slice(0,8).forEach((w,i)=>{const o=shuffle(ALL.filter(x=>x.ar!==w.ar&&x.en!==w.en)).slice(0,3);
    qs.push(i%2?{t:"ar2en",p:w.ar,opts:shuffle([w.en,...o.map(x=>x.en)]),a:w.en}:{t:"en2ar",p:w.en,opts:shuffle([w.ar,...o.map(x=>x.ar)]),a:w.ar})});
  shuffle(LESSONS.filter(l=>l.lv===lv).flatMap(l=>l.q)).slice(0,8).forEach(q=>qs.push({t:"gram",p:q[0],opts:shuffle(q[1]),a:q[2]}));
  const ss=SENT.filter(s=>s.lv===lv);
  shuffle(ss).slice(0,4).forEach(s=>{const o=shuffle(ss.filter(x=>x.en!==s.en)).slice(0,2);qs.push({t:"listen",p:s.en,opts:shuffle([s.en,...o.map(x=>x.en)]),a:s.en})});
  return shuffle(qs)}

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume().catch(()=>{});return AC}
function tone(f,t0,d,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.05,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function sfx(k){
  if(S.vibe!==false&&navigator.vibrate){try{navigator.vibrate(k==="bad"?[35,45,35]:k==="win"||k==="chest"?[25,50,25,50,70]:k==="ok"||k==="combo"?18:0)}catch(e){}}
  if(S.sound===false)return;
  if(k==="ok"){tone(1046.5,0,.28,"sine",.06);tone(1318.5,.07,.34,"sine",.05)}
  else if(k==="bad"){tone(261.6,0,.16,"sine",.05);tone(196,.09,.24,"sine",.045)}
  else if(k==="win"){[523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,i*.09,.42,"sine",.05))}
  else if(k==="combo"){tone(1318.5,0,.18,"sine",.04);tone(1568,.06,.24,"sine",.035)}
  else if(k==="tap"){tone(880,0,.06,"sine",.02)}
  else if(k==="chest"){[523.3,659.3,784,1046.5,1318.5].forEach((f,i)=>tone(f,i*.08,.45,"sine",.045))}}

function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);const W=cv.width=innerWidth,H=cv.height=innerHeight,g=cv.getContext("2d");
  const C=["#2F6BFF","#FFC940","#1DB36B","#FF6B9A","#8B5CF6","#FF8A1F"];
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*15-5,s:Math.random()*8+5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:C[Math.random()*C.length|0],sh:Math.random()<.5}));
  const t0=performance.now();(function f(t){const k=(t-t0)/1000;g.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.globalAlpha=Math.max(0,1-k/2.4);g.fillStyle=p.c;
      if(p.sh)g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else{g.beginPath();g.arc(0,0,p.s/2.6,0,7);g.fill()}g.restore()});

function touchDay(){const t=dayStr(new Date());if(S.today.d!==t)S.today={d:t,xp:0};if(S.last===t)return;
  const y=dayOf(Date.now()-864e5),y2=dayOf(Date.now()-2*864e5);

  else S.streak=1;
  S.last=t;const cut=dayOf(Date.now()-70*864e5);S.days=(S.days||[]).filter(d=>d>=cut);if(!S.days.includes(t))S.days.push(t);
  if(S.streak%7===0&&(S.freeze||0)<2){S.freeze=(S.freeze||0)+1;setTimeout(()=>toast("🧊 كسبت حماية سلسلة!"),1800)}}
function addXP(n){touchDay();

  if(answer){COMBO++;if(COMBO>=3){n*=2;extra=`🔥 ${COMBO} ورا بعض — نقاط ×2`;if(COMBO===3||COMBO%5===0)setTimeout(()=>sfx("combo"),160)}}

  S.xp+=n;S.today.xp+=n;const wk=isoWeek();if(!S.week||S.week.id!==wk)S.week={id:wk,xp:0};S.week.xp+=n;
  save();header();

  if(after!==before){setTimeout(()=>{confetti();sfx("win");toast(`${after[2]} لقب جديد: ${after[1]}`)},700)}

let PLY=null;
function startPlayer(o){PLY=Object.assign({i:0,picked:null,score:0,log:[]},o);route="player";render();window.scrollTo(0,0)}
function vPlayer(){
  if(!PLY)return vHome();
  const P=PLY,n=P.qs.length,q=P.qs[P.i];
  if(q&&q.say&&P.picked===null)AFTER=()=>speak(q.say);
  const top=`<div class="ply-top"><button class="ply-x" data-act="plyquit" aria-label="خروج">✕</button><div class="progress ply-bar"><i style="width:${100*(P.i+(P.picked!==null?1:0))/n}%"></i></div><span class="ply-n">${P.i+1}/${n}</span></div>`;
  const opts=q.opts.map((o,k)=>{let c="";if(P.picked!==null&&!P.noReveal){if(o===q.a)c="right";else if(k===P.picked)c="wrong"}else if(P.picked===k)c="chosen";
    return `<button class="opt ply-opt ${c}" data-act="plypick" data-k="${k}" ${P.picked!==null?"disabled":""} ${q.ltr?'dir="ltr"':""}><span class="ok-n">${k+1}</span><span class="ot">${esc(o)}</span></button>`}).join("");
  const ok=P.picked!==null&&q.opts[P.picked]===q.a;
  const fb=P.picked===null||P.noReveal?"":`<div class="ply-fb ${ok?"ok":"bad"}"><div class="fb-in">${mascot(ok?"happy":"sad",52)}<div class="fb-t"><b>${ok?pick(["ممتاز! 🎉","صح! 👏","برافو!","شاطر!"]):"مش هيك 😅"}</b>${ok?(q.why?`<span>${q.why}</span>`:""):`<span>الإجابة الصح: <b dir="${q.ltr?"ltr":"auto"}">${esc(q.a)}</b></span>`}</div>
    <button class="btn ${ok?"good":"bad-btn"} big" data-act="plynext" autofocus>${P.i===n-1?"النتيجة":"كمّل"}</button></div></div>`;
  return `<div class="ply">${top}<div class="ply-card" data-i="${P.i}"><p class="ply-lbl">${q.label||"اختار الإجابة الصح"}</p><div class="ply-prompt">${q.prompt}</div><div class="ply-opts">${opts}</div></div>${fb}</div>`}
function plyPick(k){const P=PLY;if(!P||P.picked!==null)return;P.picked=k;const q=P.qs[P.i],ok=q.opts[k]===q.a;if(ok)P.score++;P.log.push({q,ok,k});
  if(P.onAnswer)P.onAnswer(q,ok,k);else sfx(ok?"ok":"bad");
  render();if(P.noReveal)setTimeout(plyNext,380)}
function plyNext(){const P=PLY;if(!P||P.picked===null)return;P.i++;P.picked=null;
  if(P.i>=P.qs.length){const f=P.onFinish;PLY=null;f&&f(P);return}render();window.scrollTo(0,0)}
Object.assign(A,{plypick:d=>plyPick(+d.k),plynext:plyNext,
  plyquit:()=>{if(PLY&&PLY.i>0&&!confirm("تطلع من التمرين؟ التقدّم بهالتمرين ما رح ينحفظ."))return;const back=PLY&&PLY.back||"home";PLY=null;go(back)}});
document.addEventListener("keydown",e=>{if(route!=="player"||!PLY||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(/^[1-4]$/.test(e.key)&&PLY.picked===null){const k=+e.key-1;if(PLY.qs[PLY.i].opts[k]!=null)plyPick(k)}
  else if(e.key==="Enter"&&PLY.picked!==null){e.preventDefault();plyNext()}});

function voiceScore(v){const n=v.name,l=v.lang.replace("_","-");let s=0;
  if(l===S.accent)s+=50;else if(/^en/i.test(l))s+=(/en-(US|GB|AU|CA)/i.test(l)?12:4);else return -999;
  if(/natural|neural/i.test(n))s+=45;if(/online/i.test(n))s+=20;if(/google/i.test(n))s+=30;if(/premium|enhanced/i.test(n))s+=35;
  if(/samantha|ava|allison|susan|zoe|aria|jenny|guy|libby|sonia|ryan|daniel|serena|karen|moira|tessa|nicky|evan|joelle|nathan|michelle|christopher|emma|brian/i.test(n))s+=18;
  if(BADV.test(n))s-=200;if(/india|en-IN/i.test(n+l))s-=10;return s}

function listen(onAlts,onErr,onEnd){

  if(recOn&&rec){try{rec.stop()}catch(e){}return}
  stopSpeak();if(typeof curAudio!=="undefined"&&curAudio){try{curAudio.pause()}catch(e){}}
  const silenceMs=route==="tutor"?2300:1600;
  let finalAlts=null,interim="",restarted=false,silT=null,errMsg=null,noSpeech=false;
  rec=new SR();rec.lang=window.LISTEN_LANG||S.accent;rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;recOn=true;setLive("");
  const armSilence=()=>{clearTimeout(silT);silT=setTimeout(()=>{try{rec.stop()}catch(e){}},silenceMs)};
  rec.onresult=e=>{let it="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){finalAlts=(finalAlts||[]).concat([...r].map(a=>a.transcript.trim()))}else it+=r[0].transcript}
    if(it)interim=it;setLive(finalAlts?finalAlts[0]:interim);armSilence()};
  rec.onspeechstart=()=>armSilence();
  rec.onerror=e=>{if(e.error==="no-speech"){noSpeech=true;return}if(e.error==="aborted")return;errMsg=SRERR[e.error]||"صار خطأ بالتسجيل، جرّب مرة ثانية."};
  rec.onend=()=>{clearTimeout(silT);
    if(!finalAlts&&!interim&&!errMsg&&!restarted){restarted=true;noSpeech=false;try{rec.start();setLive("");return}catch(e){}}
    recOn=false;setLive(null);
    if(!finalAlts&&interim)finalAlts=[interim.trim()];
    if(finalAlts&&finalAlts.length)onAlts(finalAlts);else if(errMsg)onErr(errMsg);else onErr("ما سمعت شي 🙉 قرّب الجهاز من تمك، واحكي بصوت أوضح شوي.");
    onEnd&&onEnd()};
  try{rec.start();armSilence();clearTimeout(silT);silT=setTimeout(()=>{try{rec.stop()}catch(e){}},9000)}catch(e){recOn=false;setLive(null);onErr("ما قدرت أشغّل الميكروفون.");onEnd&&onEnd()}}

/* lenient comparison: near-miss words count as correct */
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const skey=w=>w.replace(/ph/g,"f").replace(/wh/g,"w").replace(/ea/g,"e").replace(/ck/g,"k").replace(/(.)\1+/g,"$1").replace(/e$/,"");
function wordEq(a,b){if(a===b)return true;if(!a||!b)return false;if(skey(a)===skey(b))return true;const L=Math.max(a.length,b.length);return 1-lev(a,b)/L>=(L<=3?.67:.75)}
const CONTR={"do not":"don't","does not":"doesn't","did not":"didn't","can not":"can't","cannot":"can't","is not":"isn't","are not":"aren't","was not":"wasn't","will not":"won't","i am":"i'm","it is":"it's","i will":"i'll","you are":"you're","we are":"we're","they are":"they're","let us":"let's","i have":"i've","he is":"he's","she is":"she's","that is":"that's","what is":"what's","i would":"i'd","you will":"you'll"};
const EXPN=Object.fromEntries(Object.entries(CONTR).filter(([k])=>k!=="cannot").map(([k,v])=>[v,k]));
function fuzzyMatch(target,heard){const orig=target.split(/\s+/),tn=orig.map(w=>norm(w)),raw=norm(heard).split(" ").filter(Boolean),tset=new Set(tn),bn=[];
  const tjoined=" "+tn.join(" ")+" ";
  for(let k=0;k<raw.length;k++){const pair=k+1<raw.length?raw[k]+" "+raw[k+1]:"";
    if(pair&&CONTR[pair]&&tset.has(CONTR[pair])){bn.push(CONTR[pair]);k++;continue}
    if(EXPN[raw[k]]&&tjoined.includes(" "+EXPN[raw[k]]+" ")){bn.push(...EXPN[raw[k]].split(" "));continue}
    if(k+1<raw.length&&tset.has(raw[k]+raw[k+1])&&!tset.has(raw[k])){bn.push(raw[k]+raw[k+1]);k++}else bn.push(raw[k])}
  const n=tn.length,m=bn.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=wordEq(tn[i],bn[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const r=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(wordEq(tn[i],bn[j])){r[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const valid=tn.filter(Boolean).length||1,pct=Math.round(100*r.filter((x,k)=>x&&tn[k]).length/valid);
  return{pct,html:orig.map((w,k)=>`<span class="${r[k]?"ok":"miss"}">${esc(w)}</span>`).join(" ")}}
function bestMatch(target,alts){let best=null;for(const h of alts){const r=fuzzyMatch(target,h);if(!best||r.pct>best.pct)best={...r,heard:h}}return best}

{id:"frs6",lv:"A2",t:"Mon premier travail",ar:"أول شغلة إلي",en:["L'été dernier, j'ai trouvé mon premier travail dans une petite librairie. Le premier jour, j'étais très nerveux.","Mon patron, monsieur Adel, était très gentil. Il m'a montré comment utiliser l'ordinateur et où ranger les nouveaux livres.","Après deux semaines, je connaissais chaque étagère. J'ai beaucoup appris et j'ai acheté trois livres avec mon premier salaire."],tr:["الصيف الماضي لقيت أول شغلة إلي بمكتبة صغيرة. بأول يوم كنت متوتر كتير.","مديري الأستاذ عادل كان لطيف كتير. فرجاني كيف أستخدم الكمبيوتر ووين أرتب الكتب الجديدة.","بعد أسبوعين صرت أعرف كل رف. تعلمت كتير واشتريت ثلاث كتب من أول معاش."],

{id:"frs7",lv:"B1",t:"La bénévole",ar:"المتطوعة",en:["Quand la guerre a détruit de nombreuses écoles, Rana a décidé de devenir enseignante bénévole dans une petite classe installée sous une tente.","Au début, les enfants étaient silencieux et effrayés. Rana a utilisé des jeux, des chansons et des dessins pour qu'ils se sentent de nouveau en sécurité.","Des mois plus tard, un garçon lui a offert un dessin de toute la classe en train de sourire. « C'est notre école », a-t-il dit. Rana a compris que l'espoir aussi peut s'enseigner."],tr:["لما الحرب هدمت مدارس كتير، رنا قررت تصير معلمة متطوعة بصف صغير تحت خيمة.","بالأول الأولاد كانوا ساكتين وخايفين. رنا استخدمت ألعاب وأغاني ورسومات عشان يرجعوا يحسوا بالأمان.","بعد شهور، ولد أهداها رسمة للصف كله وهم مبتسمين وقال: «هاي مدرستنا». رنا فهمت إنه الأمل كمان بيتعلّم."],
 q:[["Pourquoi Rana est-elle devenue bénévole ?",["parce que des écoles ont été détruites","pour l'argent","parce qu'elle s'ennuyait"],"parce que des écoles ont été détruites"],["Comment a-t-elle aidé les enfants ?",["avec des jeux, des chansons et des dessins","avec des examens","seulement avec des devoirs"],"avec des jeux, des chansons et des dessins"],["Qu'est-ce que le garçon lui a offert ?",["un dessin","une lettre","une fleur"],"un dessin"]]},
{id:"frs8",lv:"B2",t:"La lettre",ar:"الرسالة",en:["En rangeant la vieille armoire de sa grand-mère, Maya a trouvé une enveloppe jaunie qui n'avait jamais été ouverte. Elle était adressée à sa grand-mère et datait de cinquante ans.","À l'intérieur se trouvait une lettre d'une amie d'enfance qui avait émigré et promettait de revenir un jour. De toute évidence, sa grand-mère ne l'avait jamais lue.","Maya a fait des recherches sur Internet et, à sa grande surprise, a retrouvé la petite-fille de cette amie. Une semaine plus tard, les deux familles se parlaient en visioconférence, riant et pleurant à la fois."],tr:["وهي بترتب خزانة ستها القديمة، مايا لقت ظرف مصفر عمره ما انفتح. كان باسم ستها وتاريخه قبل خمسين سنة.","جواه رسالة من صديقة طفولة هاجرت، وبتوعد ترجع يوم من الأيام. واضح إنه ستها عمرها ما قرأتها.","مايا دورت عالإنترنت، ولدهشتها لقت حفيدة هديك الصديقة. بعد أسبوع العيلتين كانوا بيحكوا بمكالمة فيديو، بيضحكوا وبيبكوا بنفس الوقت."],
 q:[["Où Maya a-t-elle trouvé l'enveloppe ?",["dans une vieille armoire","dans le jardin","à la poste"],"dans une vieille armoire"],["Qui a écrit la lettre ?",["une amie d'enfance","son grand-père","une professeure"],"une amie d'enfance"],["Comment les familles se sont-elles retrouvées ?",["en visioconférence","à l'aéroport","à un mariage"],"en visioconférence"]]}
);

{id:"frd5",lv:"A1",t:"في المخبز",icon:"🥖",a:"Boulanger",b:"Client",l:[["a","Bonjour ! Qu'est-ce que je vous sers ?","صباح الخير! شو بتحب؟"],["b","Deux baguettes, s'il vous plaît.","باغيتين لو سمحت."],["a","Bien cuites ou pas trop ?","محمّصين منيح ولا لأ؟"],["b","Pas trop, s'il vous plaît. Et quatre croissants.","مش كتير لو سمحت. وأربع كرواسون."],["a","Voilà. Et avec ceci ?","تفضل. وإشي ثاني؟"],["b","C'est tout, merci. Ça fait combien ?","بس هيك شكراً. قديش؟"],["a","Ça fait six euros.","ست يورو."],["b","Voilà. Bonne journée !","تفضل. نهارك سعيد!"]]},
{id:"frd6",lv:"A2",t:"في التاكسي",icon:"🚕",a:"Chauffeur",b:"Passager",l:[["a","Bonjour ! Où allez-vous ?","مرحبا! لوين؟"],["b","À l'hôpital central, s'il vous plaît.","عالمستشفى المركزي لو سمحت."],["a","D'accord. Vous êtes pressé ?","تمام. مستعجل؟"],["b","Oui, j'ai rendez-vous à dix heures.","آه، عندي موعد الساعة عشرة."],["a","Ne vous inquiétez pas, on y sera dans quinze minutes.","لا تقلق، بنوصل خلال ربع ساعة."],["b","Ça va coûter combien ?","قديش رح تكلّف؟"],["a","Environ quinze euros.","حوالي خمستعش يورو."],["b","Merci. Arrêtez-vous ici, s'il vous plaît.","شكراً. وقّف هون لو سمحت."]]},
{id:"frd7",lv:"B1",t:"في البنك",icon:"🏦",a:"Conseiller",b:"Cliente",l:[["a","Bonjour, que puis-je faire pour vous ?","صباح الخير، كيف بقدر أساعدك؟"],["b","Je voudrais ouvrir un compte d'épargne.","بدي أفتح حساب توفير."],["a","Bien sûr. Puis-je voir votre pièce d'identité ?","أكيد. ممكن أشوف هويتك؟"],["b","La voici. Y a-t-il un dépôt minimum ?","تفضل. في حد أدنى للإيداع؟"],["a","Oui, cent euros pour commencer, et il n'y a pas de frais mensuels.","آه، مية يورو كبداية، وما في رسوم شهرية."],["b","Quel est le taux d'intérêt ?","قديش نسبة الفائدة؟"],["a","Deux pour cent par an. Voulez-vous aussi une carte bancaire ?","2% بالسنة. بدك كمان بطاقة بنك؟"],["b","Oui, volontiers. Ce serait très pratique.","آه بكل سرور، رح تكون عملية كتير."]]},
{id:"frd8",lv:"B1",t:"إرجاع منتج",icon:"🔁",a:"Client",b:"Vendeuse",l:[["a","Excusez-moi, j'ai acheté ce casque la semaine dernière, mais le côté gauche ne marche pas.","عفواً، اشتريت هالسماعة الأسبوع الماضي بس الجهة الشمال ما بتشتغل."],["b","Je suis désolée. Vous avez le ticket de caisse ?","آسفة. معك الوصل؟"],["a","Oui, le voici.","آه، تفضلي."],["b","Vous préférez un échange ou un remboursement ?","بتفضّل تبديل ولا ترجيع المصاري؟"],["a","Plutôt un échange, si vous avez le même modèle.","بفضّل تبديل إذا عندكم نفس الموديل."],["b","Oui, nous l'avons. Je vérifie d'abord.","آه موجود. رح أفحصها أول."],["a","Merci, c'est très gentil.","شكراً، لطف كتير."],["b","Voilà. Désolée pour le dérangement.","تفضل. آسفين عالإزعاج."]]}
);

STORIES_ZH.push(
{id:"zhs5",lv:"A1",t:"我的猫",ar:"قطتي",en:["我有一只猫。她叫小白，因为她是白色的。","每天早上，小白坐在窗户旁边看小鸟。","有一天，小白不在家。我到处找她。原来她在我的床下面睡觉！"],tr:["عندي قطة. اسمها شياو باي (يعني البيضا الصغيرة) لأنها بيضا.","كل صبح شياو باي بتقعد جنب الشباك وبتتفرج عالعصافير.","يوم من الأيام شياو باي ما كانت بالبيت. دورت عليها بكل مكان. طلعت نايمة تحت تختي!"],

{id:"zhs6",lv:"A2",t:"我的第一份工作",ar:"أول شغلة إلي",en:["去年夏天，我在一家小书店找到了第一份工作。第一天我很紧张。","我的经理王先生很友好。他教我怎么用电脑，还告诉我新书放在哪儿。","两个星期以后，我认识了每一个书架。我学到了很多，还用第一份工资买了三本书。"],tr:["الصيف الماضي لقيت أول شغلة إلي بمكتبة صغيرة. بأول يوم كنت متوتر كتير.","مديري السيد وانغ كان لطيف كتير. علّمني كيف أستخدم الكمبيوتر وقالي وين بتنحط الكتب الجديدة.","بعد أسبوعين صرت أعرف كل رف. تعلمت كتير واشتريت ثلاث كتب من أول معاش."],

{id:"zhs7",lv:"B1",t:"志愿者",ar:"المتطوعة",en:["战争毁了很多学校以后，拉娜决定在一个帐篷教室里当志愿老师。","一开始，孩子们又安静又害怕。拉娜用游戏、歌曲和画画让他们重新感到安全。","几个月以后，一个男孩送给她一张画，画上全班同学都在笑。他说：“这是我们的学校。”拉娜明白了，希望也是可以教的。"],tr:["بعد ما الحرب خرّبت مدارس كتير، رنا قررت تصير معلمة متطوعة بصف بخيمة.","بالأول الأولاد كانوا ساكتين وخايفين. رنا استخدمت ألعاب وأغاني ورسم عشان يرجعوا يحسوا بالأمان.","بعد كم شهر، ولد أهداها رسمة فيها الصف كله عم يضحك وقال: «هاي مدرستنا». رنا فهمت إنه الأمل كمان بيتعلّم."],

{id:"zhs8",lv:"B1",t:"一封信",ar:"رسالة",en:["玛雅在整理奶奶的旧衣柜时，发现了一个从来没打开过的黄色信封。信是寄给奶奶的，已经有五十年了。","信封里是奶奶小时候一个朋友写的信。那个朋友移民到了国外，说以后一定会回来。很明显，奶奶从来没看过这封信。","玛雅在网上找了很久，没想到真的找到了那个朋友的孙女。一个星期以后，两家人通过视频聊天，又笑又哭。"],tr:["وهي بترتب خزانة ستها القديمة، مايا لقت ظرف أصفر عمره ما انفتح. كان مبعوت لستها وعمره خمسين سنة.","جوا الظرف رسالة من صديقة طفولة لستها، هاجرت وقالت إنها أكيد رح ترجع. واضح إنه ستها عمرها ما قرأتها.","مايا دورت عالإنترنت كتير، وما توقعت إنها فعلاً تلاقي حفيدة الصديقة. بعد أسبوع العيلتين حكوا بمكالمة فيديو، بيضحكوا وبيبكوا."],
 q:[["玛雅在哪儿发现了信封？",["旧衣柜里","花园里","邮局"],"旧衣柜里"],["信是谁写的？",["奶奶小时候的朋友","爷爷","老师"],"奶奶小时候的朋友"],["两家人怎么见面的？",["视频聊天","在机场","在婚礼上"],"视频聊天"]]}
);

{id:"its4",lv:"A2",t:"Una gita a Roma",ar:"رحلة لروما",en:["L'estate scorsa sono andato a Roma con i miei amici. Abbiamo preso il treno da Napoli.","Abbiamo visitato il Colosseo e la Fontana di Trevi. Faceva molto caldo, ma era bellissimo.","La sera abbiamo mangiato una pizza buonissima. Voglio tornare a Roma presto!"],tr:["الصيف الماضي رحت على روما مع أصحابي. أخدنا القطار من نابولي.","زرنا الكولوسيوم ونافورة تريفي. كان الجو حار كتير، بس كان رائع.","بالليل أكلنا بيتزا زاكية كتير. بدي أرجع على روما قريب!"],

{id:"its6",lv:"B1",t:"La volontaria",ar:"المتطوعة",en:["Quando la guerra ha distrutto molte scuole, Rana ha deciso di diventare insegnante volontaria in una piccola classe sotto una tenda.","All'inizio i bambini erano silenziosi e spaventati. Rana ha usato giochi, canzoni e disegni perché si sentissero di nuovo al sicuro.","Mesi dopo, un bambino le ha regalato un disegno di tutta la classe che sorrideva. «Questa è la nostra scuola», ha detto. Rana ha capito che anche la speranza si può insegnare."],tr:["لما الحرب هدمت مدارس كتير، رنا قررت تصير معلمة متطوعة بصف صغير تحت خيمة.","بالأول الأولاد كانوا ساكتين وخايفين. رنا استخدمت ألعاب وأغاني ورسومات عشان يرجعوا يحسوا بالأمان.","بعد شهور، ولد أهداها رسمة للصف كله وهم مبتسمين وقال: «هاي مدرستنا». رنا فهمت إنه الأمل كمان بيتعلّم."],

/* ================== TYPING PRACTICE (اكتب الجملة) + PERSONAL PLAN ================== */
let TY={mode:"sentence",item:null,typed:"",hints:0,done:false,shake:false};
function tyTarget(){return TY.item?(LANG==="zh"?zhPlain(TY.item.en,true):TY.item.en):""}
function newTY(){TY.item=TY.mode==="word"?pick(poolWords().filter(w=>/^\p{L}[\p{L}' ]{2,16}$/u.test(w.en))):pick(poolSent());
  TY.typed="";TY.hints=0;TY.done=false;AFTER=()=>{speak(TY.item.en);focusTY()}}
function focusTY(){const i=$("#tyIn");if(i){i.focus({preventScroll:true});try{i.setSelectionRange(i.value.length,i.value.length)}catch(e){}}}
function tyNorm(s){s=String(s).replace(/[’‘]/g,"'");return LANG==="en"?s.toLowerCase():foldLang(LANG==="tr"?s.toLocaleLowerCase("tr-TR"):s.toLowerCase())}
function tyRender(){const t=tyTarget(),ty=TY.typed;let out="",ok=0;
  for(let i=0;i<t.length;i++){const c=t[i],typed=ty[i];
    let cls=typed===undefined?"g":tyNorm(typed)===tyNorm(c)?"k":"x";
    if(cls==="k")ok++;
    if(c===" ")out+=`<span class="sp ${cls}"> </span>`;else out+=`<span class="${cls}${i===ty.length?" cur":""}">${esc(c)}</span>`}
  return{html:out,ok}}
function vTyping(){
  if(!TY.item)newTY();

function learnerBrief(){let d=null;try{d=rmData()}catch(e){}
  const wd=k=>WMAP[String(k).toLowerCase()];
  const recent=Object.keys(S.known||{}).slice(-8).map(k=>k.split(":").slice(1).join(":"));
  const learning=[...new Set(dueList().slice(0,6).concat(recent))].map(wd).filter(Boolean).slice(0,10).map(w=>`${w.en} (${w.ar})`);
  const L=[`- Level: ${userLv()}${d&&d.next?`, working towards ${d.next}`:""}${d?`; progress in this level: ${d.pct}%`:""}.`];
  if(d){const u=d.units[d.cur];if(u)L.push(`- Current study unit: ${u.title} (${u.done}/${u.items.length} done).`);
    const nx=d.rest.filter(x=>!x.done).slice(0,3).map(x=>`${x.kind}: ${x.name}`);if(nx.length)L.push(`- Next study steps: ${nx.join("; ")}.`);
    const w=d.skills.filter(s=>s.done<s.total).sort((a,b)=>a.done/a.total-b.done/b.total)[0];
    if(w)L.push(`- Weakest area right now: ${({"كلمات":"vocabulary","قواعد":"grammar","قراءة":"reading","محادثات":"conversation"})[w.n]||w.n}.`)}
  if(learning.length)L.push(`- Words they are learning now: ${learning.join(", ")}.`);
  if(S.streak)L.push(`- Study streak: ${S.streak} days.`);
  return `\nLEARNER PROFILE (use it to personalize; never read it out as a list):\n${L.join("\n")}`}

- Teach at "i+1": mostly understandable, with one small new thing at a time.
- Weave the learner's current study words and grammar (from the profile) naturally into the conversation, and invite them to use them.
- Every few turns, briefly recall something you taught before and check if they remember it (spaced review).
- Correct with recasts: repeat their idea correctly and naturally; add a one-line Arabic tip only for important mistakes. Don't over-correct.
- Ask open, personal questions (why / how / what happened) rather than yes/no questions — one question at a time.
- If they seem confused or reply in Arabic, simplify, give a tiny example, and encourage them.
- Notice repeated mistakes and fix the root cause simply.
- React to what they say like a real, curious friend before teaching anything.`;

  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function pnScore(target,alts){const t=pnNorm(target);let best=0,heard=alts[0]||"";
  for(const a of alts){const h=pnNorm(a);let sc=h.split(" ").includes(t)||h===t?1:0;
    if(!sc){const words=h.split(" ").concat([h]);for(const w of words){const r=1-pnLev(w,t)/Math.max(w.length,t.length,1);if(r>sc)sc=r}}
    if(sc>best){best=sc;heard=a}}
  return{score:Math.round(best*100),heard}}
const PN={};  // results per letter: key → {score, heard, tip, busy}
const pnWord=it=>LANG==="zh"?it[1]:it[2];
function pnTry(it,key,done){if(!SR){toast("المايك بيحتاج Chrome أو Safari حديث");done&&done(null);return}
  PN[key]={busy:true};render();
  listen(alts=>{const r=pnScore(pnWord(it),alts||[]);PN[key]=Object.assign(r,{busy:false});
      if(r.score>=85){addXP(2);if(typeof sfx==="function")sfx("ok")}else{if(typeof sfx==="function")sfx("bad");pnTip(it,key,r.heard)}
      render();done&&done(r)},
    e=>{PN[key]={busy:false,err:e};render();done&&done(null)},
    ()=>{if(PN[key]&&PN[key].busy){PN[key].busy=false;render();done&&done(null)}})}
async function pnTip(it,key,heard){if(!AI||AIstate!=="ok"||!heard)return;
  try{const r=await AI(`An Arabic-speaking beginner tried to pronounce the ${LNAME_EN()} word "${pnWord(it)}". Speech recognition heard: "${heard}". In ONE short sentence of friendly Palestinian Arabic, tell them exactly which sound to fix and how (lips/tongue/throat). No preamble.`,{modelTier:"quick"});
    const t=String((r&&r.text)||r||"").trim().split("\n")[0].slice(0,220);if(t&&PN[key]){PN[key].tip=t;render()}}catch(e){}}

let DR={on:false,i:0,phase:"",res:[]};
const sleepP=ms=>new Promise(r=>setTimeout(r,ms));
const speakP=items=>new Promise(r=>{let done=false;const f=()=>{if(!done){done=true;r()}};speakSeq(items,f);setTimeout(f,9000)});
async function drillRun(){const g=abcData().groups.find(x=>x.id===AB.g);if(!g)return;DR={on:true,i:0,phase:"play",res:[]};render();
  for(let i=0;i<g.L.length&&DR.on;i++){const it=g.L[i];DR.i=i;DR.phase="play";render();await speakP(abcSay(it));if(!DR.on)break;
    DR.phase="listen";render();
    if(SR){const r=await new Promise(res=>{let got=null;listen(a=>{got=pnScore(pnWord(it),a||[])},()=>{},()=>res(got))});DR.res[i]=r?r.score:0}
    else{await sleepP(2500);DR.res[i]=null}
    if(!DR.on)break;DR.phase="result";render();await sleepP(1100)}
  if(DR.on){DR.phase="done";const sc=DR.res.filter(x=>x!=null);if(sc.length&&sc.reduce((a,b)=>a+b,0)/sc.length>=70)addXP(8);render()}}

  let r;try{r=await fetch(CFG.SUPABASE_URL+"/functions/v1/tutor",{method:"POST",signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token,apikey:CFG.SUPABASE_ANON_KEY},body:JSON.stringify({system,messages,max_tokens:1200})})}
  catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};throw{code:"upstream_error"}}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw{code:d.error==="rate_limited"?"rate_limited":d.error==="not_subscribed"?"not_granted":d.error==="ai_not_configured"?"ai_not_configured":"upstream_error"};
  return d.text||""}

async function subSend(){
  const ref=val("subRef"),fi=$("#subFile"),f=fi&&fi.files&&fi.files[0];SUB.err=null;SUB.msg=null;
  if(!SUB.plan||!SUB.method){SUB.err="اختار الخطة وطريقة الدفع.";render();return}
  if(!ref&&!f){SUB.err="اكتب رقم الحوالة أو ارفع صورة الإيصال.";render();return}
  if(f&&f.size>5e6){SUB.err="حجم الصورة أكبر من 5 ميغا.";render();return}
  SUB.busy=true;render();
  try{let path=null;
    if(f){const ext=((f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,""))||"jpg";path=`${AUTH.user.id}/${Date.now()}.${ext}`;
      const {error}=await sb.storage.from("proofs").upload(path,f,{contentType:f.type||undefined});if(error)throw error}
    const {error}=await sb.from("payment_requests").insert({user_id:AUTH.user.id,plan_id:SUB.plan,method:SUB.method,reference:ref,proof_path:path,coupon:SUB.coupon?SUB.coupon.code:null});
    if(error)throw error;
    clearField("subRef");const sf=$("#subFile");if(sf)sf.value="";SUB.msg="وصلنا طلبك ✅ رح نفعّل حسابك "+CFG.ACTIVATION_TIME+".";SUB.plans=null;await loadSub()}
  catch(e){SUB.err=/too_many_pending/.test(e.message||"")?"عندك 3 طلبات معلّقة، استنى لحد ما نراجعها.":/invalid_coupon/.test(e.message||"")?"كود الخصم مش صالح أو انتهى.":"ما قدرنا نرسل الطلب: "+(e.message||"")}
  SUB.busy=false;render()}

/* ---------- قفل المحتوى المدفوع ---------- */
function itemLv(act,d){
  if(act==="wcat")return (CATS.find(c=>c.id===d.id)||{}).lv;
  if(act==="gopen")return (LESSONS.find(x=>x.id===d.id)||{}).lv;
  if(act==="dopen")return (DIALOGS.find(x=>x.id===d.id)||{}).lv;
  if(act==="ropen"){const s=STORIES.find(x=>x.id===d.id);return s?s.lv:"PRO"}
  if(act==="exopen")return d.lv;
  if(act==="openpath"){if(d.t==="exam")return d.id;return itemLv({cat:"wcat",lesson:"gopen",dialog:"dopen",story:"ropen"}[d.t],d)}
  return null}
function gateCheck(act,d){if(!AUTH.user||isPremium())return false;const lv=itemLv(act,d);
  if(lv&&lv!=="A1"){go("subscribe");toast("🔒 هاد المحتوى للمشتركين");return true}return false}

  dosignup:async()=>{const n=val("suName"),ph="",e=val("suEmail"),p=($("#suPass")||{}).value||"";

    AUTH.busy=true;AUTH.err=null;render();

  doforgot:async()=>{const e=val("fgEmail");if(!e){AUTH.err="اكتب إيميلك.";render();return}
    AUTH.busy=true;render();const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split("#")[0]});AUTH.busy=false;
    if(error)AUTH.err=authErr(error);else{AUTH.msg="بعتنالك رابط على الإيميل.";AUTH.mode="login"}render()},
  donewpass:async()=>{const p=($("#npPass")||{}).value||"";if(p.length<6){AUTH.err="كلمة السر لازم تكون 6 أحرف على الأقل.";render();return}
    const {error}=await sb.auth.updateUser({password:p});if(error){AUTH.err=authErr(error);render();return}AUTH.recovery=false;AUTH.err=null;toast("تم تغيير كلمة السر ✅");render()},
  logout:async()=>{if(!confirm("تسجيل خروج؟"))return;await syncNow();await sb.auth.signOut()},
  subplan:d=>{SUB.plan=d.id;render()},
  couponapply:async()=>{const c=val("subCoupon");if(!c){toast("اكتب الكود");return}const {data,error}=await sb.rpc("check_coupon",{c});
    if(error||!data){SUB.err="كود الخصم مش صالح أو انتهى.";SUB.coupon=null}else{SUB.coupon={code:c.toUpperCase(),pct:data};SUB.err=null;clearField("subCoupon");toast("🏷️ تم تطبيق خصم "+data+"%")}render()},
  coupondel:()=>{SUB.coupon=null;render()},
  install:async()=>{if(!INSTALL)return;INSTALL.prompt();try{await INSTALL.userChoice}catch(e){}INSTALL=null;render()},
  authpage:d=>{AUTH.page=d.p||null;render();window.scrollTo(0,0)},
  agree:()=>{AUTH.agree=!AUTH.agree},
  faq:d=>{LAND.faq=LAND.faq===+d.i?-1:+d.i;render()},
  landgo:d=>{AUTH.mode=d.m;AUTH.err=null;render();const c=$("#authcard");if(c)c.scrollIntoView({behavior:"smooth",block:"start"})},
  submeth:d=>{SUB.method=d.id;render()},
  subsend:subSend,
  subreload:()=>{SUB.plans=null;render()},
  copy:d=>{try{navigator.clipboard.writeText(d.t);toast("انتسخ ✅")}catch(e){toast(d.t)}}

/* ---------- إحصائيات الزوار (زيارة وحدة لكل جلسة) ---------- */
function trackVisit(){try{
  if(sessionStorage.getItem("su_v"))return;sessionStorage.setItem("su_v","1");
  const q=new URLSearchParams(location.search);let src=(q.get("src")||q.get("utm_source")||"").toLowerCase();
  if(!src&&document.referrer){try{const h=new URL(document.referrer).hostname.replace(/^www\.|^m\.|^l\.|^lm\./,"");if(h&&h!==location.hostname)src=h}catch(e){}}
  const device=isStandalone()?"app":/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"mobile":"desktop";
  sb.from("visits").insert({source:src.slice(0,60)||null,device,logged_in:!!AUTH.user}).then(()=>{},()=>{});
}catch(e){}}

{const r=new URLSearchParams(location.search).get("ref");if(r)try{localStorage.setItem("su_ref",r.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,20))}catch(e){}}

/* ---------- رصيد دقائق صوت توكي الحقيقي ---------- */
const MIN={packs:null,orders:[],pack:null,method:null,busy:false,err:null,msg:null,bal:0};
async function loadMin(){if(!AUTH.user)return;
  const [p,o,b]=await Promise.all([sb.from("minute_packs").select("*").eq("active",true).order("sort"),
    sb.from("minute_orders").select("*").eq("user_id",AUTH.user.id).order("created_at",{ascending:false}).limit(10),
    sb.from("profiles").select("live_balance_sec").eq("id",AUTH.user.id).maybeSingle()]);
  MIN.packs=p.data||[];MIN.orders=o.data||[];MIN.bal=(b.data&&b.data.live_balance_sec)||0;if(AUTH.profile){AUTH.profile.live_balance_sec=MIN.bal;header()}
  if(!MIN.pack&&MIN.packs[0])MIN.pack=MIN.packs[0].id;if(!MIN.method)MIN.method=CFG.PAYMENT_METHODS[0].id;if(route==="minutes")render()}
function vMinutes(){if(!AUTH.user)return `<section class="panel">${topbar("⚡ دقائق صوت توكي","")}<p>سجّل دخول أول.</p></section>`;
  if(MIN.packs===null){loadMin();return `<section class="panel">${topbar("⚡ دقائق صوت توكي","")}<p class="muted">جاري التحميل…</p></section>`}
  const pack=MIN.packs.find(x=>x.id===MIN.pack),meth=CFG.PAYMENT_METHODS.find(x=>x.id===MIN.method),pending=MIN.orders.find(o=>o.status==="pending");
  const wa=`https://wa.me/${CFG.WHATSAPP}?text=${encodeURIComponent(`مرحبا، حوّلت شحن دقائق صوت توكي (${pack?pack.name:""}) على ${CFG.APP_NAME}. إيميلي: ${AUTH.user.email}`)}`;
  return `<section class="panel">${topbar("⚡ دقائق صوت توكي الحقيقي","احكي مع توكي بصوت طبيعي أكثر من دقايقك المجانية")}
    <div class="minbal">${mascot("happy",70)}<div><small>رصيدك</small><b>${Math.floor(MIN.bal/60)} دقيقة</b><span>بتنخصم بس لما تخلص دقايقك المجانية اليومية، وعلى الوقت اللي حكيته فعلاً.</span></div></div></section>
  <section class="panel"><h2>1. اختار الباقة</h2>
    ${MIN.packs.length?`<div class="plans">${MIN.packs.map(x=>`<button class="plan" data-act="minpack" data-id="${x.id}" aria-pressed="${x.id===MIN.pack}"><b>${esc(x.name)}</b><span class="price">${+x.price} ${CFG.CURRENCY}</span><small>${x.minutes} دقيقة</small></button>`).join("")}</div>`:`<p class="muted">ما في باقات متاحة هلأ.</p>`}</section>
  <section class="panel"><h2>2. حوّل المبلغ${pack?` (${+pack.price} ${CFG.CURRENCY})`:""}</h2>
    <div class="row" style="margin-bottom:10px">${CFG.PAYMENT_METHODS.map(x=>`<button class="chipbtn" data-act="minmeth" data-id="${x.id}" aria-pressed="${x.id===MIN.method}">${x.icon} ${esc(x.name)}</button>`).join("")}</div>
    ${meth?`<div class="paybox">${meth.details.map(l=>`<div class="spread"><span>${esc(l)}</span><button class="say" data-act="copy" data-t="${esc(l.split(":").slice(1).join(":").trim()||l)}">نسخ</button></div>`).join("")}</div>`:""}</section>
  <section class="panel"><h2>3. أرسل تأكيد التحويل</h2>
    ${pending?`<div class="fb" style="background:var(--sky)">⏳ عندك طلب شحن قيد المراجعة. الدقايق بتنضاف ${esc(CFG.ACTIVATION_TIME)}.</div>`:""}
    <label class="fld"><span>رقم الحوالة / المرجع</span><input id="minRef" data-keep dir="ltr" autocomplete="off"></label>
    <label class="fld"><span>صورة الإيصال (اختياري، لحد 5 ميغا)</span><input id="minFile" type="file" accept="image/*,application/pdf"></label>
    ${MIN.err?`<div class="fb bad">${esc(MIN.err)}</div>`:""}${MIN.msg?`<div class="fb good">${esc(MIN.msg)}</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn hl" data-act="minsend" ${MIN.busy?"disabled":""}>${MIN.busy?"عم يرسل…":"أرسل طلب الشحن"}</button><a class="btn ghost" href="${wa}" target="_blank" rel="noopener">💬 واتساب</a></div></section>
  ${MIN.orders.length?`<section class="panel"><div class="spread"><h2>طلبات الشحن</h2><button class="say" data-act="minreload">🔄 تحديث</button></div>
    ${MIN.orders.map(o=>`<div class="lesson-ex"><div class="e"><span style="color:var(--ink)">${{pending:"⏳ قيد المراجعة",approved:"✅ انضافت",rejected:"❌ مرفوض"}[o.status]} — ${o.minutes} دقيقة · ${+o.amount} ${CFG.CURRENCY}</span><span>${fmtDate(o.created_at)}${o.admin_note?" — "+esc(o.admin_note):""}</span></div></div>`).join("")}</section>`:""}`}
async function minSend(){const ref=val("minRef"),fi=$("#minFile"),f=fi&&fi.files&&fi.files[0];MIN.err=null;MIN.msg=null;
  if(!MIN.pack||!MIN.method){MIN.err="اختار الباقة وطريقة الدفع.";render();return}
  if(!ref&&!f){MIN.err="اكتب رقم الحوالة أو ارفع صورة الإيصال.";render();return}
  if(f&&f.size>5e6){MIN.err="حجم الصورة أكبر من 5 ميغا.";render();return}
  MIN.busy=true;render();
  try{let path=null;
    if(f){const ext=((f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,""))||"jpg";path=`${AUTH.user.id}/min-${Date.now()}.${ext}`;
      const {error}=await sb.storage.from("proofs").upload(path,f,{contentType:f.type||undefined});if(error)throw error}
    const {error}=await sb.rpc("request_minutes",{pack:MIN.pack,meth:MIN.method,ref:ref||"",proof:path});if(error)throw error;
    clearField("minRef");const mf=$("#minFile");if(mf)mf.value="";MIN.msg="وصلنا طلبك ✅ الدقايق بتنضاف لرصيدك "+CFG.ACTIVATION_TIME+".";await loadMin()}
  catch(e){MIN.err=/too_many_pending/.test(e.message||"")?"عندك 3 طلبات معلّقة، استنى لحد ما نراجعها.":/bad_pack/.test(e.message||"")?"هالباقة مش متاحة هلأ.":"ما قدرنا نرسل الطلب: "+(e.message||"")}
  MIN.busy=false;render()}
VIEWS.minutes=vMinutes;PARENT.minutes="me";
{const _hd=header;header=function(){_hd();const c=document.getElementById("minchip");if(!c)return;const on=!!(AUTH.user&&AUTH.profile);c.hidden=!on;if(on){const el=document.getElementById("minbal");if(el)el.textContent=Math.floor((AUTH.profile.live_balance_sec||0)/60)}}}
Object.assign(A,{minpack:d=>{MIN.pack=+d.id;render()},minmeth:d=>{MIN.method=d.id;render()},minsend:minSend,minreload:()=>{MIN.packs=null;render()}});
{const _vm3=VIEWS.me;VIEWS.me=function(){let h=_vm3();if(!AUTH.user)return h;const m=Math.floor(((AUTH.profile&&AUTH.profile.live_balance_sec)||0)/60);
  return h.replace('<section class="rankcard">',`<button class="lang-strip" data-act="go" data-r="minutes"><span class="lf">⚡</span><b>دقائق صوت توكي الحقيقي: ${m} د</b><span>اشحن ›</span></button><section class="rankcard">`)}}

/* ---------- التشغيل ---------- */
applyTheme();render();
sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==="PASSWORD_RECOVERY"){AUTH.recovery=true}
  const uid=session&&session.user?session.user.id:null;
  if(ev==="INITIAL_SESSION"){AUTH.user=session?session.user:null;setTimeout(trackVisit,1500)}
  if(ev==="INITIAL_SESSION"||uid!==AUTH.uid){AUTH.uid=uid;setTimeout(()=>onSession(session),0)}
  else if(ev==="PASSWORD_RECOVERY")setTimeout(render,0);
});
