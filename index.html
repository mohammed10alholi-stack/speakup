<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتري الإنجليزي — تعلّم الإنجليزي من الصفر للاحتراف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F5F8FC;--card:#FFFFFF;--ink:#1A2B4C;--soft:#5B6B86;--rule:#BFD1EC;--rule-faint:#E2EAF5;--margin:#E2463B;--hl:#FFE35A;
  --good:#157F54;--good-bg:#E1F4EA;--bad-bg:#FCE6E3;--line:#D3DDEA;--on-hl:#1A2B4C;--sky:#E8F0FB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10182A;--card:#18233A;--ink:#E7EDF8;--soft:#9AA8C2;--rule:#34507F;--rule-faint:#172339;--margin:#FF6B5E;--hl:#E9CB3B;--good:#46CB91;--good-bg:#143A2B;--bad-bg:#3D1F1F;--line:#2A3957;--on-hl:#1A2B4C;--sky:#1D2C48}}
:root[data-theme="dark"]{--paper:#10182A;--card:#18233A;--ink:#E7EDF8;--soft:#9AA8C2;--rule:#34507F;--rule-faint:#172339;--margin:#FF6B5E;--hl:#E9CB3B;--good:#46CB91;--good-bg:#143A2B;--bad-bg:#3D1F1F;--line:#2A3957;--on-hl:#1A2B4C;--sky:#1D2C48}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:'Readex Pro',system-ui,'Segoe UI',Tahoma,sans-serif;color:var(--ink);background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule-faint) 35px 36px);line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;bottom:0;right:26px;width:2px;background:var(--margin);opacity:.35;pointer-events:none;z-index:0}
@media (max-width:640px){body::before{right:8px}}
.en{direction:ltr;unicode-bidi:isolate}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:860px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:1.12rem;font-weight:700;white-space:nowrap}.brand small{display:block;color:var(--soft);font-size:.75rem;direction:ltr;text-align:right}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.85rem;font-weight:500;white-space:nowrap}
main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.hlpanel{border:2px solid var(--hl)}
h1{font-size:1.5rem;margin:0 0 4px;line-height:1.3}h2{font-size:1.25rem;margin:0 0 6px;line-height:1.35}h3{font-size:1.02rem;margin:18px 0 8px}
p{margin:0 0 10px}.muted{color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.center{text-align:center}
.topbar{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.back{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1.2rem}
.lv{display:inline-block;direction:ltr;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--sky);color:var(--ink);border:1px solid var(--rule);vertical-align:middle}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 18px;font-weight:500;font-size:.98rem}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.hl{background:var(--hl);color:var(--on-hl);border-color:var(--hl)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--margin)}
.btn.big{padding:14px 26px;font-size:1.15rem}
.btn:disabled{opacity:.45;cursor:default}
.say{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:.9rem}
.say.mini{padding:1px 8px;font-size:.8rem;margin-top:4px}
.play-big{width:92px;height:92px;border-radius:50%;border:none;background:var(--hl);color:var(--on-hl);font-size:2.2rem}
.guide{direction:ltr;text-align:center;margin:16px 0;padding:10px 8px 14px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.guide .w{font-size:clamp(40px,11vw,68px);font-weight:500;line-height:1.35;text-decoration:underline;text-decoration-color:var(--margin);text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-skip-ink:none;word-break:break-word}
.guide.s .w{font-size:clamp(22px,5.6vw,32px);line-height:1.8}
.ar-big{font-size:clamp(24px,6.5vw,36px);font-weight:600;text-align:center;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.act{display:flex;gap:12px;align-items:flex-start;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;width:100%}
.act .ic{font-size:1.6rem;line-height:1}.act b{display:block}.act span{color:var(--soft);font-size:.86rem}
.act.locked{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-top:10px}
.stats div b{display:block;font-size:1.45rem}.stats div span{color:var(--soft);font-size:.83rem}
.cat{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:none;border-bottom:1px solid var(--line);background:none;padding:13px 4px}
.cat .ic{font-size:1.45rem;min-width:1.6em;text-align:center}.cat .nm{flex:1;font-weight:500}
.meter{width:80px;height:8px;border-radius:99px;background:var(--rule-faint);overflow:hidden;flex:none}.meter i{display:block;height:100%;background:var(--good)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:none;background:var(--card);padding:7px 14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
input.answer,textarea.answer{width:100%;direction:ltr;text-align:left;font-size:1.25rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
textarea.answer{min-height:90px;font-size:1.08rem}
input.answer:focus,textarea.answer:focus{border-color:var(--ink);outline:none}
.fb{border-radius:10px;padding:12px 14px;margin-top:12px}.fb.good{background:var(--good-bg)}.fb.bad{background:var(--bad-bg)}
.fb .line{direction:ltr;text-align:left;font-size:1.12rem;line-height:1.9}
.fb h3{margin:12px 0 4px}
.ok{color:var(--good);font-weight:600}
.miss{color:var(--margin);font-weight:600;text-decoration:underline wavy;text-underline-offset:4px}
.mis{padding:6px 0;border-bottom:1px dashed var(--line)}
.tiles{direction:ltr;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.tile{min-width:46px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:1.2rem;font-weight:500}
.tile.used{opacity:.25;cursor:default}
.slots{direction:ltr;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px;padding:8px;border-bottom:2px solid var(--margin);margin:10px 0}
.slot{min-width:46px;padding:10px 14px;border-radius:10px;background:var(--hl);color:var(--on-hl);font-size:1.2rem;font-weight:500;border:none}
.slot.empty{background:transparent;border:1.5px dashed var(--line);cursor:default}
.opt{display:block;width:100%;text-align:start;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:1.05rem;margin-bottom:8px}
.opt.right{background:var(--good-bg);border-color:var(--good)}.opt.wrong{background:var(--bad-bg);border-color:var(--margin)}.opt:disabled{cursor:default}
.lesson-ex{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.lesson-ex .e{flex:1;min-width:0}.lesson-ex .e b{display:block;direction:ltr;text-align:left;font-weight:500}.lesson-ex .e span{color:var(--soft);font-size:.9rem}
.q{margin-top:14px}.q p{font-weight:500}
.q .opts{display:flex;flex-wrap:wrap;gap:8px;direction:ltr}.q .opts .opt{width:auto;display:inline-block;margin:0;padding:9px 16px}
.mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--margin);color:#fff;font-size:2.4rem}
.mic.sm{width:48px;height:48px;font-size:1.3rem}
.mic.on{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(226,70,59,.18)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;outline:4px solid var(--hl)}}
.progress{height:6px;background:var(--rule-faint);border-radius:99px;overflow:hidden;margin:6px 0 2px}.progress.big{height:12px}
.progress i{display:block;height:100%;background:var(--ink)}.progress.big i{background:var(--good)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grades .btn{padding:10px 4px}
@media (max-width:480px){.grades{grid-template-columns:repeat(2,1fr)}}
.steps{list-style:none;padding:0;margin:14px 0 0;position:relative}
.steps::before{content:"";position:absolute;right:15px;top:10px;bottom:10px;width:2px;background:var(--rule)}
.steps li button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:none;background:none;padding:10px 0;position:relative}
.steps .dot{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--rule);background:var(--card);display:grid;place-items:center;font-weight:700;color:#fff;z-index:1}
.steps li.done .dot{background:var(--good);border-color:var(--good)}
.steps .ic{font-size:1.2rem}.steps .nm{flex:1;font-weight:500}.steps .kind{font-size:.78rem;color:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.alpha{direction:ltr;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin:12px 0}
.alpha .tile{display:flex;flex-direction:column;align-items:center;padding:8px 4px}.alpha .tile b{font-size:1.5rem}.alpha .tile small{color:var(--soft);font-size:.72rem}
.alpha .vow{border-color:var(--margin)}
.pairbox{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px}
.pairbox .say{border:none}
.scroll{overflow-x:auto;margin-top:12px}
table.vt{border-collapse:collapse;width:100%;direction:ltr;font-size:.95rem;min-width:520px}
table.vt th,table.vt td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.vt th{font-weight:600;background:var(--sky);position:sticky;top:0}table.vt td.ar{direction:rtl;text-align:right;color:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.two label{font-size:.88rem;color:var(--soft)}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.story{margin-top:14px;font-size:1.15rem;line-height:2}
.story p.en{text-align:left;margin:0 0 6px}
.tw{cursor:pointer;border-radius:4px;padding:0 1px}.tw:hover{background:var(--hl);color:var(--on-hl)}
.trn{color:var(--soft);font-size:.95rem;margin:0 0 14px;border-right:3px solid var(--hl);padding-right:10px;direction:rtl;text-align:right}
.chat{display:flex;flex-direction:column;gap:4px;margin-top:14px}
.bub{max-width:86%;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:var(--paper)}
.bub small{display:block;color:var(--soft);font-size:.75rem}
.bub .en{text-align:left}
.bub.a{align-self:flex-end;border-bottom-left-radius:4px}
.bub.b{align-self:flex-start;background:var(--sky);border-bottom-right-radius:4px}
.bub.me{border-color:var(--ink)}
.bub.u{align-self:flex-start;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bub.now{outline:3px solid var(--hl)}
.bub.turn{border:2px dashed var(--margin);background:var(--card)}
.tchat{max-height:52vh;overflow-y:auto;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tchat .bub.a{background:var(--paper)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chipbtn{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.9rem}
.chipbtn[aria-pressed="true"]{background:var(--hl);color:var(--on-hl);border-color:var(--hl)}
.composer{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.composer textarea{flex:1;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font-size:1.02rem}
.composer .col{display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--paper)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set:last-child{border-bottom:none}
select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px}
.lvls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 14px}
.match{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.match .tile{font-size:1rem;min-height:56px}.match .tile.en{direction:ltr}
.tile.sel{background:var(--hl);color:var(--on-hl);border-color:var(--hl)}
.tile.bad{border-color:var(--margin);background:var(--bad-bg)}
.tile.hit{background:var(--good-bg);border-color:var(--good);opacity:1}
.kbd{direction:ltr;display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:14px 0}
.kbd .tile{min-width:0;padding:9px 0;font-size:1.05rem}
nav.bnav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bnav button{flex:1;max-width:140px;border:none;background:none;padding:8px 2px 9px;font-size:.78rem;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bnav button span{font-size:1.35rem;line-height:1.2}
nav.bnav button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.bnav button[aria-current="page"] span{background:var(--hl);border-radius:999px;padding:0 12px}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(10,20,40,.35);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheet-in{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center}
.aibox{border:1.5px dashed var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:6px;background:var(--paper)}
body.gated nav.bnav{display:none}body.gated main{padding-bottom:40px}
.plbars{display:grid;gap:8px;margin:16px auto;max-width:360px;text-align:start}.plbars div{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}.plbars .progress{margin:0}
.voicebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--rule);background:var(--paper)}.voicebar.on{border:2px solid var(--margin)}
.fld{display:block;text-align:start;margin:10px 0}.fld span{display:block;font-size:.88rem;color:var(--soft);margin-bottom:4px}
.fld input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:1rem}.fld input:focus{border-color:var(--ink);outline:none}
.authcard{max-width:440px;margin-left:auto;margin-right:auto}.btn.wide{width:100%;margin-top:8px}
.linkbtn{border:none;background:none;color:var(--ink);text-decoration:underline;font-weight:600;padding:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.cmp>div{border:1px solid var(--line);border-radius:12px;padding:12px}.cmp .pro{border:2px solid var(--hl)}.cmp h3{margin:0 0 6px}.cmp ul{margin:0;padding-inline-start:18px}
@media (max-width:520px){.cmp{grid-template-columns:1fr}}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.plan{border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:2px;align-items:center}
.plan[aria-pressed="true"]{border:2.5px solid var(--ink);background:var(--sky)}.plan .price{font-size:1.5rem;font-weight:700}.plan small{color:var(--soft)}
.paybox{border:1.5px dashed var(--rule);border-radius:12px;padding:10px 14px;background:var(--paper)}.paybox .spread{padding:6px 0;border-bottom:1px solid var(--line)}.paybox .spread:last-child{border-bottom:none}
a.btn{text-decoration:none;display:inline-block}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <div class="brand"><b>دفتري الإنجليزي</b><small>My English Notebook</small></div>
  <span class="chip" title="نقاط">⭐ <span id="xp">0</span></span>
  <span class="chip" title="أيام متتالية">🔥 <span id="streak">0</span></span>
  <span class="chip" title="هدف اليوم">🎯 <span id="goal">0%</span></span>
</div></header>
<main id="view"></main>
<nav class="bnav" id="bnav" aria-label="التنقل"></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

{id:"s3",lv:"A2",t:"The Lost Phone",ar:"الهاتف الضائع",
en:["Last week, Karim lost his phone at the university. He looked for it everywhere, but he couldn't find it.","He was very worried because all his photos and notes were on it. He asked his friends, and they helped him.","The next morning, a student called him from the library. She found the phone under a table. Karim was so happy that he bought her a coffee."],
tr:["الأسبوع الماضي أضاع كريم هاتفه في الجامعة. بحث عنه في كل مكان لكنه لم يجده.","كان قلقاً جداً لأن كل صوره وملاحظاته كانت عليه. سأل أصدقاءه فساعدوه.","في الصباح التالي اتصلت به طالبة من المكتبة. وجدت الهاتف تحت طاولة. كان كريم سعيداً جداً لدرجة أنه اشترى لها قهوة."],

{id:"s4",lv:"A2",t:"A Visit to the Lab",ar:"زيارة إلى المختبر",
en:["Sara felt tired for many days, so she went to the doctor. The doctor asked for a blood test.","In the morning, Sara went to the laboratory without breakfast. The technician was friendly. He took a small blood sample from her arm.","In the afternoon, the results were ready. Her iron was low. The doctor told her to eat more meat, beans, and green vegetables, and to take iron tablets."],
tr:["شعرت سارة بالتعب لأيام كثيرة، فذهبت إلى الطبيب. طلب الطبيب فحص دم.","في الصباح ذهبت سارة إلى المختبر بدون فطور. كان الفني لطيفاً. أخذ عينة دم صغيرة من ذراعها.","بعد الظهر كانت النتائج جاهزة. كان الحديد عندها منخفضاً. قال لها الطبيب أن تأكل لحماً وبقوليات وخضاراً خضراء أكثر، وأن تأخذ حبوب حديد."],
q:[["Why did Sara go to the doctor?",["she had a headache","she felt tired","she had a cough"],"she felt tired"],["Did she eat breakfast before the test?",["yes","no","we don't know"],"no"],["What was low?",["sugar","iron","water"],"iron"]]},
{id:"s5",lv:"A2",t:"The Rainy Day",ar:"اليوم الماطر",
en:["It was a cold winter day. Yousef was walking to school when it started to rain heavily.","He didn't have an umbrella, and his clothes got wet. An old man opened his door and said, \"Come in, son.\"","He gave Yousef a cup of hot tea and a towel. When the rain stopped, Yousef thanked him and continued to school. He never forgot that kind man."],
tr:["كان يوماً شتوياً بارداً. كان يوسف يمشي إلى المدرسة عندما بدأت تمطر بغزارة.","لم تكن معه مظلة، وتبللت ملابسه. فتح رجل عجوز بابه وقال: تفضل يا ابني.","أعطى يوسف كوب شاي ساخن ومنشفة. عندما توقف المطر شكره يوسف وأكمل طريقه إلى المدرسة. لم ينسَ أبداً ذلك الرجل الطيب."],
q:[["What season was it?",["summer","winter","spring"],"winter"],["What did the old man give him?",["food and money","tea and a towel","an umbrella"],"tea and a towel"],["What kind of man was he?",["kind","angry","young"],"kind"]]},
{id:"s6",lv:"B1",t:"Learning a New Language",ar:"تعلّم لغة جديدة",
en:["Many people believe that learning a language is only about memorizing words. However, research shows that regular practice is much more important.","If you listen to English for fifteen minutes every day, your brain slowly gets used to the sounds. Speaking, even with mistakes, builds confidence.","Experts suggest reviewing new words after one day, then after three days, then after a week. This method, called spaced repetition, helps you remember words for a long time."],
tr:["يعتقد كثير من الناس أن تعلم اللغة يعني فقط حفظ الكلمات. لكن الأبحاث تُظهر أن التدريب المنتظم أهم بكثير.","إذا استمعت للإنجليزية خمس عشرة دقيقة يومياً، يعتاد دماغك تدريجياً على الأصوات. والكلام، حتى مع الأخطاء، يبني الثقة.","ينصح الخبراء بمراجعة الكلمات الجديدة بعد يوم، ثم بعد ثلاثة أيام، ثم بعد أسبوع. هذه الطريقة، اسمها التكرار المتباعد، تساعدك على تذكر الكلمات لمدة طويلة."],
q:[["According to research, what is more important?",["memorizing words","regular practice","reading grammar books"],"regular practice"],["What does speaking build?",["confidence","vocabulary lists","money"],"confidence"],["What is the method called?",["fast reading","spaced repetition","word lists"],"spaced repetition"]]},
{id:"s7",lv:"B1",t:"The Olive Harvest",ar:"موسم قطف الزيتون",
en:["Every October, families in Palestine gather in the fields for the olive harvest. It is not just work; it is a tradition that has continued for hundreds of years.","Children, parents, and grandparents work together from early morning. They spread large sheets under the trees and shake the branches until the olives fall.","At lunchtime, everyone sits in the shade and eats bread with fresh oil and thyme. Although the work is hard, most people say it is the most beautiful time of the year."],
tr:["كل شهر أكتوبر تجتمع العائلات في فلسطين في الحقول لقطف الزيتون. إنه ليس مجرد عمل؛ بل تقليد استمر مئات السنين.","يعمل الأطفال والآباء والأجداد معاً منذ الصباح الباكر. يفرشون أغطية كبيرة تحت الأشجار ويهزّون الأغصان حتى يسقط الزيتون.","وقت الغداء يجلس الجميع في الظل ويأكلون الخبز مع الزيت الطازج والزعتر. بالرغم من أن العمل متعب، يقول أغلب الناس إنه أجمل وقت في السنة."],
q:[["When is the olive harvest?",["in May","in October","in January"],"in October"],["What do they put under the trees?",["boxes","large sheets","bags"],"large sheets"],["What do they eat at lunch?",["rice and chicken","bread with oil and thyme","fish"],"bread with oil and thyme"]]},
{id:"s8",lv:"B1",t:"An Unexpected Opportunity",ar:"فرصة غير متوقعة",
en:["Layla had always wanted to become a programmer, but she studied biology at university because her family expected her to.","After graduating, she taught herself coding online in the evenings. At first it was difficult, and she almost gave up several times.","One day, a small company was looking for someone who understood both science and software. Layla applied, and because of her unusual mix of skills, she got the job. She now builds apps for hospitals and laboratories."],
tr:["كانت ليلى دائماً تريد أن تصبح مبرمجة، لكنها درست الأحياء في الجامعة لأن عائلتها توقعت منها ذلك.","بعد التخرج علّمت نفسها البرمجة عبر الإنترنت في المساء. في البداية كان الأمر صعباً، وكادت تستسلم عدة مرات.","في يوم من الأيام، كانت شركة صغيرة تبحث عن شخص يفهم العلوم والبرمجيات معاً. تقدمت ليلى، وبسبب مزيج مهاراتها غير المألوف حصلت على الوظيفة. هي الآن تبني تطبيقات للمستشفيات والمختبرات."],

STORIES.push(
{id:"s9",lv:"B2",t:"The Power of Small Habits",ar:"قوة العادات الصغيرة",
en:["Most people overestimate what they can achieve in a week and underestimate what they can achieve in a year. The secret, according to many psychologists, lies in small habits.","Improving by just one percent every day might seem insignificant, yet over twelve months the effect is enormous. Someone who reads ten pages a day will have finished more than a dozen books by the end of the year.","The difficulty is that the results of good habits are delayed, while the rewards of bad habits are immediate. That is why successful people focus on the process rather than the goal: they design their environment so that the right choice becomes the easy choice."],
tr:["معظم الناس يبالغون في تقدير ما يمكنهم إنجازه في أسبوع ويستهينون بما يمكنهم إنجازه في سنة. السر، حسب كثير من علماء النفس، يكمن في العادات الصغيرة.","التحسّن بنسبة واحد بالمئة فقط كل يوم قد يبدو غير مهم، لكن خلال اثني عشر شهراً يكون الأثر هائلاً. من يقرأ عشر صفحات يومياً سيكون قد أنهى أكثر من اثني عشر كتاباً مع نهاية السنة.","الصعوبة أن نتائج العادات الجيدة متأخرة، بينما مكافآت العادات السيئة فورية. لهذا يركز الناجحون على العملية بدلاً من الهدف: يصممون بيئتهم بحيث يصبح الخيار الصحيح هو الخيار السهل."],

{id:"s10",lv:"B2",t:"A Lesson from the Night Shift",ar:"درس من المناوبة الليلية",

const NUM={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","12":"twelve"};
function norm(s){return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim().split(" ").map(w=>NUM[w]||w).join(" ")}
function lcs(a,b){const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const r=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){r[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}return r}
function compare(target,typed){const orig=target.split(/\s+/);const tn=orig.map(w=>norm(w));const bn=norm(typed).split(" ").filter(Boolean);

function speak(t,o={}){
  if(!("speechSynthesis" in window)){toast("المتصفح ما بدعم الصوت");return}

let PATHLV=null;
function pathItems(lv){
  const c=CATS.filter(x=>x.lv===lv).map(x=>({type:"cat",id:x.id,name:x.name,icon:x.icon,kind:"كلمات",done:x.w.every(w=>S.known[x.id+":"+w[0]])}));
  const l=LESSONS.filter(x=>x.lv===lv).map(x=>({type:"lesson",id:x.id,name:x.t,icon:"📐",kind:"قواعد",done:!!S.done["g:"+x.id]}));
  const d=DIALOGS.filter(x=>x.lv===lv).map(x=>({type:"dialog",id:x.id,name:x.t,icon:x.icon,kind:"محادثة",done:!!S.done["d:"+x.id]}));
  const s=STORIES.filter(x=>x.lv===lv).map(x=>({type:"story",id:x.id,name:x.t+" — "+x.ar,icon:"📜",kind:"قراءة",done:!!S.done["s:"+x.id]}));
  const out=[];const n=Math.max(c.length,l.length,d.length*2,s.length*2);
  for(let i=0;i<n;i++){if(c[i])out.push(c[i]);if(l[i])out.push(l[i]);if(i%2===1&&d[(i-1)/2])out.push(d[(i-1)/2]);if(i%2===1&&s[(i-1)/2])out.push(s[(i-1)/2])}
  return out}
function vPath(){
  const lv=PATHLV||userLv();const items=pathItems(lv);const dn=items.filter(x=>x.done).length;
  return `<section class="panel">${topbar("مسار التعلّم","امشِ بالترتيب: كلمات، قواعد، محادثات وقصص.")}
    <div class="spread">${seg("pathlv",lv,[["A1","A1"],["A2","A2"],["B1","B1"],["B2","B2"]])}<span class="muted">${dn} / ${items.length}</span></div>
    <div class="progress"><i style="width:${100*dn/items.length}%"></i></div>
    <ol class="steps">${items.map(it=>`<li class="${it.done?"done":""}"><button data-act="openpath" data-t="${it.type}" data-id="${it.id}"><span class="dot">${it.done?"✓":""}</span><span class="ic">${it.icon}</span><span class="nm">${esc(it.name)}</span><span class="kind">${it.kind}</span></button></li>`).join("")}</ol>
  </section>`}
function openPath(type,id){

async function rGen(){

{"title":"English title","title_ar":"Arabic title","paragraphs":["p1","p2","p3"],"translation":["Arabic of p1","Arabic of p2","Arabic of p3"],"questions":[{"q":"comprehension question in English","options":["a","b","c"],"answer":"must be exactly one of the options"}]}
Give exactly 3 questions.`;

  const sc=TUTOR.find(x=>x.id===TU.sc),msgs=tuMsgs();msgs.push({role:"user",content:text});KEEP.tuIn="";
  TU.busy=true;TU.err=null;render();aiCtl=new AbortController();
  const hist=msgs.slice(-16);const turns=[{role:"user",content:tuRules(sc)},...(hist[0].role==="user"?[{role:"assistant",content:sc.start}]:[]),...hist];
  const bot={role:"assistant",content:""};let added=false;
  try{const r=await AI(turns,{cache:false,signal:aiCtl.signal,modelTier:"quick",onText:({text})=>{bot.content=text;if(!added){msgs.push(bot);added=true;render()}else{const b=document.querySelectorAll("#chatBox .bub.a > div");const last=b[b.length-1];if(last)last.innerHTML=md(text);const c=$("#chatBox");if(c)c.scrollTop=c.scrollHeight}}});
    bot.content=r.text;if(!added)msgs.push(bot);S.st.chat++;addXP(3)}
  catch(e){if(e&&e.text){bot.content=e.text;if(!added)msgs.push(bot)}else if(added)msgs.pop();if(!e||e.code!=="cancelled")TU.err=aiErr(e)}
  TU.busy=false;render();if(TU.voice&&bot.content)voiceSpeak(bot.content)}
function enPart(c){return c.split("\n").filter(l=>!hasAr(l)&&!l.trim().startsWith("✏")).join(" ").replace(/\*\*/g,"").trim()}
function voiceSpeak(text){const en=enPart(text);if(!en){voiceListen();return}
  TU.speaking=true;render();speakSeq(en.split(/(?<=[.!?])\s+/).filter(Boolean).map(t=>({t})),()=>{TU.speaking=false;if(TU.voice&&route==="tutor")voiceListen();else render()})}
function voiceListen(){if(!TU.voice||TU.busy||recOn)return;TU.on=true;TU.err=null;render();
  listen(alts=>{TU.on=false;if(alts[0])tuSend(alts[0])},e=>{TU.err=e},()=>{TU.on=false;render()})}

/* ---------- AI عبر Edge Function ---------- */
async function callAI(system,messages,signal){
  const {data:{session}}=await sb.auth.getSession();if(!session)throw{code:"not_granted"};
  let r;try{r=await fetch(CFG.SUPABASE_URL+"/functions/v1/tutor",{method:"POST",signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token,apikey:CFG.SUPABASE_ANON_KEY},body:JSON.stringify({system,messages,max_tokens:1200})})}
  catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};throw{code:"upstream_error"}}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw{code:d.error==="rate_limited"?"rate_limited":d.error==="not_subscribed"?"not_granted":d.error==="ai_not_configured"?"ai_not_configured":"upstream_error"};
  return d.text||""}
const aiShim=async(input,opts={})=>{let system,messages;
  if(typeof input==="string")messages=[{role:"user",content:input}];else{system=input[0].content;messages=input.slice(1)}
  const text=await callAI(system,messages,opts.signal);if(!text)throw{code:"empty_completion"};opts.onText&&opts.onText({text,delta:text});return{text,truncated:false}};
aiShim.json=async(prompt,opts={})=>{const {text}=await aiShim(prompt+"\n\nReturn raw JSON only, with no code fences.",opts);
  const s=text.replace(/```json|```/g,"");const a=s.indexOf("{"),b=s.lastIndexOf("}");try{return JSON.parse(s.slice(a,b+1))}catch(e){throw{code:"invalid_json"}}};

  AUTH.user=session?session.user:null;
  if(AUTH.user){
    KEY="daftari-en-v2:"+AUTH.user.id;
    const {data,error}=await sb.from("profiles").select("*").eq("id",AUTH.user.id).single();
    if(error){AUTH.err="تعذّر تحميل الحساب، حدّث الصفحة.";}
    AUTH.profile=data||null;
    let local=null;try{local=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
    const server=data&&data.progress&&Object.keys(data.progress).length?data.progress:null;
    const src=server&&(!local||(server.xp||0)>=(local.xp||0))?server:local;
    S=Object.assign(JSON.parse(JSON.stringify(DEF)),src||{});S.st=Object.assign({},DEF.st,S.st);
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(src===local&&local)syncNow();
    refreshAI();
  }else{KEY="daftari-en-v2";S=JSON.parse(JSON.stringify(DEF));AUTH.profile=null;refreshAI()}
  SUB={plans:null,reqs:null,plan:null,method:null,busy:false,err:null,msg:null,loading:false};
  PL=null;Q=null;route="home";AUTH.ready=true;AUTH.busy=false;applyTheme();render();if(AUTH.user)checkAch()}
function authErr(e){const m=(e&&e.message)||"";
  if(/Invalid login/i.test(m))return "الإيميل أو كلمة السر غلط.";
  if(/not confirmed/i.test(m))return "لازم تأكد إيميلك أول. شيّك بريدك (وكمان مجلد Spam).";
  if(/already registered|already been registered/i.test(m))return "هاد الإيميل مسجّل من قبل، سجّل دخول.";
  if(/Password should|at least/i.test(m))return "كلمة السر لازم تكون 6 أحرف على الأقل.";
  if(/rate limit|too many/i.test(m))return "محاولات كثير، استنى شوي وجرّب.";
  if(/valid email|invalid email/i.test(m))return "الإيميل مش صحيح.";
  return "صار خطأ: "+m}

/* ---------- شاشة الدخول ---------- */
const fld=(id,label,type,ac)=>`<label class="fld"><span>${label}</span><input id="${id}" data-keep type="${type}" ${type!=="text"?'dir="ltr"':""} autocomplete="${ac||"off"}"></label>`;
function vAuth(){
  if(!AUTH.ready)return `<section class="panel center" style="margin-top:40px"><div style="font-size:2.4rem">📘</div><p class="muted">جاري التحميل…</p></section>`;
  const m=AUTH.mode,b=AUTH.busy?"disabled":"";let form;
  if(m==="check")form=`<h2>شيّك إيميلك 📧</h2><p>بعتنالك رابط تأكيد على <b class="en">${esc(AUTH.email)}</b>. افتحه، وبعدين ارجع سجّل دخول.</p><button class="btn" data-act="authmode" data-m="login">تسجيل الدخول</button>`;
  else if(m==="signup")form=`<h2>حساب جديد</h2>${fld("suName","الاسم الكامل","text","name")}${fld("suEmail","الإيميل","email","email")}${fld("suPass","كلمة السر (6 أحرف على الأقل)","password","new-password")}
    <button class="btn hl big wide" data-act="dosignup" ${b}>${AUTH.busy?"لحظة…":"إنشاء الحساب"}</button><p class="center" style="margin-top:12px">عندك حساب؟ <button class="linkbtn" data-act="authmode" data-m="login">سجّل دخول</button></p>`;
  else if(m==="forgot")form=`<h2>نسيت كلمة السر</h2><p class="muted">اكتب إيميلك وبنبعتلك رابط تغيير كلمة السر.</p>${fld("fgEmail","الإيميل","email","email")}
    <button class="btn wide" data-act="doforgot" ${b}>ابعت الرابط</button><p class="center" style="margin-top:12px"><button class="linkbtn" data-act="authmode" data-m="login">رجوع لتسجيل الدخول</button></p>`;
  else form=`<h2>تسجيل الدخول</h2>${fld("liEmail","الإيميل","email","email")}${fld("liPass","كلمة السر","password","current-password")}
    <button class="btn hl big wide" data-act="dologin" ${b}>${AUTH.busy?"لحظة…":"دخول"}</button>
    <p class="center" style="margin-top:12px"><button class="linkbtn" data-act="authmode" data-m="forgot">نسيت كلمة السر؟</button></p>
    <p class="center">ما عندك حساب؟ <button class="linkbtn" data-act="authmode" data-m="signup">أنشئ حساب مجاني</button></p>`;
  return `<section class="panel center"><div style="font-size:2.6rem">📘</div><h1>${esc(CFG.APP_NAME)}</h1>
    <p class="muted">تعلّم الإنجليزي من الصفر للاحتراف: اختبار يحدد مستواك، مسار شخصي، كلمات بصوت، قواعد، محادثات، ومعلم ذكي بيصحّحلك.</p></section>
    <section class="panel authcard">${AUTH.err?`<div class="fb bad" style="margin:0 0 12px">${esc(AUTH.err)}</div>`:""}${AUTH.msg?`<div class="fb good" style="margin:0 0 12px">${esc(AUTH.msg)}</div>`:""}${form}</section>`}
function vNewPass(){return `<section class="panel authcard"><h2>كلمة سر جديدة</h2>${AUTH.err?`<div class="fb bad">${esc(AUTH.err)}</div>`:""}${fld("npPass","كلمة السر الجديدة","password","new-password")}<button class="btn hl wide" data-act="donewpass">احفظ</button></section>`}
const val=id=>(($("#"+id)||{}).value||"").trim();

/* ---------- الاشتراك ---------- */
async function loadSub(){if(!AUTH.user)return;SUB.loading=true;
  const [p,r]=await Promise.all([sb.from("plans").select("*").eq("active",true).order("sort"),sb.from("payment_requests").select("*, plans(name)").eq("user_id",AUTH.user.id).order("created_at",{ascending:false}).limit(10)]);
  SUB.plans=p.data||[];SUB.reqs=r.data||[];if(!SUB.plan&&SUB.plans[0])SUB.plan=SUB.plans[0].id;if(!SUB.method)SUB.method=CFG.PAYMENT_METHODS[0].id;
  await refreshProfile();refreshAI();SUB.loading=false;if(route==="subscribe")render()}
const STAT={pending:["⏳","قيد المراجعة"],approved:["✅","مفعّل"],rejected:["❌","مرفوض"]};
function vSubscribe(){
  if(SUB.plans===null&&!SUB.loading)loadSub();
  const prem=isPremium(),p=AUTH.profile||{},plan=(SUB.plans||[]).find(x=>x.id===SUB.plan),meth=CFG.PAYMENT_METHODS.find(x=>x.id===SUB.method);
  const pending=(SUB.reqs||[]).find(r=>r.status==="pending");
  const wa=`https://wa.me/${CFG.WHATSAPP}?text=${encodeURIComponent(`مرحبا، حوّلت اشتراك ${plan?plan.name:""} على ${CFG.APP_NAME}. إيميلي: ${AUTH.user.email}`)}`;
  return `<section class="panel">${topbar("الاشتراك","افتح كل المستويات والمعلم الذكي")}
    <div class="fb ${prem?"good":""}" style="${prem?"":"background:var(--sky)"}">${prem?(p.role==="admin"?"👑 حساب أدمن — كل الميزات مفتوحة.":`⭐ اشتراكك فعّال لحد <b>${fmtDate(p.plan_until)}</b> (باقي ${daysLeft()} يوم). بتقدر تجدّد من هون وبينضاف على المدة الحالية.`):"إنت على الخطة المجانية."}</div>
    <div class="cmp"><div><h3>مجاني</h3><ul><li>اختبار تحديد المستوى</li><li>كل محتوى مستوى A1</li><li>التمارين على كلمات A1</li></ul></div>
      <div class="pro"><h3>⭐ مشترك</h3><ul><li>كل المستويات <span class="en">A1 → B2</span></li><li>المعلم الذكي: محادثة وتصحيح فوري</li><li>تصحيح الكتابة الحرة</li><li>قصص ذكية بلا حدود</li><li>حفظ تقدّمك على أي جهاز</li></ul></div></div>
  </section>
  <section class="panel"><h2>1. اختار الخطة</h2>
    ${SUB.plans===null?`<p class="muted">جاري التحميل…</p>`:`<div class="plans">${SUB.plans.map(x=>`<button class="plan" data-act="subplan" data-id="${x.id}" aria-pressed="${x.id===SUB.plan}"><b>${esc(x.name)}</b><span class="price">${+x.price} ${CFG.CURRENCY}</span><small>${x.months>1?`≈ ${Math.round(x.price/x.months)} ${CFG.CURRENCY} بالشهر`:"شهر واحد"}</small></button>`).join("")}</div>`}
  </section>
  <section class="panel"><h2>2. حوّل المبلغ${plan?` (${+plan.price} ${CFG.CURRENCY})`:""}</h2>
    <div class="row" style="margin-bottom:10px">${CFG.PAYMENT_METHODS.map(x=>`<button class="chipbtn" data-act="submeth" data-id="${x.id}" aria-pressed="${x.id===SUB.method}">${x.icon} ${esc(x.name)}</button>`).join("")}</div>
    ${meth?`<div class="paybox">${meth.details.map(l=>`<div class="spread"><span>${esc(l)}</span><button class="say" data-act="copy" data-t="${esc(l.split(":").slice(1).join(":").trim()||l)}">نسخ</button></div>`).join("")}</div>`:""}
  </section>
  <section class="panel"><h2>3. أرسل تأكيد التحويل</h2>
    ${pending?`<div class="fb" style="background:var(--sky)">⏳ عندك طلب قيد المراجعة. التفعيل بيتم ${esc(CFG.ACTIVATION_TIME)}.</div>`:""}
    <label class="fld"><span>رقم الحوالة / المرجع</span><input id="subRef" data-keep dir="ltr" autocomplete="off"></label>
    <label class="fld"><span>صورة الإيصال (اختياري، لحد 5 ميغا)</span><input id="subFile" type="file" accept="image/*,application/pdf"></label>
    ${SUB.err?`<div class="fb bad">${esc(SUB.err)}</div>`:""}${SUB.msg?`<div class="fb good">${esc(SUB.msg)}</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn hl" data-act="subsend" ${SUB.busy?"disabled":""}>${SUB.busy?"عم يرسل…":"أرسل طلب التفعيل"}</button>
      <a class="btn ghost" href="${wa}" target="_blank" rel="noopener">💬 واتساب</a></div>
    <p class="muted" style="margin-top:8px">بعد ما نتأكد من التحويل بنفعّل حسابك ${esc(CFG.ACTIVATION_TIME)}، وبتفتحلك كل الميزات تلقائياً.</p>
  </section>
  ${SUB.reqs&&SUB.reqs.length?`<section class="panel"><div class="spread"><h2>طلباتي</h2><button class="say" data-act="subreload">🔄 تحديث</button></div>
    ${SUB.reqs.map(r=>`<div class="lesson-ex"><div class="e"><span style="color:var(--ink)">${STAT[r.status][0]} ${STAT[r.status][1]} — ${esc(r.plans?r.plans.name:r.plan_id)} · ${+r.amount} ${CFG.CURRENCY}</span><span>${fmtDate(r.created_at)}${r.admin_note?" — "+esc(r.admin_note):""}</span></div></div>`).join("")}</section>`:""}`}
async function subSend(){
  const ref=val("subRef"),fi=$("#subFile"),f=fi&&fi.files&&fi.files[0];SUB.err=null;SUB.msg=null;
  if(!SUB.plan||!SUB.method){SUB.err="اختار الخطة وطريقة الدفع.";render();return}
  if(!ref&&!f){SUB.err="اكتب رقم الحوالة أو ارفع صورة الإيصال.";render();return}
  if(f&&f.size>5e6){SUB.err="حجم الصورة أكبر من 5 ميغا.";render();return}
  SUB.busy=true;render();
  try{let path=null;
    if(f){const ext=((f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,""))||"jpg";path=`${AUTH.user.id}/${Date.now()}.${ext}`;
      const {error}=await sb.storage.from("proofs").upload(path,f,{contentType:f.type||undefined});if(error)throw error}
    const {error}=await sb.from("payment_requests").insert({user_id:AUTH.user.id,plan_id:SUB.plan,method:SUB.method,reference:ref,proof_path:path});
    if(error)throw error;
    KEEP.subRef="";SUB.msg="وصلنا طلبك ✅ رح نفعّل حسابك "+CFG.ACTIVATION_TIME+".";SUB.plans=null;await loadSub()}
  catch(e){SUB.err=/too_many_pending/.test(e.message||"")?"عندك 3 طلبات معلّقة، استنى لحد ما نراجعها.":"ما قدرنا نرسل الطلب: "+(e.message||"")}
  SUB.busy=false;render()}

/* ---------- لوحات إضافية ---------- */
function vAccountPanel(){const p=AUTH.profile||{},prem=isPremium();
  return `<section class="panel"><div class="spread"><div><h2 style="margin:0">${esc(p.full_name||"حسابي")}</h2><p class="muted en" style="text-align:right;margin:0">${esc(AUTH.user.email)}</p></div><span class="chip">${p.role==="admin"?"👑 أدمن":prem?"⭐ مشترك":"مجاني"}</span></div>
    <p style="margin-top:10px">${prem&&p.plan_until?`اشتراكك فعّال لحد <b>${fmtDate(p.plan_until)}</b>.`:prem?"":"إنت على الخطة المجانية (محتوى A1)."}</p>
    <div class="row"><button class="btn ${prem?"ghost":"hl"}" data-act="go" data-r="subscribe">${prem?"تفاصيل الاشتراك":"⭐ اشترك الآن"}</button>${p.role==="admin"?`<a class="btn ghost" href="admin.html">لوحة التحكم</a>`:""}<button class="btn ghost danger" data-act="logout">تسجيل خروج</button></div></section>`}
function vPremiumBanner(){if(!AUTH.user)return "";const p=AUTH.profile||{};
  if(!isPremium())return `<section class="panel hlpanel"><div class="spread"><div><b>⭐ افتح كل المحتوى</b><p class="muted" style="margin:0">كل المستويات لحد B2، المعلم الذكي، وتصحيح الكتابة.</p></div><button class="btn hl" data-act="go" data-r="subscribe">اشترك</button></div></section>`;
  if(p.role!=="admin"&&daysLeft()<=5)return `<section class="panel hlpanel"><div class="spread"><b>⏰ اشتراكك بيخلص بعد ${daysLeft()} يوم</b><button class="btn hl" data-act="go" data-r="subscribe">جدّد</button></div></section>`;return ""}

/* ---------- قفل المحتوى المدفوع ---------- */
function itemLv(act,d){
  if(act==="wcat")return (CATS.find(c=>c.id===d.id)||{}).lv;
  if(act==="gopen")return (LESSONS.find(x=>x.id===d.id)||{}).lv;
  if(act==="dopen")return (DIALOGS.find(x=>x.id===d.id)||{}).lv;
  if(act==="ropen"){const s=STORIES.find(x=>x.id===d.id);return s?s.lv:"PRO"}
  if(act==="openpath")return itemLv({cat:"wcat",lesson:"gopen",dialog:"dopen",story:"ropen"}[d.t],d);
  return null}
function gateCheck(act,d){if(!AUTH.user||isPremium())return false;const lv=itemLv(act,d);
  if(lv&&lv!=="A1"){go("subscribe");toast("🔒 هاد المحتوى للمشتركين");return true}return false}

/* ---------- الأفعال ---------- */
Object.assign(A,{
  authmode:d=>{AUTH.mode=d.m;AUTH.err=null;AUTH.msg=null;render()},
  dologin:async()=>{const e=val("liEmail"),p=($("#liPass")||{}).value||"";if(!e||!p){AUTH.err="عبّي الإيميل وكلمة السر.";render();return}
    AUTH.busy=true;AUTH.err=null;render();const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){AUTH.busy=false;AUTH.err=authErr(error);render()}},
  dosignup:async()=>{const n=val("suName"),ph="",e=val("suEmail"),p=($("#suPass")||{}).value||"";
    if(!n||!e||!p){AUTH.err="عبّي الاسم والإيميل وكلمة السر.";render();return}if(p.length<6){AUTH.err="كلمة السر لازم تكون 6 أحرف على الأقل.";render();return}
    AUTH.busy=true;AUTH.err=null;render();
    const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n,phone:ph},emailRedirectTo:location.href.split("#")[0]}});
    AUTH.busy=false;if(error){AUTH.err=authErr(error);render();return}
    if(!data.session){AUTH.email=e;AUTH.mode="check";render()}},
  doforgot:async()=>{const e=val("fgEmail");if(!e){AUTH.err="اكتب إيميلك.";render();return}
    AUTH.busy=true;render();const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split("#")[0]});AUTH.busy=false;
    if(error)AUTH.err=authErr(error);else{AUTH.msg="بعتنالك رابط على الإيميل.";AUTH.mode="login"}render()},
  donewpass:async()=>{const p=($("#npPass")||{}).value||"";if(p.length<6){AUTH.err="كلمة السر لازم تكون 6 أحرف على الأقل.";render();return}
    const {error}=await sb.auth.updateUser({password:p});if(error){AUTH.err=authErr(error);render();return}AUTH.recovery=false;AUTH.err=null;toast("تم تغيير كلمة السر ✅");render()},
  logout:async()=>{if(!confirm("تسجيل خروج؟"))return;await syncNow();await sb.auth.signOut()},
  subplan:d=>{SUB.plan=d.id;render()},
  submeth:d=>{SUB.method=d.id;render()},
  subsend:subSend,
  subreload:()=>{SUB.plans=null;render()},
  copy:d=>{try{navigator.clipboard.writeText(d.t);toast("انتسخ ✅")}catch(e){toast(d.t)}}
});

/* ---------- التشغيل ---------- */
applyTheme();render();
sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==="PASSWORD_RECOVERY"){AUTH.recovery=true}
  const uid=session&&session.user?session.user.id:null;
  if(ev==="INITIAL_SESSION"||uid!==AUTH.uid){AUTH.uid=uid;setTimeout(()=>onSession(session),0)}
  else if(ev==="PASSWORD_RECOVERY")setTimeout(render,0);
});

</script>
</body>
</html>
