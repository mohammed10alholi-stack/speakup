<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SpeakUp">
<title>SpeakUp — تعلّم الإنجليزي من الصفر للاحتراف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#FFFFFF;--card:#FFFFFF;--ink:#1F2433;--ink-2:#3A4257;--soft:#6B7389;--line:#E7EBF2;--sky:#F3F6FB;--rule:#DCE2EC;--rule-faint:#EEF2F7;
  --primary:#2F6BFF;--primary-d:#1D4FD6;--primary-soft:#E8F0FF;--on-primary:#FFFFFF;
  --hl:#FFC940;--hl-d:#E3A600;--gold-soft:#FFF5D6;--on-hl:#3A2A00;
  --good:#1DB36B;--good-d:#13904F;--good-bg:#E6F8EE;--margin:#FF5A5F;--margin-d:#D93D43;--bad-bg:#FFEDEE;
  --purple:#8B5CF6;--orange:#FF8A1F;--pink:#FF6B9A;
  --font:"Baloo Bhaijaan 2","Baloo 2",system-ui,"Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1420;--card:#161D2C;--ink:#EEF2FF;--ink-2:#D5DCF0;--soft:#9AA6C4;--line:#253049;--sky:#1B2437;--rule:#2C3854;--rule-faint:#1A2233;
  --primary:#4C82FF;--primary-d:#2F5FD6;--primary-soft:#1D2A4A;--gold-soft:#3A3014;--good-bg:#133426;--bad-bg:#3A1C22}}
:root[data-theme="dark"]{--paper:#0F1420;--card:#161D2C;--ink:#EEF2FF;--ink-2:#D5DCF0;--soft:#9AA6C4;--line:#253049;--sky:#1B2437;--rule:#2C3854;--rule-faint:#1A2233;
  --primary:#4C82FF;--primary-d:#2F5FD6;--primary-soft:#1D2A4A;--gold-soft:#3A3014;--good-bg:#133426;--bad-bg:#3A1C22}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;font-family:var(--font);font-weight:500;font-size:16.5px;color:var(--ink);background:var(--paper);line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.en{direction:ltr;unicode-bidi:isolate}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.toki{display:inline-block;flex:none;vertical-align:middle}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.brand .logo{display:flex}
.brand b{display:block;font-weight:800;font-size:1.45rem;letter-spacing:-.01em;line-height:1;color:var(--primary)}
.brand small{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:.9rem;font-weight:800;white-space:nowrap;background:var(--sky)}
.c-xp{color:#C98A00}.c-streak{color:var(--orange)}.c-goal{color:var(--good)}
.icon-btn{border:none;background:var(--sky);border-radius:12px;width:36px;height:36px}

/* layout */
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;margin-bottom:18px}
.hlpanel{border-color:var(--hl);background:var(--gold-soft)}
h1{font-size:1.7rem;font-weight:800;margin:0 0 4px;line-height:1.25}
h2{font-size:1.3rem;font-weight:800;margin:0 0 6px;line-height:1.3}
h3{font-size:1.05rem;font-weight:800;margin:20px 0 8px}
p{margin:0 0 10px}.muted{color:var(--soft);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.center{text-align:center}
.topbar{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.back{flex:none;width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.15rem;color:var(--soft);box-shadow:0 3px 0 var(--line)}
.lv{display:inline-block;direction:ltr;font-size:.8rem;font-weight:800;padding:0 9px;border-radius:9px;color:#fff;background:var(--primary);vertical-align:middle;line-height:1.7}
.lv-A1{background:var(--good)}.lv-A2{background:var(--primary)}.lv-B1{background:var(--purple)}.lv-B2{background:var(--orange)}

/* chunky 3D buttons */
.btn{border:none;background:var(--primary);color:var(--on-primary);border-radius:16px;padding:12px 22px;font-weight:800;font-size:1rem;letter-spacing:.01em;box-shadow:0 4px 0 var(--primary-d);transition:transform .08s,box-shadow .08s;position:relative;top:0}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--primary-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:inset 0 0 0 2px var(--line),0 0 0 var(--line)}
.btn.hl{background:var(--hl);color:var(--on-hl);box-shadow:0 4px 0 var(--hl-d)}
.btn.good{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-d)}
.btn.danger{color:var(--margin)}
.btn.big{padding:15px 30px;font-size:1.1rem;border-radius:18px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
a.btn{text-decoration:none;display:inline-block}
.say{border:none;background:var(--primary-soft);border-radius:12px;padding:5px 12px;font-size:.9rem;font-weight:800;color:var(--primary)}
.say.mini{padding:1px 8px;font-size:.8rem;margin-top:4px}
.linkbtn{border:none;background:none;color:var(--primary);font-weight:800;padding:0;text-decoration:none}
.play-big{width:96px;height:96px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:2.2rem;box-shadow:0 6px 0 var(--primary-d)}
.play-big:active{transform:translateY(6px);box-shadow:none}

/* the word */
.guide{direction:ltr;text-align:center;margin:18px 0 8px;padding:4px 8px}
.guide .w{font-weight:800;font-size:clamp(44px,12vw,78px);line-height:1.15;letter-spacing:-.015em;color:var(--ink);word-break:break-word;display:inline-block;padding-bottom:12px;
  background:linear-gradient(var(--hl),var(--hl)) center bottom/56px 7px no-repeat;border-radius:4px}
.guide.s .w{font-size:clamp(24px,6vw,34px);line-height:1.45;background-size:40px 5px}
.ar-big{font-size:clamp(24px,6.5vw,34px);font-weight:800;text-align:center;margin:14px 0;color:var(--primary)}

/* home greeting with Toki */
.greet{display:flex;align-items:flex-end;gap:10px;margin:0 0 18px}
.greet .toki{animation:float 3.2s ease-in-out infinite}
.greet .bubble{position:relative;flex:1;background:var(--primary-soft);border-radius:22px;border-bottom-right-radius:6px;padding:14px 16px}
.greet .bubble b{display:block;font-size:1.15rem;font-weight:800}
.greet .bubble span{display:block;color:var(--ink-2)}
.greet .bubble .btn{margin-top:10px}
@keyframes float{50%{transform:translateY(-6px)}}

/* tiles & lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.act{display:flex;gap:14px;align-items:center;text-align:start;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:14px;width:100%;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s;color:var(--ink)}
.act:active{transform:translateY(4px);box-shadow:none}
.act .ic{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;line-height:1;background:#E8F0FF}
.act b{display:block;font-weight:800}.act span{color:var(--soft);font-size:.88rem;font-weight:500}
.grid>.act:nth-child(6n+2) .ic{background:#FFF3CC}.grid>.act:nth-child(6n+3) .ic{background:#E1F7EA}.grid>.act:nth-child(6n+4) .ic{background:#FFE6EF}.grid>.act:nth-child(6n+5) .ic{background:#EFE8FF}.grid>.act:nth-child(6n+6) .ic{background:#FFEBDD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .act .ic,:root:not([data-theme="light"]) .cat .ic,:root:not([data-theme="light"]) .feats .ic{background:var(--sky)!important}}
:root[data-theme="dark"] .act .ic,:root[data-theme="dark"] .cat .ic,:root[data-theme="dark"] .feats .ic{background:var(--sky)!important}
.act.locked{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.stats div{border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.stats div b{display:block;font-size:1.6rem;font-weight:800;line-height:1.2;color:var(--primary)}.stats div span{color:var(--soft);font-size:.82rem}
.cat{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:none;border-bottom:2px solid var(--line);background:none;padding:12px 2px;color:var(--ink)}
.cat .ic{flex:none;width:46px;height:46px;border-radius:15px;background:#E8F0FF;display:grid;place-items:center;font-size:1.3rem}
.cat:nth-of-type(6n+2) .ic{background:#FFF3CC}.cat:nth-of-type(6n+3) .ic{background:#E1F7EA}.cat:nth-of-type(6n+4) .ic{background:#FFE6EF}.cat:nth-of-type(6n+5) .ic{background:#EFE8FF}.cat:nth-of-type(6n+6) .ic{background:#FFEBDD}
.cat .nm{flex:1;font-weight:700}
.meter{width:80px;height:10px;border-radius:99px;background:var(--rule-faint);overflow:hidden;flex:none}.meter i{display:block;height:100%;background:var(--good);border-radius:99px}
.seg{display:inline-flex;background:var(--sky);border-radius:16px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 15px;border-radius:12px;color:var(--soft);font-weight:800}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--primary);box-shadow:0 2px 0 var(--line)}
input.answer,textarea.answer{width:100%;direction:ltr;text-align:left;font-size:1.2rem;padding:13px 16px;border:2px solid var(--line);border-radius:16px;background:var(--sky);font-weight:600}
textarea.answer{min-height:96px;font-size:1.05rem}
input.answer:focus,textarea.answer:focus{border-color:var(--primary);background:var(--card);outline:none}
.fb{border-radius:18px;padding:13px 16px;margin-top:12px;border:2px solid transparent}.fb.good{background:var(--good-bg);border-color:#BEEBD2}.fb.bad{background:var(--bad-bg);border-color:#FFCACC}
.fb .line{direction:ltr;text-align:left;font-size:1.12rem;line-height:1.9}.fb h3{margin:12px 0 4px}
.ok{color:var(--good);font-weight:800}
.miss{color:var(--margin);font-weight:800;text-decoration:underline wavy;text-underline-offset:4px}
.mis{padding:7px 0;border-bottom:2px solid var(--line)}
.tiles{direction:ltr;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.tile{min-width:48px;padding:9px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-size:1.2rem;font-weight:800;color:var(--ink);box-shadow:0 4px 0 var(--line);transition:transform .08s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile.used{opacity:.25;cursor:default;box-shadow:none;transform:translateY(4px)}
.slots{direction:ltr;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:62px;padding:10px;border-bottom:2px solid var(--line);margin:10px 0}
.slot{min-width:48px;padding:9px 14px;border-radius:14px;background:var(--primary-soft);color:var(--primary);font-size:1.2rem;font-weight:800;border:2px solid #C7D8FF}
.slot.empty{background:transparent;border:2px dashed var(--rule);cursor:default}
.opt{display:block;width:100%;text-align:start;padding:14px 16px;border:2px solid var(--line);border-radius:18px;background:var(--card);font-size:1.05rem;font-weight:700;margin-bottom:10px;color:var(--ink);box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good-d);box-shadow:0 4px 0 var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--margin);color:var(--margin-d);box-shadow:0 4px 0 var(--margin)}.opt:disabled{cursor:default}
.lesson-ex{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:2px solid var(--line)}
.lesson-ex .e{flex:1;min-width:0}.lesson-ex .e b{display:block;direction:ltr;text-align:left;font-weight:800}.lesson-ex .e span{color:var(--soft);font-size:.9rem}
.q{margin-top:16px}.q p{font-weight:700}
.q .opts{display:flex;flex-wrap:wrap;gap:8px;direction:ltr}.q .opts .opt{width:auto;display:inline-block;margin:0;padding:8px 18px}
.mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--margin);color:#fff;font-size:2.3rem;box-shadow:0 6px 0 var(--margin-d)}
.mic.sm{width:50px;height:50px;font-size:1.25rem;box-shadow:0 4px 0 var(--margin-d)}
.mic.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--margin-d),0 0 0 16px rgba(255,90,95,.18)}}
.progress{height:14px;background:var(--rule-faint);border-radius:99px;overflow:hidden;margin:8px 0 2px}.progress.big{height:18px}
.progress i{display:block;height:100%;border-radius:99px;background:var(--good);background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35));background-size:calc(100% - 16px) 4px;background-repeat:no-repeat;background-position:8px 3px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grades .btn{padding:11px 4px}
@media (max-width:480px){.grades{grid-template-columns:repeat(2,1fr)}}
.steps{list-style:none;padding:0;margin:16px 0 0;position:relative}
.steps::before{content:"";position:absolute;right:19px;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--rule-faint)}
.steps li button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:none;background:none;padding:9px 0;position:relative;color:var(--ink)}
.steps .dot{flex:none;width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:800;color:#fff;z-index:1;box-shadow:0 3px 0 var(--line)}
.steps li.done .dot{background:var(--hl);border-color:var(--hl);box-shadow:0 3px 0 var(--hl-d);color:var(--on-hl)}
.steps .ic{font-size:1.25rem}.steps .nm{flex:1;font-weight:700}.steps .kind{font-size:.76rem;color:var(--soft);background:var(--sky);border-radius:9px;padding:0 9px;font-weight:700}
.alpha{direction:ltr;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin:14px 0}
.alpha .tile{display:flex;flex-direction:column;align-items:center;padding:8px 4px}.alpha .tile b{font-size:1.6rem;font-weight:800}.alpha .tile small{color:var(--soft);font-size:.74rem}
.alpha .vow{border-color:var(--hl);box-shadow:0 4px 0 var(--hl-d);background:var(--gold-soft)}
.pairbox{display:inline-flex;gap:4px;align-items:center;background:var(--sky);border-radius:14px;padding:3px}
.scroll{overflow-x:auto;margin-top:12px}
table.vt{border-collapse:collapse;width:100%;direction:ltr;font-size:.95rem;min-width:520px}
table.vt th,table.vt td{padding:9px 10px;border-bottom:2px solid var(--line);text-align:left}
table.vt th{font-weight:800;background:var(--sky);position:sticky;top:0}table.vt td.ar{direction:rtl;text-align:right;color:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.two label{font-size:.88rem;color:var(--soft)}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.story{margin-top:16px;font-size:1.15rem;line-height:1.95;font-weight:600}
.story p.en{text-align:left;margin:0 0 6px}
.tw{cursor:pointer;border-radius:6px;padding:0 1px}.tw:hover{background:var(--gold-soft)}
.trn{color:var(--soft);font-size:.95rem;font-weight:500;margin:0 0 16px;border-right:4px solid var(--hl);padding-right:12px;direction:rtl;text-align:right;line-height:1.7}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.bub{max-width:86%;padding:10px 14px;border-radius:20px;border:2px solid var(--line);background:var(--card)}
.bub small{display:block;color:var(--soft);font-size:.76rem;font-weight:700}
.bub .en{text-align:left;font-weight:600}
.bub.a{align-self:flex-end;background:var(--sky);border-color:transparent;border-bottom-left-radius:6px}
.bub.b{align-self:flex-start;border-bottom-right-radius:6px}
.bub.me{border-color:var(--primary)}
.bub.u{align-self:flex-start;background:var(--primary);color:#fff;border-color:transparent;border-bottom-right-radius:6px}
.bub.now{border-color:var(--hl);box-shadow:0 0 0 3px var(--gold-soft)}
.bub.turn{border:2px dashed var(--primary);background:var(--primary-soft)}
.tchat .bub.a{display:flex;gap:8px;align-items:flex-start;background:var(--sky)}
.tchat .bub.a .av{flex:none;margin-top:2px}.tchat .bub.a>div{flex:1;min-width:0}
.typing{display:flex;gap:4px;padding:8px 2px}.typing i{width:8px;height:8px;border-radius:50%;background:var(--soft);animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-4px);opacity:.5}}
.tutor-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}.tutor-head h1{font-size:1.4rem}.tutor-head p{margin:0}
.tchat{max-height:52vh;overflow-y:auto;padding:10px;border:2px solid var(--line);border-radius:22px;background:var(--paper)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chipbtn{flex:none;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 13px;font-size:.9rem;font-weight:800;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.chipbtn[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);box-shadow:0 3px 0 var(--primary)}
.composer{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.composer textarea{flex:1;resize:vertical;border:2px solid var(--line);border-radius:18px;padding:11px 14px;background:var(--sky);font-size:1rem;font-weight:600}
.composer textarea:focus{border-color:var(--primary);background:var(--card);outline:none}
.composer .col{display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.voicebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;padding:10px 14px;border-radius:18px;background:var(--primary-soft)}
.voicebar.on{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--hl)}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{border:2px solid var(--hl);border-radius:14px;padding:4px 12px;background:var(--gold-soft);font:inherit;font-weight:800;color:var(--ink)}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0;border-bottom:2px solid var(--line)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line);flex-wrap:wrap}.set:last-child{border-bottom:none}
select{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-weight:700}
input[type=range]{accent-color:var(--primary)}
.lvls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 16px}.lvls div{border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700}
.match{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.match .tile{font-size:1rem;min-height:58px}.match .tile.en{direction:ltr}
.tile.sel{background:var(--primary-soft);border-color:var(--primary);box-shadow:0 4px 0 var(--primary)}
.tile.bad{border-color:var(--margin);background:var(--bad-bg);box-shadow:0 4px 0 var(--margin)}
.tile.hit{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good);opacity:1}
.kbd{direction:ltr;display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:14px 0}
.kbd .tile{min-width:0;padding:8px 0;font-size:1.05rem}

/* bottom navigation — floating bar with Toki in the middle */
nav.bnav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;max-width:520px;margin:0 auto;height:70px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;
  background:var(--card);border:2px solid var(--line);border-radius:26px;box-shadow:0 5px 0 var(--line),0 18px 36px -18px rgba(31,36,51,.35)}
nav.bnav .nb{flex:1;height:100%;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#A3ABBE;padding:0}
nav.bnav .nb em{font-style:normal;font-size:.72rem;font-weight:800;line-height:1}
nav.bnav .nb .ico{display:grid;place-items:center;width:46px;height:34px;border-radius:12px;transition:background .15s,transform .15s}
nav.bnav .nb[aria-current="page"]{color:var(--primary)}
nav.bnav .nb[aria-current="page"] .ico{background:var(--primary-soft);transform:translateY(-1px)}
nav.bnav .nb[aria-current="page"] .ico svg{stroke-width:2.6}
nav.bnav .nb:active .ico{transform:scale(.9)}
nav.bnav .nb.mid{flex:0 0 78px;justify-content:flex-end;padding-bottom:9px}
nav.bnav .orb{position:absolute;top:-26px;width:64px;height:64px;border-radius:50%;background:var(--hl);display:grid;place-items:center;border:5px solid var(--paper);box-shadow:0 5px 0 var(--hl-d);transition:transform .15s}
nav.bnav .nb.mid{position:relative}
nav.bnav .nb.mid[aria-current="page"] .orb{background:var(--primary);box-shadow:0 5px 0 var(--primary-d)}
nav.bnav .nb.mid:active .orb{transform:translateY(4px);box-shadow:0 1px 0 var(--hl-d)}
nav.bnav .nb.mid em{color:var(--ink)}
main{padding-bottom:calc(118px + env(safe-area-inset-bottom,0px))}

/* home */
.sec{font-size:1.15rem;margin:22px 2px 10px}
.today{position:relative;overflow:hidden;background:linear-gradient(140deg,#2F6BFF 0%,#4F86FF 60%,#6C9BFF 100%);color:#fff;border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:0 6px 0 var(--primary-d)}
.today::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);top:-70px;left:-50px}
.today-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.today-top small{display:block;opacity:.85;font-weight:700}.today-top b{display:block;font-size:1.3rem;font-weight:800;line-height:1.25}.today-top span{display:block;opacity:.9;font-size:.9rem}
.today-next{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;border:none;border-radius:20px;padding:12px;background:var(--card);color:var(--ink);text-align:start;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.today-next:active{transform:translateY(3px);box-shadow:none}
.today-next .ni{flex:none;width:48px;height:48px;border-radius:15px;background:var(--gold-soft);display:grid;place-items:center;font-size:1.5rem}
.today-next .nt{flex:1;min-width:0}.today-next small{display:block;color:var(--soft);font-weight:700;font-size:.8rem}.today-next b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-next .play{flex:none;width:46px;height:46px;border-radius:50%;background:var(--hl);color:var(--on-hl);display:grid;place-items:center;font-size:1.1rem;box-shadow:0 4px 0 var(--hl-d)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis .k{border-radius:20px;padding:12px 10px;text-align:center;border:2px solid transparent}
.kpis .k span{font-size:1.4rem;display:block;line-height:1.2}.kpis .k b{display:block;font-size:1.5rem;font-weight:800;line-height:1.2}.kpis .k small{color:var(--soft);font-size:.78rem;font-weight:700}
.kpis .k1{background:#FFEBDD;border-color:#FFD2B3}.kpis .k1 b{color:var(--orange)}
.kpis .k2{background:#FFF3CC;border-color:#FFE28A}.kpis .k2 b{color:#C98A00}
.kpis .k3{background:#E1F7EA;border-color:#B4EACB}.kpis .k3 b{color:var(--good-d)}
.sqgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.sqgrid{grid-template-columns:repeat(3,1fr)}}
.sq{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:2px solid var(--line);background:var(--card);border-radius:22px;padding:14px;min-height:132px;color:var(--ink);box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.sq:active{transform:translateY(4px);box-shadow:none}
.sq .ic{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:1.6rem;margin-bottom:8px;background:#E8F0FF}
.sq b{font-weight:800;font-size:1.02rem;line-height:1.3}.sq small{color:var(--soft);font-size:.8rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sqgrid>.sq:nth-child(6n+2) .ic{background:#FFF3CC}.sqgrid>.sq:nth-child(6n+3) .ic{background:#E1F7EA}.sqgrid>.sq:nth-child(6n+4) .ic{background:#FFE6EF}.sqgrid>.sq:nth-child(6n+5) .ic{background:#EFE8FF}.sqgrid>.sq:nth-child(6n+6) .ic{background:#FFEBDD}
.badge-n{position:absolute;top:10px;left:10px;min-width:24px;height:24px;border-radius:12px;background:var(--margin);color:#fff;font-style:normal;font-weight:800;font-size:.8rem;display:grid;place-items:center;padding:0 6px}
.wod{border-radius:26px;padding:16px 18px 18px;background:var(--gold-soft);border:2px solid #FFE28A;margin-bottom:10px}
.wod .guide{margin:8px 0 0}.wod .ar-big{margin:6px 0 10px}
.hubhead{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}.hubhead h1{margin:0}.hubhead p{margin:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpis .k,:root:not([data-theme="light"]) .wod{background:var(--sky);border-color:var(--line)}:root:not([data-theme="light"]) .sq .ic{background:var(--sky)!important}:root:not([data-theme="light"]) nav.bnav .orb{border-color:var(--paper)}}
:root[data-theme="dark"] .kpis .k,:root[data-theme="dark"] .wod{background:var(--sky);border-color:var(--line)}:root[data-theme="dark"] .sq .ic{background:var(--sky)!important}
@media (prefers-reduced-motion:reduce){nav.bnav .ico,nav.bnav .orb{transition:none}}

#sheet{position:fixed;inset:0;z-index:30;background:rgba(15,20,32,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheet-in{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));text-align:center;max-height:90vh;overflow-y:auto}

/* forms, auth, subscription */
.fld{display:block;text-align:start;margin:12px 0}.fld span{display:block;font-size:.88rem;font-weight:700;color:var(--soft);margin-bottom:5px}
.fld input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--sky);font-size:1rem;font-weight:600}.fld input:focus{border-color:var(--primary);background:var(--card);outline:none}
.authcard{max-width:460px;margin-left:auto;margin-right:auto}.btn.wide{width:100%;margin-top:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.cmp>div{border:2px solid var(--line);border-radius:20px;padding:14px}.cmp .pro{border-color:var(--hl);background:var(--gold-soft)}.cmp h3{margin:0 0 6px}.cmp ul{margin:0;padding-inline-start:18px}
@media (max-width:520px){.cmp{grid-template-columns:1fr}}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.plan{border:2px solid var(--line);border-radius:20px;background:var(--card);padding:16px 12px;display:flex;flex-direction:column;gap:0;align-items:center;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.plan[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 4px 0 var(--primary)}
.plan.pro{border-color:var(--hl);box-shadow:0 4px 0 var(--hl-d)}
.plan .price{font-size:1.7rem;font-weight:800;color:var(--primary)}.plan small{color:var(--soft)}
.paybox{border-radius:18px;padding:6px 16px;background:var(--sky)}.paybox .spread{padding:9px 0;border-bottom:2px solid var(--line)}.paybox .spread:last-child{border-bottom:none}
.coupon{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.coupon input{flex:1;min-width:160px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--sky);font-weight:700}
.agree{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0;font-size:.95rem}.agree input{width:20px;height:20px;accent-color:var(--primary)}
.terms h3{margin:18px 0 4px}.terms p{color:var(--ink);font-weight:500;max-width:68ch}
body.guest .bar .chip{display:none}
body.gated nav.bnav{display:none}body.gated main{padding-bottom:40px}

/* landing */
.hero{text-align:center;padding:14px 8px 26px}
.hero-in{max-width:600px;margin:0 auto}
.hero .toki{animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 14px rgba(47,107,255,.25))}
.hero .say-hi{display:inline-block;position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 16px;font-weight:800;margin-bottom:6px;box-shadow:0 4px 0 var(--line)}
.hero .say-hi::after{content:"";position:absolute;bottom:-9px;left:50%;width:14px;height:14px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.hero h1{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:800;margin:10px 0 10px;line-height:1.2}
.hero p{font-size:1.08rem;color:var(--soft);max-width:48ch;margin-left:auto;margin-right:auto}
.hero .trial{display:inline-block;background:var(--gold-soft);color:var(--ink);border:2px solid var(--hl);border-radius:14px;padding:6px 16px;margin:6px 0 18px;font-weight:700}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.feats div{border:2px solid var(--line);border-radius:20px;padding:16px}
.feats .ic{font-size:1.6rem;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:#E8F0FF;margin-bottom:8px}
.feats div:nth-child(2) .ic{background:#FFF3CC}.feats div:nth-child(3) .ic{background:#E1F7EA}.feats div:nth-child(4) .ic{background:#FFE6EF}.feats div:nth-child(5) .ic{background:#EFE8FF}.feats div:nth-child(6) .ic{background:#FFEBDD}
.feats b{display:block;margin:2px 0 4px;font-weight:800}.feats span{color:var(--soft);font-size:.92rem;font-weight:500}
.how{counter-reset:h;list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.how li{counter-increment:h;border:2px solid var(--line);border-radius:20px;padding:16px;padding-top:58px;position:relative}
.how li::before{content:counter(h);position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 3px 0 var(--primary-d)}
.how b{display:block;font-weight:800}.how span{color:var(--soft);font-size:.92rem;font-weight:500}
.faq{border-bottom:2px solid var(--line)}.faq button{width:100%;display:flex;justify-content:space-between;gap:10px;border:none;background:none;padding:14px 2px;font-weight:800;text-align:start;color:var(--ink)}
.faq button span{color:var(--primary);font-size:1.3rem}.faq p{color:var(--soft);margin:0 0 14px;font-weight:500}
.foot{text-align:center;padding:10px 0 30px}

/* ===== engagement ===== */
.toki .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.toki.t-jump{animation:tjump .55s cubic-bezier(.3,1.6,.5,1)}.toki.t-shake{animation:tshake .45s ease}
@keyframes tjump{30%{transform:translateY(-14px) scale(1.06)}60%{transform:translateY(0) scale(.97)}}
@keyframes tshake{20%,60%{transform:translateX(-6px) rotate(-4deg)}40%,80%{transform:translateX(6px) rotate(4deg)}}
#react{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;border-radius:22px;background:var(--card);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);
  transform:translate(-50%,30px) scale(.9);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .2s;max-width:calc(100vw - 24px)}
#react.show{transform:translate(-50%,0) scale(1);opacity:1}
#react.ok{border-color:#BEEBD2;box-shadow:0 5px 0 #BEEBD2;background:var(--good-bg)}#react.bad{border-color:#FFCACC;box-shadow:0 5px 0 #FFCACC;background:var(--bad-bg)}
#react b{display:block;font-weight:800;font-size:1.05rem;line-height:1.2}#react.ok b{color:var(--good-d)}#react.bad b{color:var(--margin-d)}#react span{display:block;font-size:.82rem;font-weight:700;color:var(--ink-2)}
.confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
.quests{border:2px solid var(--line);border-radius:24px;padding:8px 12px 12px;background:var(--card)}
.quest{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:10px 2px;border-bottom:2px solid var(--line);text-align:start;color:var(--ink)}
.quest .qi{flex:none;width:44px;height:44px;border-radius:14px;background:var(--sky);display:grid;place-items:center;font-size:1.3rem}
.quest.done .qi{background:var(--good-bg)}
.quest .qt{flex:1;min-width:0}.quest .qt b{display:block;font-weight:800;font-size:.95rem}
.qbar{display:block;height:10px;border-radius:99px;background:var(--rule-faint);overflow:hidden;margin-top:5px}.qbar i{display:block;height:100%;border-radius:99px;background:var(--hl)}
.quest.done .qbar i{background:var(--good)}
.quest .qn{flex:none;font-weight:800;color:var(--soft);font-size:.85rem}
.chest{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:18px;background:var(--sky)}
.chest .cb{font-size:2rem;flex:none}.chest div{flex:1}.chest b{display:block;font-weight:800}.chest span.muted{display:block;font-size:.85rem}
.chest.ready{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--hl)}.chest.ready .cb{animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;direction:ltr}
.cal i{display:block;aspect-ratio:1;border-radius:9px;background:var(--rule-faint)}.cal i.on{background:var(--orange)}.cal i.fz{background:#8FD3FF}.cal i.td{box-shadow:0 0 0 3px var(--primary-soft),0 0 0 5px var(--primary)}
.cal-l{display:flex;gap:14px;margin-top:10px;font-size:.8rem;color:var(--soft);font-weight:700}.cal-l i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--rule-faint);margin-inline-end:4px;vertical-align:-1px}.cal-l i.on{background:var(--orange)}.cal-l i.fz{background:#8FD3FF}
.rankcard{display:flex;align-items:center;gap:14px;border-radius:24px;padding:16px;margin-bottom:14px;background:linear-gradient(140deg,#8B5CF6,#B08CFF);color:#fff;box-shadow:0 6px 0 #6C3FDB}
.rankcard small{display:block;opacity:.85;font-weight:700}.rankcard b{display:block;font-size:1.4rem;font-weight:800}.rankcard>div{flex:1}
.rankcard .qbar{background:rgba(255,255,255,.3)}.rankcard .qbar i{background:#FFC940}.rankcard .nx{display:block;font-size:.82rem;margin-top:4px;opacity:.95}
.myrank{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--primary-soft);margin-bottom:12px}.myrank b{display:block;font-weight:800;font-size:1.15rem}.myrank span{display:block}
.league{list-style:none;padding:0;margin:0}
.league li{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:2px solid var(--line)}
.league .pos{flex:none;width:34px;text-align:center;font-weight:800;color:var(--soft);font-size:1.05rem}.league li.top .pos{font-size:1.5rem}
.league .nm{flex:1;font-weight:700}.league b{font-weight:800;color:#C98A00}
.league li.me{background:var(--primary-soft);border-radius:14px;border-color:transparent}
@media (prefers-reduced-motion:reduce){.toki .eyes,.toki.t-jump,.toki.t-shake,.chest.ready .cb{animation:none}#react{transition:none}}

/* ===== lists as cards ===== */
.panel:has(> .cat),.panel.list{background:transparent;border:none;padding:4px 0}
.cat{border:2px solid var(--line);border-radius:20px;background:var(--card);padding:12px 14px;margin-bottom:10px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.cat:active{transform:translateY(4px);box-shadow:none}
.cat::after{content:"‹";font-size:1.6rem;line-height:1;color:var(--rule);font-weight:800;margin-inline-start:4px}
.cat .ic{width:48px;height:48px;border-radius:16px;font-size:1.4rem}
.panel:has(> .cat) h3,.panel.list h3{margin:22px 4px 10px}
.ok-chip{background:var(--good-bg);color:var(--good-d)}
/* ===== lesson learn screen ===== */
.lesson-hero{display:flex;align-items:center;gap:14px;margin:14px 0 16px}.lesson-hero h1{margin:0;font-size:1.45rem}.lesson-hero p{margin:4px 0 0}
.lh-ic{flex:none;width:64px;height:64px;border-radius:20px;background:#EFE8FF;display:grid;place-items:center;font-size:2rem}
.explain{display:flex;gap:10px;align-items:flex-start;background:var(--primary-soft);border-radius:22px;padding:14px}.explain p{margin:0;line-height:1.9}
.exlist{display:grid;gap:10px}
.exitem{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:start;gap:2px 10px;border:2px solid var(--line);border-radius:18px;background:var(--card);padding:12px 14px;box-shadow:0 4px 0 var(--line);color:var(--ink)}
.exitem:active{transform:translateY(4px);box-shadow:none}
.exitem .en{grid-column:1;font-weight:800;font-size:1.08rem;text-align:left}.exitem small{grid-column:1;color:var(--soft);font-weight:600}.exitem .spk{grid-column:2;grid-row:1/3;width:40px;height:40px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center}
.cta-bar{display:grid;gap:12px;margin-top:22px}
/* ===== player ===== */
body.playing header.top,body.playing nav.bnav{display:none}
body.playing main{padding-top:10px;padding-bottom:180px}
.ply-top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:8px 0 12px;background:var(--paper)}
.ply-x{flex:none;width:40px;height:40px;border:none;background:none;font-size:1.4rem;color:var(--soft);font-weight:800}
.ply-bar{flex:1;height:16px;margin:0}.ply-n{flex:none;font-weight:800;color:var(--soft);font-size:.9rem}
.ply-card{padding:8px 2px}
.ply-card.enter{animation:slideIn .38s cubic-bezier(.2,.9,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
.ply-lbl{font-weight:800;font-size:1.25rem;margin:6px 0 14px}
.ply-prompt{margin-bottom:18px}
.ply-sent{font-size:1.5rem;font-weight:800;line-height:1.6;text-align:left;margin:10px 0 6px;padding:18px;border:2px solid var(--line);border-radius:22px;background:var(--card)}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--primary);color:transparent;margin:0 4px;line-height:1}
.ply-opts{display:grid;gap:12px}
.ply-opt{display:flex;align-items:center;gap:12px;margin:0;padding:14px 16px;font-size:1.12rem}
.ply-opt .ok-n{flex:none;width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--soft);font-weight:800}
.ply-opt[dir=ltr] .ot{flex:1;text-align:left}
.ply-opt.right .ok-n{border-color:var(--good);color:var(--good)}.ply-opt.wrong .ok-n{border-color:var(--margin);color:var(--margin)}
.ply-opt.chosen{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 4px 0 var(--primary)}
.ply-fb{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:fbUp .28s cubic-bezier(.2,.9,.3,1)}
.ply-fb.ok{background:#D7FFB8;border-top:2px solid #A5ED6E}.ply-fb.bad{background:#FFDFE0;border-top:2px solid #FFB2B5}
.fb-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fb-t{flex:1;min-width:160px}.fb-t>b{display:block;font-size:1.3rem;font-weight:800}.fb-t span b{font-size:1.1rem;unicode-bidi:isolate}.fb-t span{display:block;font-weight:700}
.ply-fb.ok .fb-t{color:#3E8A08}.ply-fb.bad .fb-t{color:#C0303A}
.ply-fb .btn{min-width:150px}
.btn.bad-btn{background:var(--margin);color:#fff;box-shadow:0 4px 0 var(--margin-d)}
@keyframes fbUp{from{transform:translateY(100%)}to{transform:none}}
:root[data-theme="dark"] .ply-fb.ok{background:#1D3A12}:root[data-theme="dark"] .ply-fb.bad{background:#3F1A1D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ply-fb.ok{background:#1D3A12;border-color:#2F5E1C}:root:not([data-theme="light"]) .ply-fb.bad{background:#3F1A1D;border-color:#6A2A2F}:root:not([data-theme="light"]) .ply-fb.ok .fb-t{color:#9BE36A}:root:not([data-theme="light"]) .ply-fb.bad .fb-t{color:#FF9DA1}}
/* ===== result ===== */
.result{text-align:center;padding:26px 6px}.result h1{font-size:2rem;margin:10px 0 2px}
.result .toki{animation:tjump .8s cubic-bezier(.3,1.6,.5,1) 2}
.res-stats{display:flex;justify-content:center;gap:10px;margin:20px 0;flex-wrap:wrap}
.res-stats div{min-width:100px;border:2px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--line)}
.res-stats b{display:block;font-size:1.6rem;font-weight:800;color:var(--primary)}.res-stats span{font-size:.82rem;color:var(--soft);font-weight:700}
.res-actions{display:grid;gap:12px;max-width:420px;margin:0 auto}
/* ===== chat app ===== */
body.chatmode header.top,body.chatmode nav.bnav{display:none}
body.chatmode main{padding:0;max-width:760px}
.chat-app{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--paper)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px solid var(--line);background:var(--card)}
.chat-head .back{box-shadow:none;border:none;background:var(--sky)}
.ch-av{position:relative;display:flex}.ch-av .dot{position:absolute;bottom:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--good);border:2px solid var(--card)}
.ch-t{flex:1;min-width:0}.ch-t b{display:block;font-size:1.15rem;font-weight:800;line-height:1.2}.ch-t small{display:block;color:var(--good-d);font-weight:700;font-size:.8rem}
.ch-btn{flex:none;width:42px;height:42px;border-radius:14px;border:none;background:var(--sky);font-size:1.2rem}
.ch-btn.on{background:var(--hl)}
.sc-chips{padding:8px 12px;background:var(--card);border-bottom:2px solid var(--line)}
.chat-body{flex:1;overflow-y:auto;padding:14px 12px 20px;display:flex;flex-direction:column;gap:8px;
  background-color:var(--sky);background-image:radial-gradient(rgba(47,107,255,.08) 1.2px,transparent 1.2px);background-size:18px 18px}
.day-sep{text-align:center;margin:4px 0 8px}.day-sep span{display:inline-block;background:var(--card);border-radius:10px;padding:2px 12px;font-size:.78rem;font-weight:800;color:var(--soft);box-shadow:0 1px 0 var(--line)}
.msg{display:flex;align-items:flex-end;gap:6px;max-width:100%;animation:msgIn .22s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.me{justify-content:flex-start}.msg.bot{justify-content:flex-end}
.msg .av{flex:none;margin-bottom:2px}
.msg .bub{max-width:80%;border-radius:20px;padding:9px 14px;border:none;box-shadow:0 1px 1px rgba(31,36,51,.08)}
.msg.bot .bub{background:var(--card);border-bottom-left-radius:6px}
.msg.me .bub{background:var(--primary);color:#fff;border-bottom-right-radius:6px}
.msg .bub>div{line-height:1.6}
.msg.bot .bub .say{margin-top:6px}
.fix{margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--gold-soft);border-inline-start:4px solid var(--hl);font-size:.92rem}
.chat-err{align-self:center;background:var(--bad-bg);color:var(--margin-d);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.9rem}
.chat-warn .fb{margin:0 0 8px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;justify-content:flex-end}
.composer2{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
.composer2 textarea{flex:1;resize:none;border:2px solid var(--line);border-radius:22px;padding:10px 16px;background:var(--sky);font-size:1rem;font-weight:600;line-height:1.5;max-height:120px}
.composer2 textarea:focus{outline:none;border-color:var(--primary);background:var(--card)}
.c-send,.c-mic{flex:none;width:48px;height:48px;border-radius:50%;border:none;display:grid;place-items:center;font-size:1.2rem}
.c-send{background:var(--primary);color:#fff;box-shadow:0 3px 0 var(--primary-d)}
.c-mic{background:var(--sky);color:var(--ink)}.c-mic.on{background:var(--margin);color:#fff;animation:pulse 1.2s infinite}
.c-send:disabled,.c-mic:disabled{opacity:.45}
.c-mic.big{width:76px;height:76px;font-size:1.9rem;background:var(--margin);color:#fff;box-shadow:0 5px 0 var(--margin-d)}
.voice-panel{text-align:center;padding:18px 12px calc(18px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
.voice-panel b{display:block;font-size:1.1rem;margin:8px 0 12px}
.vp-orb{display:inline-grid;place-items:center;width:120px;height:120px;border-radius:50%;background:var(--primary-soft);transition:transform .2s}
.vp-orb.speak{animation:vpSpeak 1s ease-in-out infinite}.vp-orb.listen{box-shadow:0 0 0 0 rgba(255,90,95,.4);animation:vpListen 1.4s infinite}
@keyframes vpSpeak{50%{transform:scale(1.07)}}@keyframes vpListen{0%{box-shadow:0 0 0 0 rgba(255,90,95,.35)}100%{box-shadow:0 0 0 26px rgba(255,90,95,0)}}
body.playing #toast,body.chatmode #toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){.ply-card.enter,.ply-fb,.msg,.vp-orb{animation:none!important}}
/* ===== games v2 ===== */
.gm-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.gm-head h2{flex:1;margin:0}
.match .tile.mt{min-height:62px;transition:transform .15s,opacity .35s}
.match .tile.au{font-size:1.6rem;background:var(--primary-soft);border-color:#C7D8FF;box-shadow:0 4px 0 #C7D8FF}
.match .tile.gone{opacity:0;transform:scale(.8);pointer-events:none}
.match .tile.hit{animation:pop .35s}
.match .tile.bad{animation:tshake .35s}
@keyframes pop{50%{transform:scale(1.12)}}
.round-badge{display:inline-block;background:var(--primary);color:#fff;font-weight:800;border-radius:14px;padding:6px 18px;margin-bottom:10px;box-shadow:0 4px 0 var(--primary-d)}
.stars{font-size:2.6rem;letter-spacing:6px;margin:4px 0}.stars span{color:var(--rule)}.stars span.on{color:var(--hl);text-shadow:0 3px 0 var(--hl-d)}
.newbest{font-weight:800;color:var(--good-d);font-size:1.1rem}
.timer.low{background:var(--bad-bg);color:var(--margin)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.flash-ok{animation:fok .35s}.flash-bad{animation:tshake .35s}@keyframes fok{50%{transform:scale(1.06)}}
.review-list{text-align:start;max-width:520px;margin:0 auto 16px}
.rv{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px solid var(--line)}.rv:last-of-type{border-bottom:none}
.rv b[dir=ltr]{display:block;font-size:1.1rem;font-weight:800;text-align:right}.rv span{display:block}.rv small{display:block;color:var(--soft);font-weight:600}
.letters{display:flex;justify-content:center;gap:6px;flex-wrap:nowrap;margin:16px 0}
.letters .lt{flex:1 1 0;max-width:40px;min-width:0;height:50px;border-bottom:4px solid var(--rule);display:grid;place-items:center;font-size:1.7rem;font-weight:800;text-transform:lowercase}
.letters .lt.on{border-color:var(--primary);color:var(--ink)}.letters .lt.hinted{color:#C98A00;border-color:var(--hl)}
.hint-row{display:flex;justify-content:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.qwerty{display:grid;gap:7px;max-width:520px;margin:0 auto}
.kr{display:flex;justify-content:center;gap:5px}
.key{flex:1;max-width:44px;height:50px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1.15rem;font-weight:800;color:var(--ink);box-shadow:0 3px 0 var(--line);padding:0;text-transform:lowercase}
.key:active{transform:translateY(3px);box-shadow:none}
.key.hit{background:var(--good-bg);border-color:var(--good);color:var(--good-d);box-shadow:0 3px 0 var(--good)}
.key.miss{background:var(--sky);color:var(--rule);box-shadow:none;border-color:transparent}
@media (max-width:380px){.key{height:44px;font-size:1rem;border-radius:9px}.kr{gap:3px}}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:16px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;white-space:nowrap}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.greet .toki,.hero .toki,.typing i{animation:none}.mic.on{animation:none;box-shadow:0 0 0 4px var(--hl)}.btn,.opt,.tile,.act{transition:none}}

{id:"s3",lv:"A2",t:"The Lost Phone",ar:"الهاتف الضائع",

{id:"s4",lv:"A2",t:"A Visit to the Lab",ar:"زيارة إلى المختبر",
en:["Sara felt tired for many days, so she went to the doctor. The doctor asked for a blood test.","In the morning, Sara went to the laboratory without breakfast. The technician was friendly. He took a small blood sample from her arm.","In the afternoon, the results were ready. Her iron was low. The doctor told her to eat more meat, beans, and green vegetables, and to take iron tablets."],
tr:["شعرت سارة بالتعب لأيام كثيرة، فذهبت إلى الطبيب. طلب الطبيب فحص دم.","في الصباح ذهبت سارة إلى المختبر بدون فطور. كان الفني لطيفاً. أخذ عينة دم صغيرة من ذراعها.","بعد الظهر كانت النتائج جاهزة. كان الحديد عندها منخفضاً. قال لها الطبيب أن تأكل لحماً وبقوليات وخضاراً خضراء أكثر، وأن تأخذ حبوب حديد."],

{id:"s5",lv:"A2",t:"The Rainy Day",ar:"اليوم الماطر",
en:["It was a cold winter day. Yousef was walking to school when it started to rain heavily.","He didn't have an umbrella, and his clothes got wet. An old man opened his door and said, \"Come in, son.\"","He gave Yousef a cup of hot tea and a towel. When the rain stopped, Yousef thanked him and continued to school. He never forgot that kind man."],
tr:["كان يوماً شتوياً بارداً. كان يوسف يمشي إلى المدرسة عندما بدأت تمطر بغزارة.","لم تكن معه مظلة، وتبللت ملابسه. فتح رجل عجوز بابه وقال: تفضل يا ابني.","أعطى يوسف كوب شاي ساخن ومنشفة. عندما توقف المطر شكره يوسف وأكمل طريقه إلى المدرسة. لم ينسَ أبداً ذلك الرجل الطيب."],
q:[["What season was it?",["summer","winter","spring"],"winter"],["What did the old man give him?",["food and money","tea and a towel","an umbrella"],"tea and a towel"],["What kind of man was he?",["kind","angry","young"],"kind"]]},
{id:"s6",lv:"B1",t:"Learning a New Language",ar:"تعلّم لغة جديدة",
en:["Many people believe that learning a language is only about memorizing words. However, research shows that regular practice is much more important.","If you listen to English for fifteen minutes every day, your brain slowly gets used to the sounds. Speaking, even with mistakes, builds confidence.","Experts suggest reviewing new words after one day, then after three days, then after a week. This method, called spaced repetition, helps you remember words for a long time."],
tr:["يعتقد كثير من الناس أن تعلم اللغة يعني فقط حفظ الكلمات. لكن الأبحاث تُظهر أن التدريب المنتظم أهم بكثير.","إذا استمعت للإنجليزية خمس عشرة دقيقة يومياً، يعتاد دماغك تدريجياً على الأصوات. والكلام، حتى مع الأخطاء، يبني الثقة.","ينصح الخبراء بمراجعة الكلمات الجديدة بعد يوم، ثم بعد ثلاثة أيام، ثم بعد أسبوع. هذه الطريقة، اسمها التكرار المتباعد، تساعدك على تذكر الكلمات لمدة طويلة."],
q:[["According to research, what is more important?",["memorizing words","regular practice","reading grammar books"],"regular practice"],["What does speaking build?",["confidence","vocabulary lists","money"],"confidence"],["What is the method called?",["fast reading","spaced repetition","word lists"],"spaced repetition"]]},
{id:"s7",lv:"B1",t:"The Olive Harvest",ar:"موسم قطف الزيتون",
en:["Every October, families in Palestine gather in the fields for the olive harvest. It is not just work; it is a tradition that has continued for hundreds of years.","Children, parents, and grandparents work together from early morning. They spread large sheets under the trees and shake the branches until the olives fall.","At lunchtime, everyone sits in the shade and eats bread with fresh oil and thyme. Although the work is hard, most people say it is the most beautiful time of the year."],
tr:["كل شهر أكتوبر تجتمع العائلات في فلسطين في الحقول لقطف الزيتون. إنه ليس مجرد عمل؛ بل تقليد استمر مئات السنين.","يعمل الأطفال والآباء والأجداد معاً منذ الصباح الباكر. يفرشون أغطية كبيرة تحت الأشجار ويهزّون الأغصان حتى يسقط الزيتون.","وقت الغداء يجلس الجميع في الظل ويأكلون الخبز مع الزيت الطازج والزعتر. بالرغم من أن العمل متعب، يقول أغلب الناس إنه أجمل وقت في السنة."],
q:[["When is the olive harvest?",["in May","in October","in January"],"in October"],["What do they put under the trees?",["boxes","large sheets","bags"],"large sheets"],["What do they eat at lunch?",["rice and chicken","bread with oil and thyme","fish"],"bread with oil and thyme"]]},
{id:"s8",lv:"B1",t:"An Unexpected Opportunity",ar:"فرصة غير متوقعة",
en:["Layla had always wanted to become a programmer, but she studied biology at university because her family expected her to.","After graduating, she taught herself coding online in the evenings. At first it was difficult, and she almost gave up several times.","One day, a small company was looking for someone who understood both science and software. Layla applied, and because of her unusual mix of skills, she got the job. She now builds apps for hospitals and laboratories."],
tr:["كانت ليلى دائماً تريد أن تصبح مبرمجة، لكنها درست الأحياء في الجامعة لأن عائلتها توقعت منها ذلك.","بعد التخرج علّمت نفسها البرمجة عبر الإنترنت في المساء. في البداية كان الأمر صعباً، وكادت تستسلم عدة مرات.","في يوم من الأيام، كانت شركة صغيرة تبحث عن شخص يفهم العلوم والبرمجيات معاً. تقدمت ليلى، وبسبب مزيج مهاراتها غير المألوف حصلت على الوظيفة. هي الآن تبني تطبيقات للمستشفيات والمختبرات."],
q:[["What did Layla study at university?",["programming","biology","medicine"],"biology"],["When did she learn coding?",["in the mornings","in the evenings","at university"],"in the evenings"],["Why did she get the job?",["her mix of skills","her family","her age"],"her mix of skills"]]}
];

{id:"s9",lv:"B2",t:"The Power of Small Habits",ar:"قوة العادات الصغيرة",
en:["Most people overestimate what they can achieve in a week and underestimate what they can achieve in a year. The secret, according to many psychologists, lies in small habits.","Improving by just one percent every day might seem insignificant, yet over twelve months the effect is enormous. Someone who reads ten pages a day will have finished more than a dozen books by the end of the year.","The difficulty is that the results of good habits are delayed, while the rewards of bad habits are immediate. That is why successful people focus on the process rather than the goal: they design their environment so that the right choice becomes the easy choice."],
tr:["معظم الناس يبالغون في تقدير ما يمكنهم إنجازه في أسبوع ويستهينون بما يمكنهم إنجازه في سنة. السر، حسب كثير من علماء النفس، يكمن في العادات الصغيرة.","التحسّن بنسبة واحد بالمئة فقط كل يوم قد يبدو غير مهم، لكن خلال اثني عشر شهراً يكون الأثر هائلاً. من يقرأ عشر صفحات يومياً سيكون قد أنهى أكثر من اثني عشر كتاباً مع نهاية السنة.","الصعوبة أن نتائج العادات الجيدة متأخرة، بينما مكافآت العادات السيئة فورية. لهذا يركز الناجحون على العملية بدلاً من الهدف: يصممون بيئتهم بحيث يصبح الخيار الصحيح هو الخيار السهل."],

en:["It was three in the morning when the emergency department called the laboratory. A young patient had arrived with severe symptoms, and the doctors needed results urgently.","Nadia, who had been working alone since midnight, noticed that the first result looked unusual. Rather than sending it immediately, she decided to repeat the test. The second result was completely different: the first sample had been contaminated.","Had she not checked, the patient might have received the wrong treatment. The next morning, her manager said something she never forgot: \"Speed matters, but accuracy saves lives.\""],
tr:["كانت الساعة الثالثة فجراً عندما اتصل قسم الطوارئ بالمختبر. وصل مريض شاب بأعراض شديدة، وكان الأطباء يحتاجون النتائج بسرعة.","لاحظت نادية، التي كانت تعمل وحدها منذ منتصف الليل، أن النتيجة الأولى تبدو غير طبيعية. بدلاً من إرسالها فوراً قررت إعادة الفحص. كانت النتيجة الثانية مختلفة تماماً: العينة الأولى كانت ملوثة.","لو لم تتحقق، لربما تلقى المريض علاجاً خاطئاً. في الصباح التالي قال لها مديرها جملة لم تنسها أبداً: السرعة مهمة، لكن الدقة تنقذ الأرواح."],

const NUM={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","12":"twelve"};
function norm(s){return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim().split(" ").map(w=>NUM[w]||w).join(" ")}
function lcs(a,b){const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const r=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){r[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}return r}
function compare(target,typed){const orig=target.split(/\s+/);const tn=orig.map(w=>norm(w));const bn=norm(typed).split(" ").filter(Boolean);

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}

function pickVoice(alt){const same=voices.filter(v=>v.lang.replace("_","-")===S.accent);const en=voices.filter(v=>v.lang.startsWith("en"));const list=same.length?same:en;if(!list.length)return null;return alt&&list.length>1?list[1]:list[0]}
function speak(t,o={}){
  if(!("speechSynthesis" in window)){toast("المتصفح ما بدعم الصوت");return}
  if(!o.keep)speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang=S.accent;const v=pickVoice(o.alt);if(v)u.voice=v;
  u.rate=o.slow?Math.max(.5,S.rate-.35):S.rate;u.pitch=o.pitch||1;
  if(o.onend)u.onend=o.onend;if(o.onstart)u.onstart=o.onstart;speechSynthesis.speak(u)}
let seqId=0;
function speakSeq(items,done){const id=++seqId;speechSynthesis.cancel();let i=0;
  const next=()=>{if(id!==seqId)return;if(i>=items.length){done&&done();return}const it=items[i++];it.start&&it.start();speak(it.t,{keep:true,pitch:it.pitch,alt:it.alt,onend:()=>setTimeout(next,250)})};next()}
function stopSpeak(){seqId++;try{speechSynthesis.cancel()}catch(e){}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const SRERR={"not-allowed":"لازم تسمح للموقع يستخدم الميكروفون من إعدادات المتصفح.","service-not-allowed":"لازم تسمح للموقع يستخدم الميكروفون من إعدادات المتصفح.","no-speech":"ما سمعت شي، قرّب الجهاز واحكِ بصوت أوضح.","network":"التعرّف على الصوت بدو اتصال إنترنت.","audio-capture":"ما في ميكروفون شغّال على الجهاز."};

function listen(onAlts,onErr,onEnd){
  if(!SR){onErr("المتصفح هاد ما بدعم التعرّف على الصوت. استخدم Chrome أو Safari حديث.");onEnd&&onEnd();return}
  if(recOn&&rec){rec.stop();return}
  stopSpeak();rec=new SR();rec.lang=S.accent;rec.interimResults=false;rec.maxAlternatives=4;recOn=true;
  rec.onresult=e=>onAlts([...e.results[0]].map(r=>r.transcript));
  rec.onerror=e=>onErr(SRERR[e.error]||"صار خطأ بالتسجيل، جرّب مرة ثانية.");
  rec.onend=()=>{recOn=false;onEnd&&onEnd()};

async function rGen(){

  const prompt=`Write an original short story in English for an Arabic-speaking learner at CEFR level ${lv}, about this topic (it may be written in Arabic): "${topic}".

Reply with ONLY a JSON object, no markdown:
{"title":"English title","title_ar":"Arabic title","paragraphs":["p1","p2","p3"],"translation":["Arabic of p1","Arabic of p2","Arabic of p3"],"questions":[{"q":"comprehension question in English","options":["a","b","c"],"answer":"must be exactly one of the options"}]}
Give exactly 3 questions.`;

function tuRules(sc){

  return `You are ${sc.role} The learner is an Arabic speaker practicing English at CEFR level ${userLv()}.
Rules:
1. Reply in natural, simple English suited to level ${userLv()}: 1-3 short sentences, then a question to keep the conversation going.
2. If the learner's latest message has grammar, spelling or word-choice mistakes, add a new final line that starts with "✏️" and gives a short correction in Arabic, including the corrected English sentence. If there are no mistakes, do not add that line.

async function tuSend(text){

  try{const r=await AI(turns,{cache:false,signal:aiCtl.signal,modelTier:"quick",onText:({text})=>{bot.content=text;if(!added){msgs.push(bot);added=true;render()}else{const b=document.querySelectorAll("#chatBox .bub.a > div");const last=b[b.length-1];if(last)last.innerHTML=md(text);const c=$("#chatBox");if(c)c.scrollTop=c.scrollHeight}}});
    bot.content=r.text;if(!added)msgs.push(bot);S.st.chat++;addXP(3)}
  catch(e){if(e&&e.text){bot.content=e.text;if(!added)msgs.push(bot)}else if(added)msgs.pop();if(!e||e.code!=="cancelled")TU.err=aiErr(e)}

function examQs(lv){
  const qs=[],words=shuffle(ALL.filter(w=>w.lv===lv));
  words.slice(0,8).forEach((w,i)=>{const o=shuffle(ALL.filter(x=>x.ar!==w.ar&&x.en!==w.en)).slice(0,3);
    qs.push(i%2?{t:"ar2en",p:w.ar,opts:shuffle([w.en,...o.map(x=>x.en)]),a:w.en}:{t:"en2ar",p:w.en,opts:shuffle([w.ar,...o.map(x=>x.ar)]),a:w.ar})});
  shuffle(LESSONS.filter(l=>l.lv===lv).flatMap(l=>l.q)).slice(0,8).forEach(q=>qs.push({t:"gram",p:q[0],opts:shuffle(q[1]),a:q[2]}));
  const ss=SENT.filter(s=>s.lv===lv);
  shuffle(ss).slice(0,4).forEach(s=>{const o=shuffle(ss.filter(x=>x.en!==s.en)).slice(0,2);qs.push({t:"listen",p:s.en,opts:shuffle([s.en,...o.map(x=>x.en)]),a:s.en})});

const dayOf=ms=>new Date(ms).toISOString().slice(0,10);
function isoWeek(d){d=d||new Date();const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume().catch(()=>{});return AC}
function tone(f,t0,d,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.16,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function sfx(k){
  if(S.vibe!==false&&navigator.vibrate){try{navigator.vibrate(k==="bad"?[35,45,35]:k==="win"||k==="chest"?[25,50,25,50,70]:k==="ok"||k==="combo"?18:0)}catch(e){}}
  if(S.sound===false)return;
  if(k==="ok"){tone(784,0,.11,"triangle");tone(1175,.08,.2,"triangle")}
  else if(k==="bad"){tone(233,0,.16,"sawtooth",.05);tone(175,.11,.22,"sawtooth",.045)}
  else if(k==="win"){[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.26,"triangle",.15));tone(1568,.46,.45,"sine",.1)}
  else if(k==="combo"){tone(988,0,.07,"square",.05);tone(1319,.06,.12,"square",.05)}
  else if(k==="tap"){tone(660,0,.05,"sine",.06)}
  else if(k==="chest"){[392,523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.07,.22,"triangle",.13))}}

/* ---------- confetti ---------- */
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);const W=cv.width=innerWidth,H=cv.height=innerHeight,g=cv.getContext("2d");
  const C=["#2F6BFF","#FFC940","#1DB36B","#FF6B9A","#8B5CF6","#FF8A1F"];
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*15-5,s:Math.random()*8+5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:C[Math.random()*C.length|0],sh:Math.random()<.5}));
  const t0=performance.now();(function f(t){const k=(t-t0)/1000;g.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.globalAlpha=Math.max(0,1-k/2.4);g.fillStyle=p.c;
      if(p.sh)g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else{g.beginPath();g.arc(0,0,p.s/2.6,0,7);g.fill()}g.restore()});
    if(k<2.4)requestAnimationFrame(f);else cv.remove()})(t0)}

/* ---------- overrides of core progress functions ---------- */
function touchDay(){const t=dayStr(new Date());if(S.today.d!==t)S.today={d:t,xp:0};if(S.last===t)return;
  const y=dayOf(Date.now()-864e5),y2=dayOf(Date.now()-2*864e5);
  if(S.last===y)S.streak++;
  else if(S.last===y2&&(S.freeze||0)>0){S.freeze--;S.streak++;S.frozen=(S.frozen||[]).concat([y]).slice(-30);setTimeout(()=>toast("🧊 حماية السلسلة حفظت سلسلتك!"),900)}
  else S.streak=1;
  S.last=t;const cut=dayOf(Date.now()-70*864e5);S.days=(S.days||[]).filter(d=>d>=cut);if(!S.days.includes(t))S.days.push(t);
  if(S.streak%7===0&&(S.freeze||0)<2){S.freeze=(S.freeze||0)+1;setTimeout(()=>toast("🧊 كسبت حماية سلسلة!"),1800)}}

    return `<button class="opt ply-opt ${c}" data-act="plypick" data-k="${k}" ${P.picked!==null?"disabled":""} ${q.ltr?'dir="ltr"':""}><span class="ok-n">${k+1}</span><span class="ot">${esc(o)}</span></button>`}).join("");

function gStart(g){stopGame();S.st.games++;save();checkAch();GM.g=g;

      if(left<=0){stopGame();s.over=true;const B=S.gbest=S.gbest||{};if(s.score>(B.speed||0)){B.speed=s.score;s.newBest=true}
        s.log.filter(x=>!x.ok).forEach(x=>quietMistake(x.w.en,x.w.ar,"تحدي السرعة"));save();if(s.score)addXP(Math.min(12,s.score));sfx("win");if(s.newBest)confetti();render()}
      else{if(el)el.textContent=left;if(bar)bar.style.width=(100*left/60)+"%";const tc=el&&el.parentElement;if(tc)tc.classList.toggle("low",left<=10)}},250)}
  if(g==="hang"){GM.h={w:pick(poolWords().filter(w=>/^[a-z]+$/i.test(w.en)&&w.en.length>=4)),g:new Set(),lives:6,hints:0,hinted:new Set()}}
  render()}
function nextSpeed(){const w=pick(poolWords());const ok=Math.random()<.5;GM.s.w=w;GM.s.ok=ok;GM.s.shown=ok?w.ar:pick(ALL.filter(x=>x.ar!==w.ar)).ar}
function mRound(){const m=GM.m,used=new Set(m.words.map(w=>w.en));
  const pool=shuffle(poolWords().filter(w=>w.en.length<14&&!used.has(w.en)&&(m.mode!=="listen"||!/\s/.test(w.en)||w.en.length<12)));
  const ws=[];const seenAr=new Set();for(const w of pool){if(ws.length>=6)break;if(seenAr.has(w.ar))continue;seenAr.add(w.ar);ws.push(w)}
  m.cur=ws;m.words=m.words.concat(ws);m.matched=new Set();m.sel=null;m.bad=m.bad2=null;
  m.tiles=shuffle(ws.flatMap((w,i)=>[{id:i,txt:w.en,side:"en",w},{id:i,txt:m.mode==="listen"?w.en:w.ar,side:m.mode==="listen"?"au":"ar",w}]))}
function mTick(){stopGame();gTimer=setInterval(()=>{const el=$("#mtime");if(el&&GM.m&&!GM.m.done)el.textContent=fmtT(Date.now()-GM.m.start)},500)}
Object.assign(A,{
  gstart:d=>gStart(d.g),
  gquit:()=>{stopGame();GM.g=null;render()},
  mstart:d=>{GM.m={mode:d.m,round:1,words:[],miss:0,start:Date.now()};mRound();mTick();render()},
  mtile:d=>{const m=GM.m,i=+d.i,t=m.tiles[i];if(!t||m.matched.has(t.id))return;m.bad=m.bad2=null;m.hit=null;
    if(t.side==="au"||(t.side==="en"&&m.mode==="meaning"))speak(t.w.en);
    if(m.sel===null||m.tiles[m.sel].side===t.side){m.sel=i;render();return}
    const s=m.tiles[m.sel];
    if(s.id===t.id){m.matched.add(t.id);m.hit=t.id;m.sel=null;sfx("ok");

async function callAI(system,messages,signal){

  catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};throw{code:"upstream_error"}}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw{code:d.error==="rate_limited"?"rate_limited":d.error==="not_subscribed"?"not_granted":d.error==="ai_not_configured"?"ai_not_configured":"upstream_error"};
  return d.text||""}
const aiShim=async(input,opts={})=>{let system,messages;
  if(typeof input==="string")messages=[{role:"user",content:input}];else{system=input[0].content;messages=input.slice(1)}
  const text=await callAI(system,messages,opts.signal);if(!text)throw{code:"empty_completion"};opts.onText&&opts.onText({text,delta:text});return{text,truncated:false}};
aiShim.json=async(prompt,opts={})=>{const {text}=await aiShim(prompt+"\n\nReturn raw JSON only, with no code fences.",opts);
  const s=text.replace(/```json|```/g,"");const a=s.indexOf("{"),b=s.lastIndexOf("}");try{return JSON.parse(s.slice(a,b+1))}catch(e){throw{code:"invalid_json"}}};

const STAT={pending:["⏳","قيد المراجعة"],approved:["✅","مفعّل"],rejected:["❌","مرفوض"]};
function vSubscribe(){

      <div class="pro"><h3>⭐ مشترك</h3><ul><li>كل المستويات <span class="en">A1 → B2</span></li><li>المعلم الذكي: محادثة وتصحيح فوري</li><li>تصحيح الكتابة الحرة</li><li>قصص ذكية بلا حدود</li><li>حفظ تقدّمك على أي جهاز</li></ul></div></div>
  </section>

    <div class="coupon">${SUB.coupon?`<span class="chip">🏷️ ${esc(SUB.coupon.code)} — خصم ${pct}%</span><button class="say" data-act="coupondel">✕ شيل الكود</button>`:`<input id="subCoupon" data-keep dir="ltr" placeholder="كود خصم (إذا عندك)" autocomplete="off"><button class="btn ghost" data-act="couponapply">تطبيق</button>`}</div>
  </section>
  <section class="panel"><h2>2. حوّل المبلغ${plan?` (${fin(plan)} ${CFG.CURRENCY})`:""}</h2>
    <div class="row" style="margin-bottom:10px">${CFG.PAYMENT_METHODS.map(x=>`<button class="chipbtn" data-act="submeth" data-id="${x.id}" aria-pressed="${x.id===SUB.method}">${x.icon} ${esc(x.name)}</button>`).join("")}</div>
    ${meth?`<div class="paybox">${meth.details.map(l=>`<div class="spread"><span>${esc(l)}</span><button class="say" data-act="copy" data-t="${esc(l.split(":").slice(1).join(":").trim()||l)}">نسخ</button></div>`).join("")}</div>`:""}
  </section>
  <section class="panel"><h2>3. أرسل تأكيد التحويل</h2>
    ${pending?`<div class="fb" style="background:var(--sky)">⏳ عندك طلب قيد المراجعة. التفعيل بيتم ${esc(CFG.ACTIVATION_TIME)}.</div>`:""}
    <label class="fld"><span>رقم الحوالة / المرجع</span><input id="subRef" data-keep dir="ltr" autocomplete="off"></label>
    <label class="fld"><span>صورة الإيصال (اختياري، لحد 5 ميغا)</span><input id="subFile" type="file" accept="image/*,application/pdf"></label>
    ${SUB.err?`<div class="fb bad">${esc(SUB.err)}</div>`:""}${SUB.msg?`<div class="fb good">${esc(SUB.msg)}</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn hl" data-act="subsend" ${SUB.busy?"disabled":""}>${SUB.busy?"عم يرسل…":"أرسل طلب التفعيل"}</button>
      <a class="btn ghost" href="${wa}" target="_blank" rel="noopener">💬 واتساب</a></div>
    <p class="muted" style="margin-top:8px">بعد ما نتأكد من التحويل بنفعّل حسابك ${esc(CFG.ACTIVATION_TIME)}، وبتفتحلك كل الميزات تلقائياً.</p>
  </section>

async function subSend(){
  const ref=val("subRef"),fi=$("#subFile"),f=fi&&fi.files&&fi.files[0];SUB.err=null;SUB.msg=null;
  if(!SUB.plan||!SUB.method){SUB.err="اختار الخطة وطريقة الدفع.";render();return}
  if(!ref&&!f){SUB.err="اكتب رقم الحوالة أو ارفع صورة الإيصال.";render();return}
  if(f&&f.size>5e6){SUB.err="حجم الصورة أكبر من 5 ميغا.";render();return}
  SUB.busy=true;render();
  try{let path=null;
    if(f){const ext=((f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,""))||"jpg";path=`${AUTH.user.id}/${Date.now()}.${ext}`;
      const {error}=await sb.storage.from("proofs").upload(path,f,{contentType:f.type||undefined});if(error)throw error}
    const {error}=await sb.from("payment_requests").insert({user_id:AUTH.user.id,plan_id:SUB.plan,method:SUB.method,reference:ref,proof_path:path,coupon:SUB.coupon?SUB.coupon.code:null});
    if(error)throw error;
    clearField("subRef");const sf=$("#subFile");if(sf)sf.value="";SUB.msg="وصلنا طلبك ✅ رح نفعّل حسابك "+CFG.ACTIVATION_TIME+".";SUB.plans=null;await loadSub()}
  catch(e){SUB.err=/too_many_pending/.test(e.message||"")?"عندك 3 طلبات معلّقة، استنى لحد ما نراجعها.":/invalid_coupon/.test(e.message||"")?"كود الخصم مش صالح أو انتهى.":"ما قدرنا نرسل الطلب: "+(e.message||"")}
  SUB.busy=false;render()}

/* ---------- لوحات إضافية ---------- */
function vAccountPanel(){const p=AUTH.profile||{},prem=isPremium();
  return `<section class="panel"><div class="spread"><div><h2 style="margin:0">${esc(p.full_name||"حسابي")}</h2><p class="muted en" style="text-align:right;margin:0">${esc(AUTH.user.email)}</p></div><span class="chip">${p.role==="admin"?"👑 أدمن":prem&&p.is_trial?"🎁 تجربة":prem?"⭐ مشترك":"مجاني"}</span></div>
    <p style="margin-top:10px">${prem&&p.is_trial?`تجربتك المجانية بتخلص <b>${fmtDate(p.plan_until)}</b>.`:prem&&p.plan_until?`اشتراكك فعّال لحد <b>${fmtDate(p.plan_until)}</b>.`:prem?"":"إنت على الخطة المجانية (محتوى A1)."}</p>

function vPremiumBanner(){if(!AUTH.user)return "";const p=AUTH.profile||{};
  if(!isPremium())return `<section class="panel hlpanel"><div class="spread"><div><b>⭐ افتح كل المحتوى</b><p class="muted" style="margin:0">كل المستويات لحد B2، المعلم الذكي، وتصحيح الكتابة.</p></div><button class="btn hl" data-act="go" data-r="subscribe">اشترك</button></div></section>`;

  if(p.role!=="admin"&&daysLeft()<=5)return `<section class="panel hlpanel"><div class="spread"><b>⏰ اشتراكك بيخلص بعد ${daysLeft()} يوم</b><button class="btn hl" data-act="go" data-r="subscribe">جدّد</button></div></section>`;return ""}

/* ---------- قفل المحتوى المدفوع ---------- */
function itemLv(act,d){
  if(act==="wcat")return (CATS.find(c=>c.id===d.id)||{}).lv;
  if(act==="gopen")return (LESSONS.find(x=>x.id===d.id)||{}).lv;
  if(act==="dopen")return (DIALOGS.find(x=>x.id===d.id)||{}).lv;
  if(act==="ropen"){const s=STORIES.find(x=>x.id===d.id);return s?s.lv:"PRO"}
  if(act==="exopen")return d.lv;
  if(act==="openpath"){if(d.t==="exam")return d.id;return itemLv({cat:"wcat",lesson:"gopen",dialog:"dopen",story:"ropen"}[d.t],d)}
  return null}
function gateCheck(act,d){if(!AUTH.user||isPremium())return false;const lv=itemLv(act,d);
  if(lv&&lv!=="A1"){go("subscribe");toast("🔒 هاد المحتوى للمشتركين");return true}return false}

/* ---------- الأفعال ---------- */
Object.assign(A,{
  authmode:d=>{AUTH.mode=d.m;AUTH.err=null;AUTH.msg=null;render()},
  dologin:async()=>{const e=val("liEmail"),p=($("#liPass")||{}).value||"";if(!e||!p){AUTH.err="عبّي الإيميل وكلمة السر.";render();return}
    AUTH.busy=true;AUTH.err=null;render();const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){AUTH.busy=false;AUTH.err=authErr(error);render()}},
  dosignup:async()=>{const n=val("suName"),ph="",e=val("suEmail"),p=($("#suPass")||{}).value||"";
    if(!n||!e||!p){AUTH.err="عبّي الاسم والإيميل وكلمة السر.";render();return}if(!AUTH.agree){AUTH.err="لازم توافق على الشروط.";render();return}if(p.length<6){AUTH.err="كلمة السر لازم تكون 6 أحرف على الأقل.";render();return}
    AUTH.busy=true;AUTH.err=null;render();
    const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n,phone:ph,ref:pendingRef()},emailRedirectTo:location.href.split("#")[0]}});
    AUTH.busy=false;if(error){AUTH.err=authErr(error);render();return}
    if(!data.session){AUTH.email=e;AUTH.mode="check";render()}},
  doforgot:async()=>{const e=val("fgEmail");if(!e){AUTH.err="اكتب إيميلك.";render();return}
    AUTH.busy=true;render();const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split("#")[0]});AUTH.busy=false;
    if(error)AUTH.err=authErr(error);else{AUTH.msg="بعتنالك رابط على الإيميل.";AUTH.mode="login"}render()},
  donewpass:async()=>{const p=($("#npPass")||{}).value||"";if(p.length<6){AUTH.err="كلمة السر لازم تكون 6 أحرف على الأقل.";render();return}
    const {error}=await sb.auth.updateUser({password:p});if(error){AUTH.err=authErr(error);render();return}AUTH.recovery=false;AUTH.err=null;toast("تم تغيير كلمة السر ✅");render()},
  logout:async()=>{if(!confirm("تسجيل خروج؟"))return;await syncNow();await sb.auth.signOut()},
  subplan:d=>{SUB.plan=d.id;render()},
  couponapply:async()=>{const c=val("subCoupon");if(!c){toast("اكتب الكود");return}const {data,error}=await sb.rpc("check_coupon",{c});
    if(error||!data){SUB.err="كود الخصم مش صالح أو انتهى.";SUB.coupon=null}else{SUB.coupon={code:c.toUpperCase(),pct:data};SUB.err=null;clearField("subCoupon");toast("🏷️ تم تطبيق خصم "+data+"%")}render()},
  coupondel:()=>{SUB.coupon=null;render()},
  install:async()=>{if(!INSTALL)return;INSTALL.prompt();try{await INSTALL.userChoice}catch(e){}INSTALL=null;render()},
  authpage:d=>{AUTH.page=d.p||null;render();window.scrollTo(0,0)},
  agree:()=>{AUTH.agree=!AUTH.agree},
  faq:d=>{LAND.faq=LAND.faq===+d.i?-1:+d.i;render()},
  landgo:d=>{AUTH.mode=d.m;AUTH.err=null;render();const c=$("#authcard");if(c)c.scrollIntoView({behavior:"smooth",block:"start"})},
  submeth:d=>{SUB.method=d.id;render()},
  subsend:subSend,
  subreload:()=>{SUB.plans=null;render()},
  copy:d=>{try{navigator.clipboard.writeText(d.t);toast("انتسخ ✅")}catch(e){toast(d.t)}}
});

function userFirstName(){return ((AUTH.profile&&AUTH.profile.full_name)||S.name||"").trim().split(/\s+/)[0]||""}
function certName(){return (AUTH.profile&&AUTH.profile.full_name)||S.name||"Student"}
function appName(){return CFG.APP_NAME}

/* ---------- إحصائيات الزوار (زيارة وحدة لكل جلسة) ---------- */
function trackVisit(){try{
  if(sessionStorage.getItem("su_v"))return;sessionStorage.setItem("su_v","1");
  const q=new URLSearchParams(location.search);let src=(q.get("src")||q.get("utm_source")||"").toLowerCase();
  if(!src&&document.referrer){try{const h=new URL(document.referrer).hostname.replace(/^www\.|^m\.|^l\.|^lm\./,"");if(h&&h!==location.hostname)src=h}catch(e){}}
  const device=isStandalone()?"app":/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"mobile":"desktop";
  sb.from("visits").insert({source:src.slice(0,60)||null,device,logged_in:!!AUTH.user}).then(()=>{},()=>{});
}catch(e){}}

/* ---------- الدوري + الدعوات ---------- */
{const r=new URLSearchParams(location.search).get("ref");if(r)try{localStorage.setItem("su_ref",r.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,20))}catch(e){}}
const pendingRef=()=>{try{return localStorage.getItem("su_ref")||""}catch(e){return ""}};
function myRefCode(){return (AUTH.profile&&AUTH.profile.ref_code)||""}
async function leagueLoad(){LG.loading=true;LG.err=null;try{await syncNow();const {data,error}=await sb.rpc("leaderboard");if(error)throw error;LG.rows=data.rows||[];LG.me=data.me}
  catch(e){LG.rows=null;LG.err="الدوري مش جاهز لسا (لازم تحديث قاعدة البيانات v4)."}LG.loading=false;if(route==="league")render()}

    <div class="row" style="justify-content:center"><button class="btn" data-act="copy2" data-t="${esc(link)}">نسخ الرابط</button>
      <a class="btn good" href="https://wa.me/?text=${encodeURIComponent(msg+"\n"+link)}" target="_blank" rel="noopener">واتساب</a>
      <button class="btn ghost" data-act="invshare" data-t="${esc(msg)}" data-l="${esc(link)}">مشاركة</button></div></section>`}
VIEWS.invite=vInvite;PARENT.invite="me";
A.invshare=async d=>{try{if(navigator.share){await navigator.share({text:d.t,url:d.l});return}}catch(e){if(e&&e.name==="AbortError")return}A.copy2({t:d.l})};

/* ---------- التشغيل ---------- */
applyTheme();render();
sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==="PASSWORD_RECOVERY"){AUTH.recovery=true}
  const uid=session&&session.user?session.user.id:null;
  if(ev==="INITIAL_SESSION"){AUTH.user=session?session.user:null;setTimeout(trackVisit,1500)}
  if(ev==="INITIAL_SESSION"||uid!==AUTH.uid){AUTH.uid=uid;setTimeout(()=>onSession(session),0)}
  else if(ev==="PASSWORD_RECOVERY")setTimeout(render,0);
});
