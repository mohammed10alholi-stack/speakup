# نشر تلقائي لفنكشن توكي على Supabase
# بيشتغل لحاله كل ما يتغيّر ملف داخل supabase/functions
name: Deploy tutor function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-tutor.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jqimkyqszlwnndddizkf
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: supabase functions deploy tutor --project-ref "$PROJECT_REF"
